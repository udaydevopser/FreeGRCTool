ies. Typical processes for managing configuration changes to information systems include, for example, Configuration Control Boards that approve proposed changes to systems.</p><p>For new development information systems or systems undergoing major upgrades, organizations consider including representatives from development organizations on the Configuration Control Boards. Auditing of changes includes activities before and after changes are made to organizational information systems and the auditing activities required to implement such changes.</p><p>CM.L2-3.4.6: Employ the principle of least functionality by configuring organizational systems to provide only essential capabilities</p><p>LP3:</p><p>• Configures the information system to provide only essential capabilities; and</p><p>• Prohibits or restricts the use of the functions, ports, protocols, and/or services referenced in the Security Configuration Check List.</p><p>Information systems can provide a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions). Additionally, it is sometimes convenient to provide multiple services from single information system components, but doing so increases risk over limiting the services provided by any one component. Where feasible, organizations should limit component functionality to a single function per device (e.g., email servers or web servers, but not both).</p><p>Organizations review functions and services provided by information systems or individual components of information systems, to determine which functions and services are candidates for elimination (e.g., Voice Over Internet Protocol, Instant Messaging, auto-execute, and file sharing). Organizations should consider disabling unused or unnecessary physical and logical ports/protocols (e.g., Universal Serial Bus, File Transfer Protocol, and Hyper Text Transfer Protocol) on information systems to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling.</p><p>Organizations can utilize network scanning tools, intrusion detection and prevention systems, and end-point protections such as firewalls and host-based intrusion detection systems to identify and prevent the use of prohibited functions, ports, protocols, and services.</p><p>Periodic Review</p><p>LP3 reviews the information system annually to identify unnecessary and/or unsecure functions, ports, protocols, and services such as: Bluetooth, wireless adapters, Computer vendor utility software, FTP, peer-to-peer networking, and other services referenced in the Security Configuration Check List.</p><p>Upon discovery, LP3 will disable any information system deemed to be unnecessary and/or unsecure.</p><p>Prevent Program Execution</p><p>The information system prevents program execution in accordance with policies regarding software program usage and restrictions referenced in the LP3 Employee Handbook and by the use of software called AppLocker and System Center Configuration Manager (SCCM), or other similar product(s).</p><p>Registration Compliance</p><p>LP3 ensures compliance with services referenced in the Security Configuration Check List, in NIST SP 800-70 Rev 4.</p><p>Organizations use the registration process to manage, track, and provide oversight for information systems and implemented functions, ports, protocols, and services.</p><p>Unauthorized Software/Blacklisting</p><p>LP3:</p><p>• Identifies the list within AppLocker and SCCM or other similar product(s) of software programs not authorized to execute on the information system.</p><p>• Employs an allow-all, deny-by-exception policy to prohibit the execution of unauthorized software programs on the information system using AppLocker and SCCM; and</p><p>• Reviews and updates the list within AppLocker and SCCM of unauthorized software programs annually.</p><p>The process used to identify software programs that are not authorized to execute on organizational information systems is commonly referred to as blacklisting. Organizations can implement whitelisting (the stronger of the two policies) is the preferred approach for restricting software program execution.</p><p>CM.L2-3.4.7: Restrict, disable, or prevent the use of nonessential programs, functions, ports, protocols, and services</p><p>LP3:</p><p>• Establishes and documents configuration settings for information technology products employed within the information system using Security Configuration Check Lists that reflect the most restrictive mode consistent with operational requirements.</p><p>• Implements the configuration settings.</p><p>• Identifies, documents, and approves any deviations from established configuration settings for workstations, notebook computers, servers, or mobile devices; and</p><p>• Monitors and controls change to the configuration settings in accordance with organizational policies and procedures.</p><p>Configuration settings are the set of parameters that can be changed in hardware, software, or firmware components of the information system that affect the security posture and/or functionality of the system. Information technology products for which security-related configuration settings can be defined include, for example, mainframe computers, servers (e.g., database, electronic mail, authentication, web, proxy, file, domain name), workstations, input/output devices (e.g., scanners, copiers, and printers), network components (e.g., firewalls, routers, gateways, voice and data switches, wireless access points, network appliances, sensors), operating systems, middleware, and applications.</p><p>Security-related parameters are those parameters impacting the security state of information systems including the parameters required to satisfy other security control requirements. Security-related parameters include, for example:</p><p>• Registry settings.</p><p>• Account, file, directory permission settings.</p><p>• Settings for functions, ports, protocols, services, and remote connections.</p><p>Organizations establish organization-wide configuration settings and subsequently derive specific settings for information systems. The established settings become part of the systems configuration baseline.</p><p>Common secure configurations (also referred to as security configuration checklists, lockdown and hardening guides, security reference guides, security technical implementation guides) provide recognized, standardized, and established benchmarks that stipulate secure configuration settings for specific information technology platforms/products and instructions for configuring those information system components to meet operational requirements.</p><p>Common secure configurations can be developed by a variety of organizations including, for example, information technology product developers, manufacturers, vendors, consortia, academia, industry, federal agencies, and other organizations in the public and private sectors.</p><p>Common secure configurations include the United States Government Configuration Baseline (USGCB). The Security Content Automation Protocol (SCAP) and the defined standards within the protocol (e.g., Common Configuration Enumeration) provide an effective method to uniquely identify, track, and control configuration settings. Office of Management and Budget (OMB) establishes federal policy on configuration requirements for federal information systems.</p><p>CM.L2-3.4.8: Apply deny-by-exception (blacklisting) policy to prevent the use of unauthorized software or deny-all, permit-by-exception (whitelisting) policy to allow the execution of authorized software</p><p>The LP3 &lt;IT Authority&gt; is responsible for ensuring that the IT Manager maintains an approved software catalog and practice documentation for all platforms that:</p><p>• Identify defined software programs authorized to execute on the information system.</p><p>• Employs a deny-all, permit-by-exception policy to allow the execution of authorized software programs on the information system.</p><p>• Ensures workstations operating Microsoft systems shall be loaded with anti-virus with a strict firewall policy and managed by IT Support Team.</p><p>• Ensures workstations will be periodically audited to ensure that definition updates and policy changes are properly applied.</p><p>• Ensures mail servers shall have antivirus and anti-spam protection installed and maintained to keep current signatures up to date; and</p><p>Ensures events logged by the central Management console will be audited and examined daily to identify possible Advanced Persistent Threats (APT) and/or policy violations.</p><p>CM.L2-3.4.9: Control and monitor user-installed software</p><p>LP3:</p><p>• Establishes policies regarding software program usage and restrictions referenced in the LP3 Employee Handbook governing the installation of software by users.</p><p>• Enforces software installation policies through removing administrator privileges, and the use of SCCM and AppLocker applications and</p><p>• Monitors policy compliance quarterly using Lansweeper or SCCM reporting.</p><p>If provided the necessary privileges, users can install software in organizational information systems. To maintain control over the types of software installed, organizations identify permitted and prohibited actions regarding software installation. Permitted software installations may include, for example, updates and security patches to existing software. Prohibited software installations may include, for example, software with unknown or suspect pedigrees or software that organizations consider potentially malicious.</p><p>The policies organizations select governing user-installed software may be organization-developed or provided by some external entity. Policy enforcement methods include procedural methods (e.g., periodic examination of user accounts), automated methods (e.g., configuration settings implemented on organizational information systems), or both.</p>","ACME_Inc_InfoSec_Configuration_Management_Policy_v2.docx":"<h4>0. DOCUMENT CONTROL</h4><h4>DOCUMENT NUMBER:</h4><h4>REVISION:</h4><h4>FUNCTION:</h4><p>Information Security</p><h4>POLICY OWNER (TITLE):</h4><p>Chief Information Security Officer</p><h4>1. STATEMENT OF SCOPE AND PURPOSE</h4><p>ACME, Inc. Information Security establishes policy by restricting access to information systems, data, dissemination of data and system resources to ensure the Confidentiality, Integrity and Availability ACME, Inc. enterprise assets.</p><h4>2. APPLICABLE DOCUMENTS</h4><p>Higher Governing Documents:</p><p>DoDI 8500.01 – Cybersecurity</p><p>Office of the DoD CIO - CMMC Scoping Guide, Level 2</p><p>NIST Special Publication 800.53r4 - Risk Management Framework</p><p>NIST Special Publication 800.171r2 - Protecting CUI in Nonfederal Systems &amp; Organizations</p><p>ACME, Inc. Documents:</p><p>ACME, Inc. Enterprise System Security Plan</p><p>ACME, Inc. Technical Standards</p><h4>3. REQUIREMENTS</h4><p>To whom does this policy apply? Place an “x” by all that apply:</p><p>Geographic area:</p><p>☒ Global   ☐ U.S. Only   ☐ Country Specific: _______________________________</p><p>Covered persons:</p><p>☒ Employees   ☒ Board members   ☒ Non-permanent staff*   ☐ Other: _______________________________</p><p>*Non-permanent staff means agency/vendor staff, consultants, contractors, and any other temporary staff</p><h4>1 PURPOSE</h4><p>The purpose of the Configuration Management Policy is to centrally define the policies and standards of how the Information System (IS) is configured, audit requirements are documented, and what organizational personnel must adhere to.</p><p>This document should be viewed as a living document subject to changes in the organization’s contractual or legal obligations. As such, it is the responsibility of the organization personnel to maintain awareness of the organization's defined policies and standards.</p><h4>2 SCOPE</h4><p>This policy applies to all ACME, Inc. employees and contractors (referred to as personnel throughout the document) accessing or managing ACME, Inc.’s IS.</p><h4>3 EXECUTIVE LEADERSHIP COMMITMENT</h4><p>ACME, Inc. Executive Leadership is committed to following this policy and the supporting procedures that the Information Security (InfoSec) Department has established, maintains, and updates on an annual basis.</p><h4>4 ROLES AND RESPONSIBILITIES</h4><h4>4.1 INFOSEC DEPARTMENT</h4><p>Develop and maintain information technology policies, standards and procedures to adhere with regulatory requirements and industry best practices of IS assets managed by ACME, Inc..</p><p>Reviews and approves/disapproves any third-party provider IS related products or services prior to contract as they relate to being able to meet or exceed existing regulatory requirements imposed on ACME, Inc..</p><p>Participate as a voting member in the IT Department’s committee that reviews any changes to the IS.</p><h4>4.2 IT DEPARTMENT</h4><p>Create a committee to review any changes to the IS.</p><p>Implement and deploy configurations according to approved changes and standards.</p><p>Accounts and maintains IS assets as defined by organizational procedures.</p><p>Advises InfoSec on the approves/disapproves any third-party provider IS related products or services prior to contract as they relate to being able to meet or exceed existing regulatory requirements imposed on ACME, Inc..</p><h4>5 COMPLIANCE</h4><p>For ACME, Inc. personnel, failure to comply with this policy may result in disciplinary actions up to and including dismissal from ACME, Inc. employment and removal from access to the IS services and components. ACME, Inc. personnel are subject to any applicable legal requirements for compliance violations of this policy. Depending on the legal requirements, and the nature of the violation, penalties could include fines and/or criminal charges.</p><h4>6 POLICY METHODOLOGY</h4><p>6.1 ESTABLISH AND MAINTAIN BASELINE CONFIGURATIONS AND INVENTORIES OF ORGANIZATIONAL SYSTEMS (INCLUDING HARDWARE, SOFTWARE, FIRMWARE, AND DOCUMENTATION) THROUGHOUT THE RESPECTIVE SYSTEM DEVELOPMENT LIFE CYCLES. ESTABLISH AND ENFORCE SECURITY CONFIGURATION SETTINGS FOR INFORMATION TECHNOLOGY PRODUCTS EMPLOYED IN ORGANIZATIONAL SYSTEMS.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><p>3.4.13.4.2</p><p>Basic Security RequirementsBasic Security Requirements</p><p>NIST SP 800-53 rev. 4</p><p>CM-2CM-6CM-8CM-8(1)</p><p>Baseline ConfigurationConfiguration SettingsSystem Component Inventory (SCI)SCI – Updates During Installations/Removals</p><p>The IT Department shall create, update, and maintain baseline configurations for all configurable IS connected to the ACME, Inc. IT network. In addition, the IT Department shall maintain a complete and up to date inventory of IS under their respective departments. At no time shall the system inventory have unmanaged devices count above 5% of the overall inventory, i.e. 95% managed devices. All in-scope system devices to the CUI Enclave must be 100% managed at all times. Baselines and inventory shall include but are not limited to:</p><p>Hardware</p><p>Firmware</p><p>Applications</p><p>Documentation</p><p>Reviews and updates of baselines shall be performed as outlined in the ACME, Inc. Technical Standards document, as needed, or after a committee review results in an immediate need for a change to a configuration baseline. An IS inventory shall be created and updated as outlined in the ACME, Inc. Technical Standards document.</p><p>Security configurations are enforced utilizing group policy and/or access control restrictions/rights to prevent end users from making modifications to the security controls in place.</p><h4>6.2 TRACK, REVIEW, APPROVE OR DISAPPROVE, AND LOG CHANGES TO ORGANIZATIONAL SYSTEMS.</h4><p>ANALYZE THE SECURITY IMPACT OF CHANGES PRIOR TO IMPLEMENTATION.</p><p>DEFINE, DOCUMENT, APPROVE, AND ENFORCE PHYSICAL AND LOGICAL ACCESS RESTRICTIONS ASSOCIATED WITH CHANGES TO ORGANIZATIONAL SYSTEMS.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><p>3.4.33.4.43.4.5</p><p>Derived Security RequirementsDerived Security RequirementsDerived Security Requirements</p><p>NIST SP 800-53 rev. 4</p><p>CM-3CM-4CM-5</p><p>Configuration Change ControlSecurity Impact AnalysisAccess Restrictions for Change</p><p>All IS changes, both logical and physical, to the IS must undergo a change review process by the committee. Change reviews must be tracked, documented, approved/disapproved, and logged within the ACME, Inc. change tracking system.</p><p>Any changes to IS components that may result in a potential impact to the confidentiality, integrity, or availability of data and IS resources will undergo a security impact analysis. The security impact analysis will document the potential impact of meeting regulatory requirements or degradation to the performance of the IS environment.</p><p>Any successful or unsuccessful attempts to make changes to the IS will be configured for logging within the SIEM.</p><p>6.3 EMPLOY THE PRINCIPLE OF LEAST FUNCTIONALITY BY CONFIGURING ORGANIZATIONAL SYSTEMS TO PROVIDE ONLY ESSENTIAL CAPABILITIES. RESTRICT, DISABLE, OR PREVENT THE USE OF NONESSENTIAL PROGRAMS, FUNCTIONS, PORTS, PROTOCOLS, AND SERVICES. APPLY DENY-BY-EXCEPTION (BLACKLISTING) POLICY TO PREVENT THE USE OF UNAUTHORIZED SOFTWARE OR DENY-ALL, PERMIT-BY-EXCEPTION (WHITELISTING) TO ALLOW THE EXECUTION OF AUTHORIZED SOFTWARE.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><p>3.4.63.4.73.4.8</p><p>Derived Security RequirementsDerived Security RequirementsDerived Security Requirements</p><p>NIST SP 800-53 rev. 4</p><p>CM-7CM-7(1)</p><p>Least Functionality (LF)LF – Periodic Review</p><p>CM-7(2)CM-7(4)CM-7(5)</p><p>LF – Prevent Program ExecutionLF – Unauthorized Software / BlacklistingLF – Authorized Software / Whitelisting</p><p>The IT and InfoSec Departments will configure the following within the IS:</p><p>Review the functions and services of a system or component of systems to determine which functions and services are required for operation and disabling/restricting and which functions or services are not required.</p><p>Establish a mechanism for users to obtain necessary programs to perform their job functions, which restricts user installed software by default, only allowing the installation of specific, approved software packages (Whitelisting) as found in the ACME, Inc. Technical Standards doc.</p><p>Create an Authorized Software List (ASL) of essential user programs based on duties and functions.</p><p>Configure a mechanism for users to request and obtain authorized software.</p><p>Track and audit ASL usage by program name, version and available licenses.</p><p>Review the ASL no less than annually, to ensure relevance based on business needs.</p><p>Document all essential functions, ports, protocols, and services (PPS) required within baseline documentation, and restrict all non-essential PPS according to the ACME, Inc. Technical Standards doc.</p><h4>6.4 CONTROL AND MONITOR USER-INSTALLED SOFTWARE</h4><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><p>3.4.9</p><p>Derived Security Requirements</p><p>NIST SP 800-53 rev. 4</p><p>CM-11</p><p>User-Installed Software</p><p>The IT Department will configure the IS to prevent unauthorized software from being downloaded or utilized within the IS environment. Attempts by personnel to install unauthorized software shall be configured for capture in system logs for monitoring.</p><h4>BREACHES OF THIS POLICY</h4><p>Compliance with this Policy is mandatory in all cases. Any breaches of this Policy will result in disciplinary action, up to and including termination of employment. Employees must report any actual or suspected breach of this Policy. Reports can be made via your supervisor, Human Resources, an Ethics Champion, or the ACME, Inc. Hotline at +1 (833) 996-3948 (toll-free in the U.S. only; international rates apply outside the U.S.)</p>","CHANGE_MANAGEMENT_POLICY - with comments.docx":"<p>420370276225290090900</p><p>Change Management Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>7/02/24</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of the Change Management Policy is to outline the appropriate procedures put in place at LP3 for managing change without impacting SLAs or adding risk to the system.</p><p>Scope</p><p>Change Management policy applies to the following:</p><p>• All infrastructure hosted in house and in the cloud</p><p>• Information systems and applications that contain company data</p><p>• Customer data, regardless of location.</p><p>• Source code</p><p>• Configuration managed by LP3</p><p>Background</p><p>Change management refers to a formal process for making changes to company software. Change management aims to increase awareness and understanding of proposed changes across the company and ensure that all changes are made in a thoughtful way that minimizes negative impact to services and customers. Unplanned changes can introduce unknown risks to the information systems either directly as security vulnerabilities or indirectly due to inadequate planning communication and un-preparedness to handle the transition. The change management policy defines how change is managed to maximize the success of that change.</p><p>Policy</p><p>LP3's change management policy requires that all information systems changes, including changes to applications, databases, and servers, are formally requested. All changes are approved and adequately communicated to stakeholders with appropriate training and awareness.</p><p>Types of Changes</p><p>There are four types of changes based on approvals needed through the change management process.</p><p>Standard Change: A relatively low-risk change with well-understood outcomes regularly made during the business. A Standard change follows pre-determined processes, is pre-approved by change management processes, and may be made at the discretion of an individual employee, provided it has been defined as a Standard Change per the change management assessment process. Examples of standard changes are day-to-day changes to infrastructure, application releases, and any other change not expected to impact the availability of the Company's application or system.</p><p>Backward Incompatible Change: Backward incompatibility is a system property that disallows interoperability with an older system or with an input designed for such a system. It has medium to high risk for critical services and involves less understood risks. Because of the ability to affect downstream or upstream services, any proposed Backwards, Incompatible Change must be reviewed and authorized by Company's management, including engineering and product managers or lead developers.</p><p>Significant Change: A Significant Change has a high risk for critical services, has less predictable outcomes and is a change that is not regularly made during the business. An example of a Significant Change would be moving hosting from AWS to another cloud services provider, such as Google Cloud Platform. Because of the ability to affect downstream or upstream services, any proposed Significant Change must be reviewed and authorized by Company's management.</p><p>Emergency Change: An Emergency Change must be executed with utmost urgencies, such as when responding to an Incident. Few people may be involved in the change management process review, and the change assessment may involve fewer steps. However, any Emergency Change must still be authorized by Company's management, even in cases where management cannot review the change in advance.</p><p>Change management process</p><p>Change requests are initiated through a ticketing system (such as JIRA). Each change request has the following information at the minimum.</p><p>• The urgency of change (Hotfix, Release, Security Patch, etc.)</p><p>• List of changes</p><p>• Type of testing/validation performed</p><p>• What communication is required / already done</p><p>• Is support training required</p><p>• Is the documentation updated reflecting the changes</p><p>All changes are required to go through an approval process. The information systems are free to pick the approval process depending on the magnitude of change and the development process they follow (automated CI / CD pipeline).</p><p>In some cases, approval is required from Chief Product Officer, Chief Information Officer (CIO), and Chief Operating Officer (COO)</p><p>Enhanced monitoring of all changes is required for at least a week, followed by a retrospective meeting.</p><p>All significant changes must go through a mandatory security assessment of change.</p><p>Change communication plan</p><p>A list of stakeholders is maintained by the operations manager of each information system. The stakeholders are kept in the loop and are informed of the changes from the very initial stages of the change.</p><p>Change Awareness</p><p>Change awareness is a top priority for changes that require a significant shift in how different stakeholders consume products and offerings in the organization. Change awareness is performed using newsletters, internal and external training, webinars, etc.</p><p>Application/source code changes</p><p>Only authorized Company employees can deploy code to company production systems.</p><p>Before deployment, all code requires the following steps.</p><p>• Peer review using Git pull requests by at least one other engineer (two-person rule)</p><p>• Peer reviewer signs off on pull request.</p><p>• Unit tests and static analysis checks are run on code in a pull request and must pass for code to be merged.</p><p>• Pull requests require at least one Jira ticket associated with the change explaining why it was made.</p><p>• Once a pull request passes peer review, code is merged to the development branch and is deployed to an internal staging environment.</p><p>• The Project Manager can request deployment to Production via a ticket in Jira.</p><p>• The same 2-person process is followed by merging development code to master for Production deployment.</p><p>• \"Must have\" test cases are run against Production after release</p><p>• All tickets in Jira that were pushed to Production are marked as \"Closed.\"</p><p>• Versions of all deployed services are maintained in Git</p><p>• Deployment history is stored in our deployment database.</p><p>Infrastructure changes</p><p>Like application changes, infrastructure changes can only be done by authorized employees. The process for implementing changes is as follows:</p><p>• A need for change is initiated because of</p><p>• A planned update to support future growth or development requirements</p><p>• A change in response to a monitoring alert or pattern that should be addressed</p><p>• A platform level issue that requires an immediate infrastructure change to remedy</p><p>• A ticket is raised regarding the requested change or issue requiring remedy and assigned to the appropriate employee.</p><p>• The employee evaluates the ticket and either address or escalates it to the Chief Technology Officer for approval.</p><p>• If it is approved or does not require approval, the change is made</p><p>• The ticket is then marked as resolved</p><p>Enforcement</p><p>Change management policy is enforced by the Operations Manager, Engineering Manager or the Chief Information Officer (CIO).</p>","ASSET_MANAGEMENT_POLICY.docx":"<p>420370276225290090900</p><p>Asset Management Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>7/22/24</p><p>V0.1</p><p>Clarified that this applies to assets issued to subs and consultants.</p><p>Jim Magee</p><p>7/28/2026</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of the Asset Management Policy is to outline the guidelines and practices that govern decisions on asset management at LP3 and also to ensure that assets and data in those assets are properly classified (based on their business value). This policy's measures are implemented to protect LP3 data from unauthorized disclosure, regardless if it is being shared, transmitted, or stored. The policy describes how to identify and draw up an inventory of assets in the Company.</p><p>Scope</p><p>The Asset Management policy applies to the following assets &amp; equipment</p><p>• All assets such as servers and network</p><p>• All corporate assets issued and used by the LP3's employees, Subcontractors, or Consultants</p><p>• All assets, computers, and devices issued to vendors/ third-party/visitors</p><p>• All software and other information systems such as file drives etc</p><p>• Any other tangible and intangible information asset</p><p>Background</p><p>Asset management is the process of receiving, tagging, documenting, and eventually disposing of equipment. It is critically important to maintain up-to-date inventory and asset controls to ensure computer equipment locations and dispositions are well known.  Lost or stolen equipment often contains sensitive data. Proper asset management procedures and protocols provide documentation that aids in recovery, replacement, and insurance activities.</p><p>Policy</p><p>Asset types</p><p>The Company must maintain an inventory of its information systems which include:</p><p>• Tangible Information Assets: A tangible information asset has a finite monetary value and usually a physical form. (e.g., laptops, server)</p><p>• Intangible Information Assets: Intangible assets include non-physical assets that usually have a theoretical value. (e.g., trademarks, patents)</p><p>• Physical IT assets: Switches, routers, Wi-Fi access points, VoIP telephony devices, personnel identification, authentication/access control devices (card-access systems, etc.), and other security devices (CCTV, etc.)</p><p>• IT Hardware: Computing and storage devices e.g., desktops, workstations, laptops, tablets, servers, communications devices (network nodes), printers/copiers/FAX machines and multifunction devices, and other IoT devices.</p><p>• IT Service Assets: User authentication services and user administration processes, firewalls, proxy servers, network services, wireless services, anti-spam/virus/spyware, intrusion detection/prevention, teleworking, security, FTP, email/IM, Web services, software maintenance, and support contracts.</p><p>Asset inventory</p><p>Each asset should, at the minimum, have the following information in the asset inventory.</p><p>• Identifier</p><p>• Name</p><p>• Serial Number</p><p>• Owner</p><p>• Location information</p><p>• Stores PII information or not</p><p>• Authorized to store/process CUI information or not</p><p>• Asset classification</p><p>• Value</p><p>• Purchase and other procurement information</p><p>Wherever available following information must be also tracked</p><p>• Date of purchase,</p><p>• Make and Model</p><p>• OS type and version</p><p>• Serial Number</p><p>• Asset Category</p><p>• Department</p><p>• Risk Level</p><p>Asset inventory must be up to date, current, and reflect the Company's latest assets.</p><p>Ownership and assignment</p><p>Ownership must be assigned to each asset in the asset inventory.</p><p>Asset owners must ensure that assets are appropriately classified and protected, and access requirements are periodically reviewed.</p><p>The asset owner must determine the asset's value or criticality using assets impact confidentiality, integrity, and availability.</p><p>Acceptable use</p><p>The Acceptable Use Policy governs the acceptable use of each asset. In general, the policy requires that under no circumstances is an employee authorized to engage in any activity that is illegal under local, state, federal, or international law while utilizing company-owned assets. The use of all assets must be strictly for the Company's business purposes.</p><p>Asset disposal</p><p>• Employees, Contractors should return organization assets upon termination of their employment, contract, or agreement.</p><p>• Assets containing confidential information should be disposed of securely. (e.g., by incineration or shredding, or erasure of data for use by another application within the organization)</p><p>• Assets should be properly recycled before reassignment.</p><p>Enforcement</p><p>Asset Management policy is enforced by the Information security team. All exceptions to the policy should be brought to the attention of the information security team along with the executive management of the company. Any employee found to have violated this policy may be subject to disciplinary action, up to and including termination of employment.</p>","APPLICATION_SECURITY_POLICY.docx":"<p>420370276225290090900</p><p>Application Security Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>12/05/22</p><p>V0.1</p><p>Minor edits</p><p>Jim Magee</p><p>07/29/26</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of the Application Security Policy is to define the security framework and requirements for the security of applications, notably web applications, within the LP3's production environment.</p><p>Scope</p><p>the Application Security Policy applies to following.</p><p>Software Applications</p><p>• All in-house applications built by LP3 and running in LIVE / Production environment</p><p>• All third-party software applications which store/process sensitive customer or organizational data. This includes LP3 Proprietary, Client Proprietary, U.S. Government Controlled Unclassified Information (CUI), Privacy Data (PII), and Employee Medical data (HIPAA).</p><p>Background</p><p>Software Application vulnerabilities, especially in web applications are the largest source of threats and data breaches for any organization. In LP3 it is important that applications are designed with security in mind, and that they are scanned and continuously monitored for malicious activity that could lead to larger security or a data breach incident. The policy is intended to facilitate the discovery and mitigation of application vulnerabilities in order to limit the company's attack surface. This policy defines technical requirements and procedures to ensure that applications are properly hardened in accordance with the practices and procedures defined by LP3's information security team.</p><p>Policy</p><p>Secure application</p><p>• All applications must require a secure login process per access management policy and password policy.</p><p>• Web applications must adhere to OWASP Top 10 to address the common security issues.</p><p>• All applications which store sensitive data must perform a quarterly vulnerability scan.</p><p>• Application development must strictly adhere to the Application Development Lifecycle (aka, SDLC) policy.</p><p>• Changes to the application must be per the Change Management Policy document.</p><p>• The information security team must conduct a formal security risk assessment for all new applications.</p><p>• Conduct a security risk assessment following all significant changes</p><p>• A periodic security risk assessment must be performed for legacy or other applications to assess against the latest threats and vulnerabilities.</p><p>• All applications must adhere to Log Management Policy for storing and disposing of application logs.</p><p>• All applications must follow security best practices for managing configuration and documenting the secure configurations for the application.</p><p>Data Handling</p><p>• Data handled and managed by the application must be classified in accordance with the Data Classification Policy.</p><p>• If the application processes confidential information, a confidential record banner must be prominently displayed, which highlights the type of confidential data being accessed (e.g., personally identifiable information (PII), protected health information (PHI))</p><p>• Sensitive data, especially data specifically restricted by law or policy (e.g., social security numbers, passwords, and credit card data) should not be displayed in plaintext.</p><p>Secure Processes for Application Development Lifecycle</p><p>• All application development must be per the Software Development Lifecycle document</p><p>• All changes to the application must be per the Change Management policy</p><p>Third-Party Software</p><p>• Updates, patches, and configuration changes issued by the vendor shall be implemented as soon as possible.</p><p>• Security reports &amp; policy assessments of 3rd party software must be performed annually.</p><p>• Application provided by 3rd party vendors must be procured in accordance with vendor management policy.</p><p>• No custom modifications may be applied to the application without confirmation that the vendor can continue to provide support.</p><p>Enforcement</p><p>Application security policy will be enforced by the information security team and all applications must follow it. Exceptions are allowed upon formal approval from the information security team.</p>","CMMC_INCIDENT_RESPONSE_POLICY.docx":"<p>420370276225290090900</p><p>Last Update Date</p><p>11-28-2025</p><p>Owner</p><p>David Wyatt</p><p>Status</p><p>In Progress</p><p>CMMC Incident Response Policy</p><p>Approval History</p><p>Version</p><p>Approved By</p><p>Approved On</p><p>1.0</p><p>David Wyatt</p><p>04-20-2023</p><p>Purpose</p><p>This document represents the policies and procedures in place for handling information security incidents impacting services and infrastructure of LP3, including publicly accessible services, supporting information and information systems, and infrastructure used by LP3 personnel in support of the LP3 mission.</p><p>For the purpose of this document, an information security incident (henceforth an “incident”) includes any known or suspected event that compromises or has the potential to compromise any LP3 information asset, including computing infrastructure, confidential data, or computing service, as well as flagrant violations of LP3 policy by project personnel, staff, or users of externally-facing services. Incidents that do not involve information assets fall outside the scope of this document.</p><p>For information regarding violations and enforcement, please refer to the LP3 Master Information Security Policies &lt;insert URL or process for retrieving&gt;.</p><p>Scope</p><p>The scope of this policy is applicable to all IT resources owned or operated by LP3. Any information not specifically identified as the property of other parties that is transmitted or stored on LP3 IT resources (including e-mail, messages, and files) is the property of LP3. All users, (employees, contractors, vendors, or others) of LP3 IT resources are responsible for adhering to this policy.</p><p>Roles and Responsibilities</p><p>The LP3 Chief Information Security Officer (CISO) - Oversees the development and execution of the cybersecurity awareness training program. Serves as a liaison to the users, IT department, law enforcement, and other stakeholders.</p><p>The LP3 Human Resources Manager (HRM) - Ensuring the security of LP3's data and information systems is a shared responsibility amongst all employees, contractors, consultants, and affiliates of LP3.</p><p>The LP3 Information Technology Manager (ITM) - Ensures the safeguarding of information and ensuring a resilient cybersecurity posture within LP3. Some key responsibilities include:</p><p>• Risk Management</p><p>• Security Policies and Procedures</p><p>• Security Architecture</p><p>• Vulnerability Management</p><p>• Incident Response</p><p>• Access Control</p><p>• Collaboration with IT Teams</p><p>• Security Awareness Training</p><p>• Security Monitoring</p><p>• Security Audits and Compliance</p><p>• Policy and Regulation Awareness</p><p>• Security Incident Reporting</p><p>The LP3 Information Security Officer (ISO) -  Manages and maintains the cybersecurity posture of LP3. The ISO safeguards information assets and maintains a resilient cybersecurity posture within LP3Note: In smaller organizations, the ISSO and the ITM can be the same person.</p><p>Contents</p><p>TOC \\o \"1-3\" \\h \\z \\u Purpose\t PAGEREF _Toc236738719 \\h 2</p><p>Scope\t PAGEREF _Toc236738720 \\h 2</p><p>Roles and Responsibilities\t PAGEREF _Toc236738721 \\h 2</p><p>IR.L2-3.6.1: Establish an operational incident-handling capability for organizational systems that includes preparation, detection, analysis, containment, recovery, and user response activities\t PAGEREF _Toc236738722 \\h 4</p><p>Incident Handling Capability:\t PAGEREF _Toc236738723 \\h 4</p><p>Electronic Spillage of Controlled Unclassified Information (CUI):\t PAGEREF _Toc236738724 \\h 4</p><p>Incident Response Team:\t PAGEREF _Toc236738725 \\h 4</p><p>Identifying an Incident:\t PAGEREF _Toc236738726 \\h 5</p><p>Handling an incident:\t PAGEREF _Toc236738727 \\h 6</p><p>Preventing Incidents\t PAGEREF _Toc236738728 \\h 7</p><p>Detection and Analysis\t PAGEREF _Toc236738729 \\h 9</p><p>Signs of an Incident:\t PAGEREF _Toc236738730 \\h 10</p><p>Incident Analysis:\t PAGEREF _Toc236738731 \\h 10</p><p>Containment:\t PAGEREF _Toc236738732 \\h 11</p><p>Evidence Collection:\t PAGEREF _Toc236738733 \\h 11</p><p>Recovery:\t PAGEREF _Toc236738734 \\h 12</p><p>Evidence Retention\t PAGEREF _Toc236738735 \\h 12</p><p>Lessons Learned:\t PAGEREF _Toc236738736 \\h 12</p><p>IR.L2-3.6.2: Track, document, and report incidents to designated officials and/or authorities both internal and external to the organization\t PAGEREF _Toc236738737 \\h 13</p><p>Incident Documentation:\t PAGEREF _Toc236738738 \\h 13</p><p>Procedures for Communicating an Incident:\t PAGEREF _Toc236738739 \\h 13</p><p>Incidents require reporting to all affected stakeholders:\t PAGEREF _Toc236738740 \\h 14</p><p>IR.L2-3.6.3: Test the organizational incident response capability\t PAGEREF _Toc236738741 \\h 15</p><p>Conducting Incident Response Training\t PAGEREF _Toc236738742 \\h 15</p><p>Conducting Incident Response Exercises\t PAGEREF _Toc236738743 \\h 15</p><p>IR.L2-3.6.1: Establish an operational incident-handling capability for organizational systems that includes preparation, detection, analysis, containment, recovery, and user response activities</p><p>Incident Handling Capability:</p><p>LP3 is dedicated to protecting our data, whether that data is company Intellectual Property (IP) or Department of Defense (DoD) Controlled Unclassified Information (CUI). LP3 uses data security in-line with industry best practices, however LP3 understands that no system can be completely secure. In the event of a data breach that compromises LP3 IP or CUI, the following efforts are made to discover the cause/source of the data breach and to resolve the incident in-line with all contractual obligations.</p><p>Electronic Spillage of Controlled Unclassified Information (CUI):</p><p>Note: these procedures are also followed in responding to electronic spillage of Controlled Unclassified Information (CUI) onto non-CUI system/s or device/s.</p><p>Information spillage refers to instances where CUI data is inadvertently placed on information systems that are not authorized to process such information. Such information spills often occur when information that is initially thought to be of lower sensitivity is transmitted to an information system and then is subsequently determined to be of higher sensitivity.</p><p>Incident Response Team:</p><p>LP3 Incident Response Team (IRT) will work to determine threats before they can affect company IP or CUI. The IRT conforms to industry best practices, and works under direction of the CISO.</p><p>• All information security personnel must maintain all relevant certifications and continuing education (CISSP, Security+, CEH, CISM, etc.).</p><p>• Records of certifications and training are to be kept in personnel files, held within LP3 Human Resources.</p><p>• The Information Security Manager(s) are responsible for the training, testing and maintenance of the IRT’s ability to proactively identify indications of incidents.</p><p>• The ITM is responsible for the readiness of the IRT to respond to an incident.</p><p>• The CISO is responsible for reporting the facts of incidents to senior management and all other affected stakeholders. The facts stated in the report will include:</p><p>• Systems affected by the incident</p><p>• Data affected by the incident</p><p>• Clients/suppliers/vendors affected by the incident</p><p>• Cause of the incident</p><p>• Remedial action taken</p><p>• Time frame</p><p>• Lessons learned</p><p>• The CISO will appoint an Information System Security Officer (ISSO) that is responsible for gathering evidence from an incident (preemptive or reactionary) and compiling the report for the CISO and senior management.</p><p>• The ISSO will maintain and update all relevant policies and procedures as the need requires.</p><p>• All IRT personnel will have passed all appropriate security and background checks before being granted access to sensitive areas of LP3 information systems. These checks may include:</p><p>• Criminal</p><p>• Education</p><p>• Employment</p><p>• Licensing/Certifications</p><p>• Sanctions</p><p>• Substance Abuse</p><p>• References</p><p>• Required Classification Access</p><p>• The CISO and/or ITM will be consulted before any activity that could raise the risk of an incident. Such activities can include, but are not limited to:</p><p>• Social media marketing campaigns</p><p>• High-profile social or political event</p><p>• Press release</p><p>• The IRT will also be responsible for the education of LP3 personnel on Information Security Awareness.</p><p>Identifying an Incident:</p><p>LP3 IRT will adapt to the constantly-evolving threat landscape through ongoing education and modifications to existing procedure and practices.</p><p>LP3 &lt;Security Operations Center (SOC)&gt; uses weekly log audits and &lt;a Security Information and Event Management (SIEM) tool&gt; to monitor network activity, traffic and search for indications of malicious activity within LP3 Information Systems. The &lt;SOC&gt; will be operational 24 hours a day, every day, with a minimum of three (3) information security personnel on duty to monitor LP3 information infrastructure at any time.</p><p>Indicators of vulnerabilities are to be logged and reported as soon as they are identified.</p><p>Classifications of indicators</p><p>• Insider threats</p><p>• Removable flash media/drives</p><p>• Disgruntled employees</p><p>• Human error</p><p>• Improper access rights</p><p>• Malicious code</p><p>• Viruses</p><p>• Trojans</p><p>• Ransomware/malware</p><p>• Unpatched or outdated software</p><p>• Legacy OS</p><p>• Internet of Things (IOT)</p><p>• Routers/Switches/Hubs/Servers</p><p>• Phishing</p><p>• Requests for credentials</p><p>• Odd email domains</p><p>• Misspellings or bad grammar</p><p>• Unsolicited attachments</p><p>• Social Engineering</p><p>• Pre-texting</p><p>• Baiting</p><p>• Tailgating</p><p>• Quid Pro Quo</p><p>Handling an incident:</p><p>Once an incident has occurred, it is of immense importance that all procedures are carried out correctly and swiftly. Affected personnel will follow all the following procedures:</p><p>• Communication</p><p>• Contact information for relevant personnel (primary and backup)</p><p>• IRT personnel</p><p>• CISO</p><p>• Authorities (when necessary)</p><p>• Contracting Officer</p><p>• Internet Service Provider (ISP)</p><p>• Company Leadership</p><p>• Issue tracking system</p><p>• Secure storage facility</p><p>• War room</p><p>• Hardware and Software</p><p>• Backup devices</p><p>• Digital forensics software</p><p>• Laptops, spare workstations, network hardware</p><p>• Blank removable media</p><p>• Packet sniffers</p><p>• Protocol analyzer</p><p>• Analysis Resources</p><p>• Documentation</p><p>• Operating System (OS)</p><p>• Applications</p><p>• Antivirus</p><p>• Intrusion detection, etc.</p><p>• List of critical assets</p><p>• Servers</p><p>• Credentials</p><p>• Network diagrams</p><p>• Port list</p><p>• Mitigation Software</p><p>• Images of OSs and applications</p><p>Preventing Incidents</p><p>To prevent incidents from causing network downtime and/or loss of data, the IRT alongside LP3 IT department conducts the following activities:</p><p>• Risk Assessments</p><p>• Host Security</p><p>• Host based firewall</p><p>• Strong account passwords</p><p>• Update software patches and hardware firmware</p><p>• Monitor logs</p><p>• Make and test system backups</p><p>• Network Security</p><p>• Maintain software</p><p>• Ensure network visibility to monitor potential insider threats</p><p>• Manage user permissions - adopt principles least privilege.</p><p>• Use a network packet broker to properly route network traffic</p><p>• Remain compliant with all necessary security standards and protocols.</p><p>• Establish a security policy - outline acceptable use</p><p>• Backup data</p><p>• Monitor third-party users</p><p>• User training on security/acceptable use policies and best practice.</p><p>• Application Security</p><p>• Perform a security audit - determine vulnerabilities</p><p>• Implement logging - bug logging</p><p>• Real-time security monitoring (firewalls)</p><p>• Proper use of encryption</p><p>• Hardening</p><p>• Limit extensions and modules to only those required for the designated task.</p><p>• Write protect configuration files</p><p>• Traffic restrictions I/O</p><p>• Server access rights</p><p>• Keep servers/software up to date</p><p>• Threat/vulnerability hunting - be vigilant</p><p>• Malware Prevention</p><p>• Backup/Secure web servers</p><p>• Train personnel with access to sensitive data and/or systems to recognize all forms of malware and malicious code</p><p>• Maintain anti-virus software updates</p><p>• Segment use of IT resources (web server only runs website).</p><p>• User Awareness and training</p><p>• Train all personnel that use IT resources:</p><p>• Acceptable use of IT resources and assets</p><p>• How to identify social engineering and insider threats</p><p>• Proper security habits and practices</p><p>Detection and Analysis</p><p>The nature of Information Security threats is ever evolving and changing. Known attacks include, but are not limited to:</p><p>• External/Removable Media</p><p>• Attack performed from a removable media or peripheral device.</p><p>• An infected USB flash drive</p><p>• Attrition</p><p>• An attack using brute force to compromise, degrade or destroy systems</p><p>• Distributed Denial of Service (DDoS) attack.</p><p>• Brute force attack against an authentication mechanism.</p><p>• Web</p><p>• An attack via a website or web-based application.</p><p>• Script based attacks to collect credentials.</p><p>• Browser redirect that installs malicious code on a client’s computer through an unpatched web browser.</p><p>• Email/Phishing</p><p>• Attack executed by an email message or attachment.</p><p>• Exploitative code disguised as an attachment.</p><p>• Link to malicious website.</p><p>• Impersonation/Spoofing</p><p>• Replacement attack where something safe is replaced by something dangerous.</p><p>• Man in the Middle attack</p><p>• SQL injection</p><p>• Improper Usage</p><p>• A violation of LP3 Acceptable Use Policy that has negative effects on LP3 information infrastructure.</p><p>• Unacceptable/Inappropriate access to sensitive data.</p><p>• Malicious actions taken by individual with access to sensitive data (disgruntled employee).</p><p>• Loss or Theft of Equipment</p><p>• Accidental or purposeful removal of company property</p><p>• Lost keycard</p><p>• Stolen phone or laptop</p><p>Signs of an Incident:</p><p>Understanding and identifying an incident in the sea of system logs, alerts and events is difficult. The IRT should use indicators to determine the occurrence, type, and magnitude of an incident. Some common indicators to look for:</p><p>• Web server logs showing the use of a vulnerability scanner.</p><p>• Threats against the company or its infrastructure.</p><p>• A new exploit that capitalizes on a vulnerability in the system.</p><p>• Filename with strange or unusual characters.</p><p>• Antivirus alerts.</p><p>• Multiple failed login attempts.</p><p>• Deviation in network traffic.</p><p>Incident Analysis:</p><p>IRT personnel must differentiate between security incidents and human errors. In depth analysis of the data is needed to determine the nature of the event. IRT personnel must:</p><p>• Understand normal system behavior</p><p>• IRT personnel should establish a baseline for standard operating procedures through constant study of the company’s information system, networks and applications. This will help them learn abnormal behaviors that could indicate a security incident.</p><p>• Perform Event Correlation</p><p>• IRT personnel need to correlate incident logs across multiple log sources to build a more complete picture of the incident.</p><p>• Maintain and Use a Knowledge Base</p><p>• IRT personnel will create and maintain a Knowledge Base of all incidents with the logs, resolution, and other pertinent information. This enables the IRT to respond quicker and correctly to similar incidents in the future. The Knowledge Base also establishes a repository of indicators of potential incidents that can be halted before they occur.</p><p>• Research</p><p>• Along with education and training, the IRT will be constantly searching the Internet for information regarding new threats that face the LP3 information infrastructure.</p><p>• Filter the Data</p><p>• The IRT will determine the best filters to organize the log data and add findings to the Knowledge Base.</p><p>• Seek Assistance from Others</p><p>• IRT personnel are required to work in concert with regulatory agencies and industry peers to expand the team’s understanding of the threat landscape.</p><p>Containment:</p><p>IRT personnel will do the following in the event of an incident, to their best ability:</p><p>• Minimize the potential damage to LP3 systems.</p><p>• Preserve evidence regarding the source of the incident.</p><p>• Maintain system service availability.</p><p>• Determine the strategy for remediation</p><p>• Time and resources needed</p><p>• Effectiveness of strategy</p><p>• Duration of the solution</p><p>• Temporary work-around</p><p>• Permanent fix</p><p>• Further action needed</p><p>Evidence Collection:</p><p>Evidence shall be collected in the wake of every incident, with the knowledge that mishandling or improper collection of evidence could compromise an investigation into the cause and/or source of the incident. This evidence will include, at minimum:</p><p>• Identifying information</p><p>• Location</p><p>• Serial number(s)</p><p>• IP address</p><p>• MAC addresses</p><p>• Name, title, and phone number of each person that collected or handled the evidence during the investigation.</p><p>• Time and date of each occurrence of evidence handling.</p><p>• Location(s) where evidence is stored.</p><p>Identifying the Attack Source:</p><p>Identifying the source of the attack becomes the top priority after the threat has been contained. Determining where the attack originates from can be used in determining the scope of the incident.</p><p>Tracing the incident back to its source is essential in determining the cause and/or reason for an incident. Additionally, if the incident affects third parties, they need to be informed to remediate the incident on their end. For each incident that is relevant, IRT personnel shall attempt to:</p><p>• Validate the attack source’s IP address</p><p>• May require outside assistance</p><p>• Determine if IP was spoofed</p><p>• Research the attack source</p><p>• Determine if the source has been used in other incidents.</p><p>• Use incident databases</p><p>• Search for collections of incident logs/information to determine the likelihood of a similar incident occurring again.</p><p>• Monitor possible attack channels</p><p>• Watching the channels of likely attack can predict that occurrence of an incident.</p><p>Recovery:</p><p>Once an incident has been halted and all evidence has been collected, the task of the IRT is to recover the system to normal operating capacity.</p><p>Eradication</p><p>• Remove malware from LP3 systems.</p><p>• Disable breached/compromised accounts.</p><p>Recovery</p><p>• Return systems to pre-incident operating capacity</p><p>• Identify and mitigate vulnerabilities.</p><p>Evidence Retention</p><p>Prosecution</p><p>If the attacker is to be prosecuted, all evidence will be retained for the entirety of the prosecution, or as determined by the appropriate authorities.</p><p>General</p><p>Data that is not retained for prosecution will be retained for 180 days from the data of the resolution of the incident.</p><p>Lessons Learned:</p><p>After the incident has been halted and recovery achieved. IRT personnel will gather with the CISO and other affected stakeholders to examine the facts of the incident. Improving the IRT’s ability to foresee and prevent incidents in the future is paramount to the success of LP3. A ”Lessons Learned” meeting shall occur within two (2) weeks of resolution of the incident. This meeting shall review:</p><p>• What happened and when?</p><p>• How good was the response?</p><p>• What indicators were missed?</p><p>• Indicators of the incident and how to apply to monitoring</p><p>• Risks and vulnerabilities exposed by the incident</p><p>• Determine if the current information infrastructure is adequate or needs to be enhanced to mitigate a new threat.</p><p>• Determine the user actions that led to the incident</p><p>• Determine what warning signs were missed</p><p>• Changes required for the information security mechanisms</p><p>• Training required to alert company-wide personnel of the risks and threats.</p><p>• Teach personnel what indicators to look for.</p><p>The findings of the “Lessons Learned” meeting will be integrated into all applicable training courses and materials.</p><p>IR.L2-3.6.2: Track, document, and report incidents to designated officials and/or authorities both internal and external to the organization</p><p>Incident Documentation:</p><p>Documentation is securely stored until the resolution of the incident.</p><p>The following information is to be reported to those affected:</p><p>• Status of the incident</p><p>• Summary of the incident</p><p>• Indicators of the incident</p><p>• Impact of the incident</p><p>• Actions taken by incident handlers</p><p>Procedures for Communicating an Incident:</p><p>All cybersecurity incidents are to be reported to company management and/or authorities as quickly as possible, within 48 hours of the incident if possible. Additionally, all LP3 personnel are to report suspect and/or irregular activity to company management as soon as possible.</p><p>Having all the contact information for the affected parties will quicken your company’s ability to react in the event of an incident.</p><p>The following contact information of each affected person(s) shall include:</p><p>[Sample contact info below, please edit as necessary]</p><p>• Phone Number</p><p>• Landline</p><p>• Mobile</p><p>• Email</p><p>• Work</p><p>• Personal</p><p>• Messengers</p><p>• WhatsApp</p><p>• FaceTime</p><p>• Hangouts</p><p>• Teams</p><p>• Physical Address</p><p>• Home</p><p>• Business</p><p>Incidents require reporting to all affected stakeholders:</p><p>• Chief Information Officer (CIO)</p><p>• Chief Executive Officer (CEO)</p><p>• Chief Operating Officer (COO)</p><p>• Chief Information Security Officer (CISO)</p><p>• Contracting Officer</p><p>• Prime Contractor(s)</p><p>• Regulatory Agencies</p><p>• ISP</p><p>• Law Enforcement</p><p>• Public Relations</p><p>• Human Resources</p><p>• Legal</p><p>• Customers</p><p>• Vendors (material and software)</p><p>• Suppliers</p><p>• Other third parties determined in the future</p><p>IR.L2-3.6.3: Test the organizational incident response capability</p><p>Conducting Incident Response Training</p><p>The CISO, in conjunction with the ITM, develops and provides IR training for all users in accordance with IRP.  Initial training will be provided to all IS users as part of initial training for new users, with refresher training be provided at least annually thereafter. The CISO will provide the Human Resources Department Manager (HR DM) records of IR training and the HR DM will track this training.</p><p>The ITM identifies roles that have IR responsibilities beyond the basic IS user level and designates, in writing, personnel with elevated incident response roles. The ITM, with the support of the CISO, develops and provides supplemental role-based IR training for personnel so designated. The ITM will ensure that this training is accomplished within (???) days of assignment to those elevated roles and at least annually thereafter. The ITM will provide the HR DM records of elevated responsibility IR training and the HR DM will track this training.</p><p>Conducting Incident Response Exercises</p><p>The CISO, in concert with the CM; schedules, plans, and conducts exercises of IR capability at least quarterly. The CISO develops the exercise plan at least (???) weeks prior to the proposed exercise start and submits to CM for approval. CM approves exercise plan and designates an exercise start date.</p><p>The CISO conducts the exercise in accordance with the exercise plan, documents the results in an exercise report, and submits exercise report to CM within (???) business days of exercise completion.  CM reviews the exercise report and directs corrective action as appropriate.  The CISO factors exercise findings into subsequent training and exercises.</p><p>The exercise plan shall include discussion of planned event, schedule of events, primary participants, measures of effectiveness, and any coordination with other exercises or plan (Continuity Plans, Disaster Recovery Plans, etc.)  The exercise report shall include an exercise summary, assessment of IR effectiveness, and review of the effect of IR on organizational operations and assets.</p><p>LP3 IRT shall conduct Incident Response Plan testing every six (6) months or one (1) month after the resolution of an incident. Testing records will be retained until the completion and comparison to the previous testing records.</p><p>Testing shall involve all aspects of the Incident Response Plan and logs of tests shall be stored in a secure location.</p>","ANTIVIRUS_POLICY.docx":"<p>420370276225290090900</p><p>Antivirus Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>12/5/2022</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The Antivirus Policy establishes requirements that must be met by all computers (laptops, desktops, mobile devices) and servers connected to LP3 network to ensure effective detection and prevention of the virus, malware, and trojan.</p><p>Scope</p><p>The Antivirus Policy applies to all computers, mobile devices, and servers that LP3  is responsible to manage. This policy also applies to any system that LP3 has a contractual obligation to administer.</p><p>Background</p><p>New viruses are discovered almost every day. Therefore, it is necessary that organization adopt a standard approach to deploy anti-virus application across all computers and servers. The anti-virus solution or software should guard against malicious software or scripts by blocking or quarantining the malicious software that is identified, and alerting administrators that such action has taken place</p><p>Policy</p><p>Computers</p><p>• All LP3's computers must have the Company's standard and supported antivirus software installed and scheduled to run regularly. In addition, the antivirus software and the virus pattern files must be kept up-to-date. Virus-infected computers must be removed from the network until verified as virus-free.</p><p>• The IT team is responsible for establishing procedures to ensure that antivirus software is executed regularly and computers are verified as virus-free. Different procedures must be implemented for Macintosh and Windows computers.</p><p>• Malicious code that is identified should be blocked, quarantined, and an alert is sent to the administrators.</p><p>• According to the Acceptable Use Policy, any activities to create and distribute malicious programs into LP3's networks (e.g., viruses, worms, Trojans, etc.) are prohibited.</p><p>• The end users cannot disable the antivirus software on their devices.</p><p>• Audit logs of the scans should be kept for future reference. (e.g., Audit)</p><p>Antivirus on Servers</p><p>All servers must have an antivirus application installed that offers real-time scanning protection to files and applications running on the target system. Following servers must have an antivirus software</p><p>• File servers</p><p>• HTTP/FTP servers open to the Internet</p><p>• Other risky protocols/applications on the network</p><p>• Systems with outbound web access</p><p>Mail Server</p><p>• If the target system is a mail server, it must have an external or internal antivirus scanning application that scans all mail destined to and from the mail server.</p><p>Internet Gateway</p><p>• Antivirus must be deployed at the perimeter of LP3's network to block viruses, worms, trojans, and spyware before they can infect internal systems.</p><p>Enforcement</p><p>The Information Security team will verify compliance to this policy through various methods, including but not limited to, business tool reports, internal and external audits, and feedback to the policy owner.</p><p>An employee found to have violated this policy may be subject to disciplinary action, up to and including termination of employment.</p>","NETWORK_MANAGEMENT_POLICY.docx":"<p>Network Management Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>1/31/23</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>Purpose of this policy is to establish standards for protecting networks and firewalls in LP3.</p><p>Scope</p><p>This policy applies to all networks</p><p>• Internal networks managed by LP3</p><p>• Cloud hosted networks managed by LP3</p><p>• Other third-party networks</p><p>Background</p><p>Networks are an essential component of all companies' security infrastructure, which manages connectivity and data flow to and from its information systems. As a result, it is critical to protect the networks from unauthorized access, malicious code, unwanted traffic, etc. Failure to protect the network will very easily lead to attacks such as</p><p>• Denial of service</p><p>• Ransomware</p><p>• Data breaches, loss, and theft</p><p>• Introduction of malicious code</p><p>To prevent and protect the health and security of the company networks, implementation of Boundary Protection Systems, policies and processes are developed to address and mitigate risk by:</p><p>• Implement firewalls to protect the organization's network perimeter.</p><p>• Configure access control systems to limit and monitor access to the network and data.</p><p>• Use encryption to protect data in transit and at rest.</p><p>• Regularly update software and systems to address known security vulnerabilities.</p><p>• Perform regular penetration testing to identify and address potential security weaknesses.</p><p>• Monitor network activity for suspicious behavior and respond to security incidents in a timely manner.</p><p>• Implement multi-factor authentication for sensitive systems and data.</p><p>• Educate employees on security policies and procedures.</p><p>Policy</p><p>Documenting the network</p><p>All network patterns and high-level data flow at LP3 are documented and regularly reviewed, and updated as required. The documentation, at the minimum, includes</p><p>• A diagram of permissible paths with a justification for each,</p><p>• A description of permissible services, ports, and protocols</p><p>• VPCs, Private and Public Subnets</p><p>• VPNs, Firewalls</p><p>Network device baseline configuration</p><p>A baseline configuration is established and includes:</p><p>• Hardware</p><p>• Software</p><p>• Firmware</p><p>• Documentation for all network protection devices.</p><p>All ports, protocols, and connectivity will default to DENY</p><p>Every connectivity path and service is blocked. The connectivity can be opened only by specific requests made or needed.</p><p>Internal connections between machines</p><p>Real-time connections between user machines and production machines must be disabled by default and be enabled only by special requests using bastion servers, security groups, white labeling, firewalls, or other access control methods.</p><p>Secured Subnets &amp; demilitarized zone (DMZ)</p><p>Secure servers such as databases should be disconnected from the public network and be deployed on their own private subnet. Access to this and other subnets should be restricted with firewalls and other access control measures.</p><p>Encryption of traffic in transit</p><p>All public-facing networks or traffic from public networks arriving at the public subnets should be encrypted using protocols such as HTTPS, or sftp</p><p>Use of firewall</p><p>Firewalls are defined as security systems that control and restrict network connectivity and network services. Firewalls establish a control point where access controls may be enforced. All connections from external and public networks should pass via a firewall.  This requirement applies no matter the technology employed, including wireless connections, cloud networks, wifi-routers, etc.</p><p>Firewall rules</p><p>Firewall rules should, at the minimum, have the following protection</p><p>• OWASP top 10</p><p>• DDOS</p><p>• Block traffic from known malicious IP addresses</p><p>• Suspicious network activity</p><p>• Block specific ports and protocols</p><p>Firewall Access Mechanisms</p><p>Firewall access must be considered an elevated privilege and should follow procedures for granting elevated access.</p><p>Logging and Monitoring</p><p>All changes to network and firewall configuration parameters enabled services and permitted connectivity paths must be logged. All suspicious activity should be monitored using automated software. The integrity of these logs must be protected with checksums, digital signatures, encryption, or similar measures. These logs must be promptly removed and stored in a physically protected container for at least six months after the time they were recorded. These logs must be reviewed periodically to ensure that the firewalls operate securely.</p><p>Intrusion Detection</p><p>All firewalls must include intrusion detection systems. Each of these intrusion detection systems must be configured to identify potential problems like unauthorized modifications to firewall system files and detect denial of service attacks in progress, etc.</p><p>Backup of configuration files</p><p>Back-up copies of firewall and other network configuration files, connectivity permission files, etc., are backed up and kept for 90 days.</p><p>The backup files are stored in an online encrypted vault or alternate processing systems.</p><p>Virus Screening and Content Screening</p><p>All networks and network components such as firewalls must be screened for viruses or malicious code and files.</p><p>Virtual Private Networks</p><p>All remote and on-field employees should connect to VPN to access corporate networks. To prevent unauthorized disclosure of sensitive and valuable information, all inbound traffic, except Internet mail and other cloud-hosted systems, must be authenticated and encrypted with a VPN.</p><p>Network and firewall testing</p><p>- Because firewalls provide such an important control, their strength and proper configuration must be tested regularly. This testing process must include consideration of defined configuration parameters, enabled services, permitted connectivity paths, current administrative practices, and adequacy of the deployed security measures. These tests must include the regular execution of vulnerability identification software and the regular performance of penetration tests. These tests must be performed by technically proficient persons, either in the Information Technology department or working for a third-party contractor. Those responsible for either the administration or management of the involved firewalls must not perform these tests</p><p>Contingency Planning</p><p>Technical staff working on firewalls must prepare contingency plans that address the actions to be taken in the event of various problems, including system compromise, system malfunction, system crash, system overload, and Internet service provider unavailability.  These contingency plans must be kept current and be created along with Incident Response Team and IT support teams.</p><p>Enforcement</p><p>Departures from this policy will be permitted only if approved in advance and written by the IT department.</p><p>In some instances, systems such as routers or gateways may function as firewalls using Cloud-provided infrastructure.</p>","BACKUP_POLICY - Draft Comments added.docx":"<p>420370276225290090900</p><p>Backup Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>12/05/22</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of the Backup Policy is to maintain data integrity and availability of the LP3's information system, to prevent loss of data, and to facilitate the restoration of the information system and business processes.</p><p>Scope</p><p>The backup policy applies to the following personnel</p><p>• All databases of LP3</p><p>• All data created by the information systems of LP3</p><p>• All vendors / third-party creating / managing data for LP3</p><p>Background</p><p>The purpose of a data backup is to create a copy of data that can be recovered in the event of a failure. Primary data failures can be the result of hardware or software failure, data corruption, or a human-caused event, such as a malicious attack (virus or malware), or accidental deletion of data. Backup copies allow data to be restored from an earlier point in time to help the business recover from an unplanned event.</p><p>Policy</p><p>Performing a backup</p><p>• Loss of data must be prevented by performing regular backups to meet the RPO (Recovery Point Objective) and RTO (Recovery Time Objective). Refer to the Data Retention Policy for RTO and RPO.</p><p>• For LP3 data for critical information systems must be backed up at least 2 times a day.</p><p>• The appropriate team/system owners must perform backups for the data and information systems they are responsible for protecting.</p><p>• Backup schedules must be maintained for all information systems centrally.</p><p>• The extent (e.g., full or differential backup) and frequency of backups should reflect the organization's business requirements, the security requirements of the information involved, and the criticality of the information to the continued operation of the organization.</p><p>Backup storage</p><p>• All backup data must be stored encrypted with the AES-256 symmetric encryption algorithm.</p><p>• Backup copies must be stored in an environmentally protected and access-controlled secure location offsite from the site of the originating asset.</p><p>• For highly critical data, more than one copy in a geographically distributed location must be considered.</p><p>• A record of the physical and logical movements of backup media must be maintained.</p><p>Restoring a backup</p><p>Backup copies must be tested every quarter for recovery capability.</p><p>Enforcement</p><p>The backup policy is enforced by the Infosec team and system owners of respective information systems whose data is backed up.  All exceptions to the policy should be brought to the attention of the Infosec team along with the executive management of the company.</p>","BUSINESS_CONTINUITY_POLICY.docx":"<p>420370276225290090900</p><p>Business Continuity Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>7/02/22</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of this policy is to outline objectives, plans, and, procedures put in place by LP3 to ensure that it minimizes disruption to the Company's key business activities caused by a major security incident or a natural disaster.</p><p>Scope</p><p>Business Continuity policy applies to following</p><p>• All Information Systems</p><p>• Operation teams and support personnel</p><p>• Senior management</p><p>Background</p><p>LP3 continuously aims for the preservation of critical business operations and essential functions to deliver key products and services. This policy outlines how LP3 ensures this continuity.</p><p>• This policy puts in place a structure and authority to ensure business resilience of operations and information systems.</p><p>• This policy puts in place a plan to manage business operations through the disaster period and the effort it will take to get back to normal operations</p><p>• This policy defines a disaster recovery plan containing a set of human, physical, technical, and procedural resources to return to a normal level of operation, within a defined time and cost, in case of an emergency or disaster.</p><p>Policy</p><p>LP3 must establish, implement and maintain procedures for the continuity of operations and ensure the availability of information systems and resources during adverse conditions. As a result, the company must create a contingency and recovery plan which must</p><p>• Identify essential information systems and critical business functions that must operate normally or in a limited fashion despite a system disruption, compromise, or failure;</p><p>• List associated contingency requirements for each one of the identified systems.</p><p>• Provide recovery objectives, restoration priorities, and metrics for each system.</p><p>• Define roles, responsibilities, and assigned individuals with contact information for each system.</p><p>• Create procedures for obtaining access to sensitive data during other-than-normal or emergency conditions.</p><p>• Create an inventory of recovery documents and operation procedures for each system. The steps should contain</p><p>• Assets impacted</p><p>• Custodian</p><p>• Ba
