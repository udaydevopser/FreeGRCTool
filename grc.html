            </div>

            {/* family dials */}
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-sm font-bold text-slate-200">Progress by control family</h2>
              <button onClick={()=>onNavigate("framework")} data-noshot="1" className="text-xs font-semibold text-indigo-300 hover:text-indigo-200">View all controls →</button>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-3">
              {FAMILIES.map(f=>{
                const s = familyStats(profile, f.code);
                return <Dial key={f.code} code={f.code} name={f.name} done={s.done} total={s.total} onClick={()=>onOpenControl(firstOf(f.code))} />;
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================= Evidence library ================= */
function EvidenceView({ profile, onNavigate, onOpenControl }){
  const groups = FAMILIES.map(f=>{
    const items = [];
    CONTROLS.filter(c=>c.family===f.code).forEach(c=>{
      const cs = profile.controls[c.id];
      (cs.attachments||[]).forEach(a=> items.push({ ctrl:c, where:"Control", att:a }));
      Object.entries(cs.objectives||{}).forEach(([label,ob])=>{
        (ob.attachments||[]).forEach(a=> items.push({ ctrl:c, where:`${c.id}[${label}]`, att:a }));
      });
    });
    items.sort((a,b)=> verCompare(a.ctrl.id,b.ctrl.id) || (a.att.added||0)-(b.att.added||0));
    return { fam:f, items };
  });
  const total = groups.reduce((s,g)=>s+g.items.length,0);
  const fmtWhen = (ts)=> ts ? new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "—";
  const isImg = (a)=> /^image\//.test(a.type||"") || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(a.name||"");
  const imgSrc = (a)=> a.href || a.dataUrl;
  const [preview, setPreview] = useState(null);   // image attachment shown in the lightbox
  useEffect(()=>{
    if(!preview) return;
    const onKey = (e)=>{ if(e.key==="Escape") setPreview(null); };
    window.addEventListener("keydown", onKey);
    return ()=> window.removeEventListener("keydown", onKey);
  }, [preview]);

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="evidence" onNavigate={onNavigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar profile={profile} />
        <div className="flex-1 overflow-y-auto px-6 py-6">
          <div className="mb-5">
            <h1 className="text-xl font-bold text-white">Evidence Library</h1>
            <p className="text-sm text-slate-400 mt-0.5">All artifacts uploaded across the assessment, organized by control family. {total} file{total!==1?"s":""} total.</p>
          </div>

          {/* family count chips */}
          <div className="flex flex-wrap gap-2 mb-6">
            {groups.map(g=>(
              <span key={g.fam.code} className={`text-[11px] font-semibold px-2.5 py-1 rounded-lg border ${g.items.length ? "text-indigo-200 border-indigo-500/30 bg-indigo-500/10" : "text-slate-500 border-slate-700 bg-slate-800/40"}`}>
                {g.fam.code} · {g.items.length}
              </span>
            ))}
          </div>

          {total===0 ? (
            <div className="rounded-xl border border-dashed border-slate-700 bg-slate-900/40 py-16 text-center">
              <div className="text-4xl mb-3">📎</div>
              <div className="text-slate-300 font-semibold">No evidence uploaded yet</div>
              <div className="text-sm text-slate-500 mt-1">Upload artifacts from any control or sub-control in the CMMC view — they'll be collected here by family.</div>
              <button onClick={()=>onNavigate("framework")} className="mt-4 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg">Go to CMMC →</button>
            </div>
          ) : (
            <div className="space-y-6">
              {groups.filter(g=>g.items.length).map(g=>(
                <div key={g.fam.code}>
                  <div className="flex items-center gap-2 mb-2">
                    <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wide">{g.fam.code}: {g.fam.name}</h2>
                    <span className="text-[11px] text-slate-500">{g.items.length} file{g.items.length!==1?"s":""}</span>
                  </div>
                  <div className="rounded-xl border border-slate-800 overflow-hidden">
                    <table className="w-full text-sm">
                      <thead className="bg-slate-900/60 text-xs text-slate-400">
                        <tr>
                          <th className="px-3 py-2 text-left font-semibold">File</th>
                          <th className="px-3 py-2 text-left font-semibold">Control</th>
                          <th className="px-3 py-2 text-left font-semibold">Location</th>
                          <th className="px-3 py-2 text-left font-semibold">Size</th>
                          <th className="px-3 py-2 text-left font-semibold">Added</th>
                          <th className="px-3 py-2"></th>
                        </tr>
                      </thead>
                      <tbody>
                        {g.items.map((it,i)=>(
                          <tr key={it.att.id+i} className="border-t border-slate-800/60 hover:bg-slate-800/30">
                            <td className="px-3 py-2.5">
                              {isImg(it.att) ? (
                                <button onClick={()=>setPreview(it.att)} title="Click to preview" className="text-indigo-300 hover:text-indigo-200 font-medium flex items-center gap-2 text-left">
                                  <img src={imgSrc(it.att)} alt="" className="w-10 h-7 rounded object-cover border border-slate-700 bg-slate-800 shrink-0" />
                                  <span className="max-w-[240px] truncate">{it.att.name}</span></button>
                              ) : (
                                <a href={it.att.href || it.att.dataUrl} {...(it.att.href ? { target:"_blank", rel:"noopener noreferrer" } : { download:it.att.name })} className="text-indigo-300 hover:text-indigo-200 font-medium flex items-center gap-1.5">
                                  <span>{it.att.href ? "🔗" : "📎"}</span><span className="max-w-[240px] truncate">{it.att.name}</span></a>
                              )}
                            </td>
                            <td className="px-3 py-2.5"><span className="font-mono text-[11px] text-slate-300">{it.ctrl.pid}</span></td>
                            <td className="px-3 py-2.5"><span className="text-[11px] text-slate-400">{it.where==="Control" ? "Control-level" : "Objective "+it.where}</span></td>
                            <td className="px-3 py-2.5 text-xs text-slate-400 whitespace-nowrap">{fmtBytes(it.att.size)}</td>
                            <td className="px-3 py-2.5 text-xs text-slate-400 whitespace-nowrap">{fmtWhen(it.att.added)}</td>
                            <td className="px-3 py-2.5 text-right"><button onClick={()=>onOpenControl(it.ctrl.id)} className="text-xs font-semibold text-indigo-300 hover:text-indigo-200 whitespace-nowrap">Open →</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {preview && (
        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-6 fade-in" onMouseDown={()=>setPreview(null)}>
          <div style={{maxWidth:"52.5rem"}} className="w-full max-h-[92vh] flex flex-col rounded-xl bg-slate-900 border border-slate-700 shadow-2xl overflow-hidden" onMouseDown={e=>e.stopPropagation()}>
            <div className="flex items-center gap-3 px-4 py-2.5 border-b border-slate-800 shrink-0">
              <span className="text-sm font-semibold text-slate-200 truncate">{preview.name}</span>
              <div className="ml-auto flex items-center gap-2 shrink-0">
                <a href={imgSrc(preview)} {...(preview.href ? { target:"_blank", rel:"noopener noreferrer" } : { download:preview.name })} className="text-[11px] font-semibold text-indigo-300 hover:text-indigo-200 border border-slate-700 hover:border-indigo-500 rounded px-2 py-1">⬇ Download</a>
                <button onClick={()=>setPreview(null)} title="Close (Esc)" className="text-slate-400 hover:text-white text-xl leading-none w-8 h-8 rounded hover:bg-slate-800 flex items-center justify-center">✕</button>
              </div>
            </div>
            <div className="overflow-auto bg-slate-950/60 flex items-center justify-center p-3">
              <img src={imgSrc(preview)} alt={preview.name} className="max-w-full max-h-[85vh] object-contain rounded" />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= Policies ================= */
function ControlPicker({ selected, onToggle, onClose }){
  const [q,setQ] = useState("");
  const ql = q.trim().toLowerCase();
  const match = (c)=> !ql || c.pid.toLowerCase().includes(ql) || c.title.toLowerCase().includes(ql) || c.id.includes(ql);
  return (
    <div className="mt-3 rounded-lg border border-slate-700 bg-slate-900 p-3">
      <div className="flex items-center gap-2 mb-2">
        <div className="relative flex-1">
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search controls to link…"
            className="w-full bg-slate-800 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
          <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs">🔍</span>
        </div>
        <button onClick={onClose} className="text-xs font-semibold text-slate-300 hover:text-white border border-slate-700 rounded-lg px-3 py-1.5">Done</button>
      </div>
      <div className="max-h-72 overflow-y-auto space-y-0.5 pr-1">
        {FAMILIES.map(f=>{
          const cs = CONTROLS.filter(c=>c.family===f.code && match(c));
          if(!cs.length) return null;
          return (
            <div key={f.code}>
              <div className="text-[10px] uppercase text-slate-500 font-semibold px-1 pt-2 pb-0.5">{f.code} · {f.name}</div>
              {cs.map(c=>{
                const on = selected.includes(c.id);
                return (
                  <button key={c.id} onClick={()=>onToggle(c.id)} className="w-full flex items-center gap-2 px-2 py-1 rounded hover:bg-slate-800 text-left">
                    <span className={`w-3.5 h-3.5 rounded border flex items-center justify-center text-[9px] shrink-0 ${on?"bg-indigo-600 border-indigo-500 text-white":"border-slate-600"}`}>{on?"✓":""}</span>
                    <span className="font-mono text-[11px] text-indigo-300 shrink-0">{c.pid}</span>
                    <span className="text-xs text-slate-300 truncate">{c.title}</span>
                  </button>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PolicyEditor({ profile, p, updateProfile, onClose }){
  const meta = policyMeta(profile, p);
  const [content,setContent] = useState(meta.content||"");
  const [dirty,setDirty] = useState(false);
  const [busy,setBusy] = useState("");
  const [hint,setHint] = useState("");
  const fileRef = useRef(null);

  const doSave = ()=>{
    updateProfile(prof=>{
      prof.policies = { ...(prof.policies||{}) };
      prof.policies[p.file] = { ...(prof.policies[p.file]||{}), content, contentUpdated:Date.now() };
      return prof;
    });
    setDirty(false);
  };
  const close = ()=>{ if(dirty && !confirm("Discard unsaved changes?")) return; onClose(); };

  const noMammoth = ()=>{ if(window.mammoth) return false; alert("The .docx reader didn't load — it needs internet the first time. You can still type or paste your policy language."); return true; };
  const applyDocx = (arrayBuffer)=> window.mammoth.convertToHtml({ arrayBuffer })
    .then(r=>{ setContent(r.value||""); setDirty(true); setBusy(""); setHint(""); })
    .catch(e=>{ console.error(e); setBusy(""); alert("Could not read the policy file: "+e.message); });
  // Import the exact language from this policy's original file. Auto-loads it when the
  // app is served over http; when opened from a local file (file://) the browser blocks
  // reading sibling files, so we fall back to letting the user pick that same .docx.
  const importOriginal = async ()=>{
    if(noMammoth()) return;
    if(!p.href){ // imported/custom policy has no on-disk template — pick a .docx to import
      setHint("Choose a .docx to import its language."); if(fileRef.current) fileRef.current.click(); return;
    }
    setBusy("Importing original language…"); setHint("");
    try{
      const resp = await fetch(p.href);
      if(!resp.ok) throw new Error("status "+resp.status);
      await applyDocx(await resp.arrayBuffer());
    }catch(e){
      setBusy(""); setHint("Select “"+p.file+"” from the Policy Examples folder to import its exact language.");
      if(fileRef.current) fileRef.current.click();
    }
  };
  const handlePicked = (file)=>{
    if(noMammoth()) return;
    setBusy("Importing “"+file.name+"”…");
    const reader = new FileReader();
    reader.onload = ()=> applyDocx(reader.result);
    reader.onerror = ()=>{ setBusy(""); alert("Could not read the file."); };
    reader.readAsArrayBuffer(file);
  };
  const exportWord = ()=>{
    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'><title>${meta.name}</title></head><body>${content||""}</body></html>`;
    const blob = new Blob(['﻿', html], { type:"application/msword" });
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=meta.name.replace(/\.[^.]+$/,"")+".doc";
    document.body.appendChild(a); a.click(); a.remove();
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 fade-in" onMouseDown={close}>
      <div className="w-full max-w-3xl max-h-[90vh] flex flex-col rounded-2xl border border-slate-700 bg-[#0f1420] shadow-2xl" onMouseDown={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 px-5 py-3 border-b border-slate-800">
          <div className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-lg shrink-0">📄</div>
          <div className="min-w-0">
            <div className="font-bold text-white truncate">{meta.name}</div>
            <div className="text-[11px] text-slate-500">{meta.contentUpdated ? "Last saved "+new Date(meta.contentUpdated).toLocaleString() : "Not yet saved in app"}{dirty ? " · unsaved changes" : ""}</div>
          </div>
          <button onClick={close} className="ml-auto text-slate-400 hover:text-white text-xl leading-none px-2">✕</button>
        </div>
        <div className="flex items-center gap-2 px-5 py-2 border-b border-slate-800 flex-wrap">
          <input ref={fileRef} type="file" accept=".docx" className="hidden" onChange={e=>{ if(e.target.files[0]) handlePicked(e.target.files[0]); e.target.value=""; }} />
          <button onClick={importOriginal} title="Pull in the exact language from the original policy file" className="text-xs font-semibold text-slate-200 border border-slate-700 hover:border-indigo-500 rounded-lg px-3 py-1.5">⬆ Import language</button>
          <button onClick={exportWord} className="text-xs font-semibold text-slate-200 border border-slate-700 hover:border-indigo-500 rounded-lg px-3 py-1.5">⬇ Export to Word</button>
          {p.href && <a href={p.href} target="_blank" rel="noopener noreferrer" download={p.file} className="text-xs font-semibold text-slate-400 hover:text-indigo-300 px-2 py-1.5">Open original template ↗</a>}
          {busy && <span className="text-xs text-amber-300">{busy}</span>}
          <button onClick={doSave} disabled={!dirty} className={`ml-auto text-xs font-semibold rounded-lg px-4 py-1.5 ${dirty ? "bg-indigo-600 hover:bg-indigo-500 text-white" : "bg-slate-800 text-slate-500 cursor-default"}`}>{dirty ? "Save" : "Saved"}</button>
        </div>
        {hint && <div className="px-5 py-1.5 text-[11px] text-amber-300/90 bg-amber-500/5 border-b border-slate-800">{hint}</div>}
        <div className="p-5 overflow-y-auto">
          {!content && !dirty && (
            <div className="mb-3 rounded-lg border border-slate-700/70 bg-slate-800/40 px-3 py-2 text-xs text-slate-400 flex items-center gap-2">
              <span>This policy has no saved language yet.</span>
              <button onClick={importOriginal} className="font-semibold text-indigo-300 hover:text-indigo-200">Import the original language →</button>
            </div>
          )}
          <RichText value={content} onChange={v=>{ setContent(v); setDirty(true); }} minHeight={360}
            placeholder="Write or paste your policy language here — or click “Import language” above to pull in the exact text from the original policy…" />
        </div>
      </div>
    </div>
  );
}

function PolicyRow({ profile, p, updateProfile, onOpenControl, onEdit }){
  const meta = policyMeta(profile, p);
  const [editing,setEditing] = useState(false);
  const [draft,setDraft] = useState(meta.name);
  const [picking,setPicking] = useState(false);

  const setPolicy = (patch)=> updateProfile(prof=>{
    prof.policies = { ...(prof.policies||{}) };
    prof.policies[p.file] = { ...(prof.policies[p.file]||{}), ...patch };
    return prof;
  });
  const saveName = ()=>{ const n=draft.trim(); setPolicy({ name: n || p.name }); setEditing(false); };
  // Linking a policy to a control only ASSOCIATES it (makes it a domain policy available to the
  // control's sub-controls). Compliance is approved per sub-control in Frameworks. Unlinking
  // reverts any sub-control that was made compliant via this policy and is no longer covered.
  const toggleControl = (cid)=> updateProfile(prof=>{
    prof.policies = { ...(prof.policies||{}) };
    const cur = (prof.policies[p.file] && prof.policies[p.file].controls) || [];
    const adding = !cur.includes(cid);
    const controls = adding ? [...cur, cid] : cur.filter(x=>x!==cid);
    prof.policies[p.file] = { ...(prof.policies[p.file]||{}), controls };
    if(!adding){
      const isDomainFor = (control)=> controls.includes(control.id) || controls.some(x=>{ const c=CONTROLS.find(y=>y.id===x); return c && c.family===control.family; });
      CONTROLS.forEach(control=>{
        const cs = prof.controls[control.id]; if(!cs) return;
        let changed=false; const objs = { ...cs.objectives };
        Object.keys(objs).forEach(k=>{
          if(objs[k].policyFile===p.file && !isDomainFor(control)){ const o={ ...objs[k], status:"incomplete" }; delete o.policyFile; objs[k]=o; changed=true; }
        });
        if(changed){ cs.objectives=objs; recomputeControl(prof, control.id); }
      });
    }
    return prof;
  });
  const extCls = p.ext==="XLSX" ? "bg-emerald-500/15 text-emerald-300 border-emerald-500/40" : "bg-sky-500/15 text-sky-300 border-sky-500/40";
  const hasLang = !!meta.content;
  const remove = ()=>{
    if(!confirm(`Remove policy “${meta.name}”?${p.isCustom ? "" : " (You can restore example policies later.)"}`)) return;
    updateProfile(prof=>{
      // revert any sub-control that was made compliant via this policy
      CONTROLS.forEach(control=>{
        const cs=prof.controls[control.id]; if(!cs) return;
        let changed=false; const objs={ ...cs.objectives };
        Object.keys(objs).forEach(k=>{ if(objs[k].policyFile===p.file){ const o={ ...objs[k], status:"incomplete" }; delete o.policyFile; objs[k]=o; changed=true; } });
        if(changed){ cs.objectives=objs; recomputeControl(prof, control.id); }
      });
      if(p.isCustom){ prof.customPolicies=(prof.customPolicies||[]).filter(x=>x.file!==p.file); if(prof.policies) delete prof.policies[p.file]; }
      else { prof.removedPolicies=[ ...(prof.removedPolicies||[]), p.file ]; }
      return prof;
    });
  };

  return (
    <div className="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
      <div className="flex items-start gap-3">
        <button onClick={()=>onEdit(p)} title="Edit policy language" className="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 hover:border-indigo-500 flex items-center justify-center text-xl shrink-0">📄</button>
        <div className="flex-1 min-w-0">
          {editing ? (
            <div className="flex items-center gap-2">
              <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter") saveName(); if(e.key==="Escape") setEditing(false); }}
                className="flex-1 bg-slate-800 border border-indigo-500 rounded-lg px-2.5 py-1 text-sm text-white focus:outline-none" />
              <button onClick={saveName} className="text-xs font-semibold text-emerald-300 hover:text-emerald-200 px-2 py-1">Save</button>
              <button onClick={()=>setEditing(false)} className="text-xs text-slate-500 hover:text-slate-300 px-1">Cancel</button>
            </div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={()=>onEdit(p)} className="font-semibold text-white hover:text-indigo-300 text-left">{meta.name}</button>
              <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded border ${extCls}`}>{p.ext}</span>
              {p.isCustom && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded border bg-violet-500/15 text-violet-300 border-violet-500/40">Imported</span>}
              {hasLang && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded border bg-emerald-500/15 text-emerald-300 border-emerald-500/40">Language saved</span>}
              <button onClick={()=>{ setDraft(meta.name); setEditing(true); }} title="Rename" className="text-slate-500 hover:text-indigo-300 text-xs">✎ Rename</button>
            </div>
          )}
          <div className="text-[11px] text-slate-500 mt-0.5 truncate">{p.isCustom ? "Imported policy" : p.file}</div>

          {/* linked controls */}
          <div className="flex items-center gap-1.5 flex-wrap mt-2">
            {meta.controls.length===0 && <span className="text-[11px] text-slate-600">No linked controls</span>}
            {meta.controls.slice().sort(verCompare).map(cid=>{
              const c = CONTROLS.find(x=>x.id===cid); if(!c) return null;
              return (
                <span key={cid} className="inline-flex items-center gap-1 text-[11px] font-semibold pl-2 pr-1 py-0.5 rounded-lg bg-indigo-500/10 border border-indigo-500/30 text-indigo-200">
                  <button onClick={()=>onOpenControl(cid)} className="hover:text-white" title={c.title}>{c.pid}</button>
                  <button onClick={()=>toggleControl(cid)} className="text-slate-500 hover:text-rose-400 px-0.5" title="Unlink">✕</button>
                </span>
              );
            })}
            <button onClick={()=>setPicking(x=>!x)} className="text-[11px] font-semibold text-indigo-300 hover:text-indigo-200 border border-indigo-500/40 rounded-lg px-2 py-0.5">
              {picking ? "Close" : "＋ Link controls"}{meta.controls.length? ` (${meta.controls.length})`:""}
            </button>
          </div>
          {picking && <ControlPicker selected={meta.controls} onToggle={toggleControl} onClose={()=>setPicking(false)} />}
        </div>
        <div className="shrink-0 flex items-center gap-2">
          <button onClick={remove} title="Remove policy" className="text-xs font-semibold text-slate-500 hover:text-rose-400 px-2 py-1.5">Remove</button>
          <button onClick={()=>onEdit(p)}
            className="inline-flex items-center gap-1.5 text-xs font-semibold bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white border border-slate-700 hover:border-indigo-500 rounded-lg px-3 py-1.5">
            <span>✎</span> Edit language</button>
        </div>
      </div>
    </div>
  );
}

function PoliciesView({ profile, updateProfile, onNavigate, onOpenControl }){
  const [query,setQuery] = useState("");
  const [editorP,setEditorP] = useState(null);
  const importRef = useRef(null);
  const list = allPolicies(profile);
  const q = query.trim().toLowerCase();
  const rows = list
    .filter(p=> !q || policyMeta(profile,p).name.toLowerCase().includes(q) || p.file.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))
    .sort((a,b)=> policyMeta(profile,a).name.localeCompare(policyMeta(profile,b).name, undefined, { numeric:true, sensitivity:"base" }));
  const linkedCount = list.filter(p=>policyMeta(profile,p).controls.length).length;

  // Import a policy: read a .docx into a brand-new custom policy, then open its editor
  // (where the user can name it and link it to controls, like the others).
  const importPolicy = (file)=>{
    const key = "custom-" + uid() + ".docx";
    const name = file.name.replace(/\.[^.]+$/,"") || "Imported Policy";
    const ext = (file.name.split(".").pop()||"DOCX").toUpperCase();
    const p = { file:key, name, ext, href:"", isCustom:true };
    const finish = (contentHtml)=>{
      updateProfile(prof=>{
        prof.customPolicies = [ ...(prof.customPolicies||[]), { file:key, name, ext } ];
        prof.policies = { ...(prof.policies||{}) };
        prof.policies[key] = { ...(prof.policies[key]||{}), content: contentHtml||"", contentUpdated: Date.now() };
        return prof;
      });
      setEditorP(p);
    };
    if(/\.docx$/i.test(file.name) && window.mammoth){
      const reader = new FileReader();
      reader.onload = ()=> window.mammoth.convertToHtml({ arrayBuffer: reader.result })
        .then(r=> finish(r.value||""))
        .catch(e=>{ alert("Could not read that .docx: "+e.message+"\nCreating a blank policy instead."); finish(""); });
      reader.onerror = ()=>{ alert("Could not read the file."); finish(""); };
      reader.readAsArrayBuffer(file);
    } else {
      finish(""); // non-docx or reader unavailable → start blank; user can type/paste
    }
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="policies" onNavigate={onNavigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar profile={profile}>
          <SearchBox value={query} onChange={setQuery} placeholder="Search policies…" />
        </TopBar>
        <div className="flex-1 overflow-y-auto px-6 py-6">
          <div className="mb-5 flex items-start justify-between gap-3 flex-wrap">
            <div>
              <h1 className="text-xl font-bold text-white">Policies</h1>
              <p className="text-sm text-slate-400 mt-0.5">{list.length} policy documents. Click a policy to edit its language, then link it to the controls it satisfies — linked controls are marked compliant. {linkedCount} linked.</p>
            </div>
            <input ref={importRef} type="file" accept=".docx" className="hidden" onChange={e=>{ if(e.target.files[0]) importPolicy(e.target.files[0]); e.target.value=""; }} />
            <button onClick={()=>importRef.current.click()} className="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2 rounded-lg shadow-lg shadow-indigo-900/40">
              <span className="text-base leading-none">＋</span> Import policy</button>
          </div>
          <div className="space-y-3">
            {rows.map(p=> <PolicyRow key={p.file} profile={profile} p={p} updateProfile={updateProfile} onOpenControl={onOpenControl} onEdit={setEditorP} />)}
            {rows.length===0 && (q
              ? <div className="text-sm text-slate-500 py-10 text-center">No policies match “{query}”.</div>
              : <div className="rounded-xl border border-dashed border-slate-700 bg-slate-900/40 py-16 text-center">
                  <div className="text-4xl mb-3">📜</div>
                  <div className="text-slate-300 font-semibold">No policies yet</div>
                  <div className="text-sm text-slate-500 mt-1 mb-4">Import your organization's policy documents to edit their language and link them to controls.</div>
                  <button onClick={()=>importRef.current.click()} className="text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg">＋ Import policy</button>
                </div>)}
          </div>
          {(profile.removedPolicies||[]).length>0 && (
            <div className="mt-4 text-xs text-slate-500">
              {profile.removedPolicies.length} example {profile.removedPolicies.length===1?"policy":"policies"} removed ·{" "}
              <button onClick={()=>updateProfile(p=>{ p.removedPolicies=[]; return p; })} className="text-indigo-300 hover:text-indigo-200 font-semibold">Restore all</button>
            </div>
          )}
          <p className="text-[11px] text-slate-600 mt-6">Policy language you edit is saved per tenant in this browser and reopens with your changes. Imported policies are stored per tenant. Use Import/Export inside the editor to move language to and from Word — a local page can't capture Word's Save automatically.</p>
        </div>
      </div>
      {editorP && <PolicyEditor key={editorP.file} profile={profile} p={editorP} updateProfile={updateProfile} onClose={()=>setEditorP(null)} />}
    </div>
  );
}

/* ================= Project Management (embedded TaskFlow) ================= */
function ProjectManagementView({ profile, onNavigate, fullBridge }){
  // taskflow.html lives in the sibling "project mgmt" folder. Relative path under file://,
  // or the /project-management route served by serve.js under the local server.
  const base = (typeof window!=="undefined" && window.location && window.location.protocol==="file:")
    ? "../project mgmt/taskflow.html" : "/project-management/taskflow.html";
  // link this tenant into TaskFlow as a client (stable id so re-opening doesn't duplicate),
  // and flow its live CMMC status + primary contact across.
  const done = CONTROLS.filter(c=>profile.controls[c.id].status==="complete").length;
  const c = profile.contact || {};
  const params = new URLSearchParams({
    client: profile.name, clientId: "cf-"+profile.id,
    sprs: String(sprsScore(profile)), pct: String(progressPct(profile)),
    done: String(done), total: String(CONTROLS.length),
  });
  if(c.name) params.set("contact", c.name);
  if(c.email) params.set("contactEmail", c.email);
  const src = base + "?" + params.toString();
  const iframeRef = useRef(null);
  const clientId = "cf-"+profile.id;
  // Push this tenant's live CMMC compliance into the iframe. postMessage works even under
  // file:// (where the iframe has a separate localStorage), so PM always mirrors the controls.
  const postBridge = ()=>{ try{ const w = iframeRef.current && iframeRef.current.contentWindow; if(!w) return;
    // Full snapshot of ALL tenants → TaskFlow mirrors the Tenants list (deleted tenants are pruned there).
    w.postMessage({ type:"cf-cmmc-bridge-full", data: fullBridge }, "*");
    w.postMessage({ type:"cf-cmmc-bridge", clientId, data: tenantBridge(profile) }, "*"); }catch(e){} };
  useEffect(()=>{ postBridge(); }); // re-post on every render so any compliance change is reflected
  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="projmgmt" onNavigate={onNavigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar profile={profile}>
          <a href={src} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-indigo-300 hover:text-indigo-200 border border-slate-700 hover:border-indigo-500 rounded-lg px-3 py-1.5">Open in new tab ↗</a>
        </TopBar>
        <div className="flex-1 min-h-0 bg-white">
          <iframe ref={iframeRef} onLoad={postBridge} src={src} title="Project Management — TaskFlow" className="w-full h-full border-0 block" />
        </div>
      </div>
    </div>
  );
}

/* ================= Scope (CUI boundary & data-flow diagrams) ================= */
function ScopeView({ profile, updateProfile, onNavigate }){
  const fileRef = useRef(null);
  const scope = profile.scope || {};
  const diagrams = scope.diagrams || [];
  const setNotes = (v)=> updateProfile(p=>{ p.scope = { ...(p.scope||{}) }; p.scope.notes = v; return p; });
  const addFiles = (files)=>{
    Array.from(files).forEach(file=>{
      if(file.size > 4*1024*1024 && !confirm(`"${file.name}" is ${fmtBytes(file.size)}. Diagrams are stored in this browser; very large files can exceed storage limits. Upload anyway?`)) return;
      const reader = new FileReader();
      reader.onload = ()=> updateProfile(p=>{
        p.scope = { ...(p.scope||{}) };
        p.scope.diagrams = [ ...(p.scope.diagrams||[]), { id:uid(), name:file.name, size:file.size, type:file.type, dataUrl:reader.result, added:Date.now() } ];
        return p;
      });
      reader.onerror = ()=> alert("Could not read "+file.name);
      reader.readAsDataURL(file);
    });
  };
  const removeDiagram = (id, name)=>{
    if(!confirm(`Remove “${name}” from scope?`)) return;
    updateProfile(p=>{ p.scope = { ...(p.scope||{}) }; p.scope.diagrams = (p.scope.diagrams||[]).filter(d=>d.id!==id); return p; });
  };

  // PDFs (and other non-images) render in the browser's built-in viewer via a blob: URL —
  // data: URLs are blocked in iframes, blob: URLs are not.
  const isImg = (d)=> /^image\//.test((d&&d.type)||"");
  const blobUrls = useMemo(()=>{
    const map = {};
    diagrams.forEach(d=>{
      if(isImg(d)) return;
      const m = /^data:([^;]+);base64,(.*)$/.exec(d.dataUrl||""); if(!m) return;
      try{
        const bin = atob(m[2]); const arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
        map[d.id] = URL.createObjectURL(new Blob([arr], { type:m[1] }));
      }catch(e){}
    });
    return map;
  }, [diagrams]);
  useEffect(()=>()=>{ Object.values(blobUrls).forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }); }, [blobUrls]);

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="scope" onNavigate={onNavigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar profile={profile} />
        <div className="flex-1 overflow-y-auto px-6 py-6 max-w-7xl">
          <div className="mb-5 flex items-start justify-between gap-3 flex-wrap">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <h1 className="text-xl font-bold text-white">SV4</h1>
                <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-200 border border-indigo-500/40">Tenant: {profile.name}</span>
              </div>
              <p className="text-sm text-slate-400 mt-0.5">Assessment boundary for <span className="text-slate-300 font-semibold">{profile.name}</span>. Upload the network / CUI data-flow diagram(s) showing where CUI is stored, processed, and transmitted — you can add multiple.</p>
            </div>
            <input ref={fileRef} type="file" multiple accept="image/*,.pdf,.vsdx,.drawio" className="hidden"
              onChange={e=>{ if(e.target.files.length) addFiles(e.target.files); e.target.value=""; }} />

/* ================= SSP (System Security Plan) ================= */
// Structure modeled on a standard CMMC enclave SSP (sections 1-11 + §12 controls).
// Generic template only — no organization-specific content.
const SSP_HEADER = [
  { n:"1",  key:"systemName",         label:"System Name and Identifier",           rich:false, placeholder:"e.g. [Organization] CUI Enclave" },
  { n:"2",  key:"categorization",     label:"Information System Categorization",     rich:false, placeholder:"e.g. Moderate confidentiality (CUI)" },
  { n:"3",  key:"owner",              label:"Information System Owner",              rich:true,  placeholder:"Name, title, organization, email, phone" },
  { n:"4",  key:"authorizingOfficial",label:"Authorizing Official",                  rich:true,  placeholder:"Name, title, organization, contact" },
  { n:"5",  key:"contacts",           label:"Other Designated Contacts",             rich:true,  placeholder:"Management, technical, and additional points of contact" },
  { n:"6",  key:"responsibility",     label:"Assignment of Security Responsibility", rich:true,  placeholder:"Assigned ISSO and security responsibilities" },
  { n:"7",  key:"operationalStatus",  label:"Information System Operational Status",  rich:false, placeholder:"Operational / Under Development / Major Modification" },
  { n:"8",  key:"systemType",         label:"Information System Type",               rich:false, placeholder:"e.g. CUI Enclave / General Support System" },
  { n:"9",  key:"generalDescription", label:"General System Description",            rich:true,  placeholder:"Purpose of the system, supported applications, and user community" },
  { n:"10", key:"environment",        label:"System Environment and Inventory",      rich:true,  placeholder:"Environment of operation, system boundary & dataflow, and inventory (hardware, software, firmware)" },
  { n:"11", key:"interconnections",   label:"System Interconnections & Scope",       rich:true,  placeholder:"External system connections, interconnections, and system scope" },
];
// Control status derived from its sub-controls: Compliant only when ALL are complete,
// Partially Compliant when some are, Not Met when none are.
const SSP_STATUS = { complete:"Compliant", inprogress:"Partially Compliant", incomplete:"Not Met" };
const SSP_STATUS_CLS = { complete:"text-emerald-300", inprogress:"text-amber-300", incomplete:"text-slate-400" };
// Client's self-reported preliminary status (imported from CSV; independent of the derived status above).
const PRELIM = { met:"Met", notmet:"Not Met", partial:"Partially Compliant" };
const PRELIM_CLS = { met:"text-emerald-300", notmet:"text-rose-300", partial:"text-amber-300" };
const normPrelim = (s)=>{ const t=String(s||"").toLowerCase(); if(!t.trim()) return ""; if(/not\s*met|non.?compl|fail|\bno\b/.test(t)) return "notmet"; if(/partial/.test(t)) return "partial"; if(/\bmet\b|compliant|pass|\byes\b/.test(t)) return "met"; return ""; };
// Minimal RFC-4180 CSV parser (handles quoted fields, embedded commas/newlines, "" escapes).
function parseCSV(text){
  const rows=[]; let field="", row=[], inQ=false;
  const s=String(text||"").replace(/^﻿/,"");
  for(let i=0;i<s.length;i++){ const ch=s[i];
    if(inQ){ if(ch==='"'){ if(s[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===',') { row.push(field); field=""; }
    else if(ch==='\r') {}
    else if(ch==='\n') { row.push(field); rows.push(row); row=[]; field=""; }
    else field+=ch;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==""));
}

// Live model of §12 assembled from the tenant's control/objective/evidence data.
function sspModel(profile){
  const mk = (ctrls, prefix)=>{
    const byFam = {};
    ctrls.forEach(c=>{ (byFam[c.family]=byFam[c.family]||[]).push(c); });
    return FAMILIES.filter(f=>byFam[f.code]).map(f=>({
      code:f.code, name:f.name, narrative:(profile.domains||{})[f.code]?.ssp || "",
      controls: byFam[f.code].map(c=>{
        const cs = profile.controls[c.id];
        const evidence = [ ...(cs.attachments||[]).map(a=>a.name) ];
        c.objectives.forEach(ob=>{ (cs.objectives[ob.label]?.attachments||[]).forEach(a=>evidence.push(a.name)); });
        const objectives = c.objectives.map(ob=>({ label:ob.label, text:ob.text, status:cs.objectives[ob.label]?.status||"incomplete", note:cs.objectives[ob.label]?.note||"" }));
        return { id:c.id, pid:`${c.family}.${prefix}-${c.id}`, title:c.title, text:c.text, status:cs.status, clientResponse:cs.clientResponse||"", prelimStatus:cs.prelimStatus||"", objectives, evidence };
      })
    }));
  };
  return [
    { level:"12.1", title:"CMMC Level 1", domains: mk(CONTROLS.filter(c=>c.level==="L1"), "L1") },
    { level:"12.2", title:"CMMC Level 2", domains: mk(CONTROLS.filter(c=>c.level!=="L1"), "L2") },
  ];
}
const sspEsc = (s)=> String(s==null?"":s).replace(/[&<>]/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[m]));
const SSP_ST_CLS = { complete:"status-compliant", inprogress:"status-progress", incomplete:"status-notassessed" };
// §10.2 pulls the CUI boundary / data-flow diagrams + narrative from the Scope page.
function sspScopeHtml(profile, imgSrcFor){
  const sc = profile.scope || {};
  const ds = sc.diagrams || [];
  let h = `<h3>10.2 System Boundary &amp; Dataflow Diagram</h3>`;
  h += sc.notes || `<p><i>[Scope narrative not provided]</i></p>`;
  if(!ds.length) h += `<p><i>[No boundary / dataflow diagram uploaded — add one on the Scope page]</i></p>`;
  ds.forEach((d,i)=>{
    if(/^image\//.test(d.type||"")){
      const src = imgSrcFor(d, i);
      if(src) h += `<p><img src="${src}" style="max-width:6.5in" /></p><p style="font-size:9pt;color:#6b7280">Figure ${i+1}: ${sspEsc(d.name)}</p>`;
    } else {
      h += `<p><b>Diagram:</b> ${sspEsc(d.name)} <i>(provided separately)</i></p>`;
    }
  });
  return h;
}
function sspHeaderHtml(profile, imgSrcFor){
  const ssp = profile.ssp||{};
  const imgFor = imgSrcFor || ((d)=>d.dataUrl);
  let h = "";
  SSP_HEADER.forEach(sec=>{
    h += `<h2>${sec.n}. ${sspEsc(sec.label)}</h2>` + (sec.rich ? (ssp[sec.key]||"<p><i>[Not provided]</i></p>") : `<p>${sspEsc(ssp[sec.key]||"[Not provided]")}</p>`);
    if(sec.key==="environment") h += sspScopeHtml(profile, imgFor);
  });
  return h;
}
function sspControlsHtml(profile){
  const respName = (profile.clientResponseName||"").trim() || "Client Response";
  let h = `<h2 class="pagebreak">12. Minimum Security Controls</h2>`;
  sspModel(profile).forEach(sec=>{
    h += `<h3>${sec.level} ${sspEsc(sec.title)}</h3>`;
    sec.domains.forEach(d=>{
      h += `<h4>${d.code}: ${sspEsc(d.name)}</h4>` + (d.narrative||"");
      d.controls.forEach(c=>{
        h += `<h5>${c.pid} ${sspEsc(c.title)}</h5><p class="req">${sspEsc(c.text)}</p>`;
        h += `<p><b>Assessment Status:</b> <span class="${SSP_ST_CLS[c.status]}">${SSP_STATUS[c.status]||c.status}</span>` +
             (c.prelimStatus ? ` &middot; <b>Preliminary Status:</b> ${sspEsc(PRELIM[c.prelimStatus]||c.prelimStatus)}` : "") + `</p>`;
        if(c.clientResponse) h += `<p><b>${sspEsc(respName)}:</b></p>${c.clientResponse}`;
        h += `<table><tr><th style="width:28%">Assessment Objective</th><th style="width:14%">Status</th><th>${sspEsc(respName)}</th></tr>`;
        c.objectives.forEach(o=>{ h += `<tr><td><b>${c.id}[${o.label}]</b> ${sspEsc(o.text)}</td><td class="${SSP_ST_CLS[o.status]}">${SSP_STATUS[o.status]||o.status}</td><td>${o.note || "<span style='color:#9ca3af'>&mdash;</span>"}</td></tr>`; });
        h += `</table>`;
        if(c.evidence.length) h += `<p><b>Evidence:</b> ${c.evidence.map(sspEsc).join(", ")}</p>`;
      });
    });
  });
  return h;
}

/* Package the SSP for download. When the Scope page has image diagrams we emit MHTML
   (multipart/related) so Word reliably renders the embedded images — this is the same
   single-file format Word itself produces. With no images we keep the plain HTML .doc. */
const b64utf8 = (s)=>{
  const bytes = new TextEncoder().encode(s); let bin = ""; const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin);
};
const b64lines = (b64)=> b64.replace(/(.{76})/g, "$1\r\n");
function buildSSPDoc(profile){
  const ds = ((profile.scope||{}).diagrams) || [];
  const imgs = [];
  ds.forEach((d,i)=>{
    const m = /^data:([^;]+);base64,(.+)$/.exec(d.dataUrl||"");
    if(m && /^image\//.test(m[1])) imgs.push({ id:d.id, cid:`diagram${i+1}.${(m[1].split("/")[1]||"png").replace("jpeg","jpg")}`, mime:m[1], b64:m[2] });
  });
  const cidById = {}; imgs.forEach(im=>{ cidById[im.id] = im.cid; });
  const html = buildSSPHtml(profile, (d)=> cidById[d.id] || d.dataUrl);
  if(!imgs.length) return { content: html, mime:"application/msword", bom:true };
  const B = "----=_NextPart_FreeGRCTool_SSP";
  const base = "file:///C:/FreeGRCTool/";
  let mht = `MIME-Version: 1.0\r\nContent-Type: multipart/related; type="text/html"; boundary="${B}"\r\n\r\n`;
  mht += `--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: ${base}ssp.htm\r\n\r\n${b64lines(b64utf8(html))}\r\n\r\n`;
  imgs.forEach(im=>{ mht += `--${B}\r\nContent-Type: ${im.mime}\r\nContent-Transfer-Encoding: base64\r\nContent-Location: ${base}${im.cid}\r\n\r\n${b64lines(im.b64)}\r\n\r\n`; });
  mht += `--${B}--\r\n`;
  return { content: mht, mime:"message/rfc822", bom:false };
}
function SafeHtml({ html, className }){ return <div className={className} dangerouslySetInnerHTML={{ __html: html||"" }} />; }

function SSPView({ profile, updateProfile, onNavigate, onOpenControl }){
  const ssp = profile.ssp || {};
  const scope = profile.scope || {};
  const setField = (key,val)=> updateProfile(p=>{ p.ssp = { ...(p.ssp||{}) }; p.ssp[key]=val; return p; });
  // The SSP is read-only. Compliance is set at the control / sub-control level (CMMC view);
  // the SSP just reflects it.
  const model = sspModel(profile);
  const done = CONTROLS.filter(c=>profile.controls[c.id].status==="complete").length;
  const respName = (profile.clientResponseName||"").trim() || "Client Response";
  const [reviewing,setReviewing] = useState(false);
  const csvRef = useRef(null);
  const exportWord = ()=>{
    const { content, mime, bom } = buildSSPDoc(profile);
    const blob = bom ? new Blob(['﻿', content], { type:mime }) : new Blob([content], { type:mime });
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${profile.slug||"ssp"}-SSP-${todayISO()}.doc`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  // Import a CSV to populate the client responses. Columns (by header, else by position A–E):
  //   A Domain · B Requirement ID · C Interviewer Answer · D Person (respondent name) · E Preliminary Status
  const importCsv = (file)=>{
    if(!file) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const rows = parseCSV(rd.result);
      if(!rows.length){ alert("That CSV appears to be empty."); return; }
      const hdr = rows[0].map(x=>String(x||"").trim().toLowerCase());
      const find = (...keys)=> hdr.findIndex(h=> keys.some(k=>h.includes(k)));
      let iReq=find("requirement id","requirement","control id","control"),
          iAns=find("interviewer answer","client response","answer","response"),
          iStat=find("preliminary status","status"),
          iName=find("respondent","interviewee","person","name");
      const hasHeader = iReq>=0 || iAns>=0 || iStat>=0;
      // "interviewer answer" contains no "name", so the name lookup won't collide; still, prefer column D.
      if(iName<0 || iName===iAns) iName=3;
      if(!hasHeader){ iReq=1; iAns=2; iName=3; iStat=4; }
      else { if(iReq<0) iReq=1; if(iAns<0) iAns=2; if(iStat<0) iStat=4; }
      const dataRows = hasHeader ? rows.slice(1) : rows;
      const parsed = dataRows.map(r=>{
        const m = String(r[iReq]||"").match(/\d+\.\d+\.\d+/);
        if(!m) return null;
        return { id:m[0], ans:String(r[iAns]||"").trim(), st:normPrelim(r[iStat]), nm:String(r[iName]||"").trim() };
      }).filter(Boolean);
      const name = (parsed.find(x=>x.nm && profile.controls[x.id])||{}).nm || "";
      const matched = parsed.filter(x=>profile.controls[x.id]).length;
      if(!matched){ alert("No rows matched a control. Ensure a Requirement ID column holds values like 3.1.1 or AC.L2-3.1.1."); return; }
      updateProfile(p=>{
        parsed.forEach(x=>{
          if(!p.controls[x.id]) return;
          const c = { ...p.controls[x.id] };
          if(x.ans) c.clientResponse = /<[a-z][\s\S]*>/i.test(x.ans) ? x.ans : ("<p>"+sspEsc(x.ans)+"</p>");
          if(x.st) c.prelimStatus = x.st;
          p.controls[x.id] = c;
        });
        if(name) p.clientResponseName = name;
        return p;
      });
      alert(`Imported ${matched} control response(s)`+(name?` — attributed to ${name}`:"")+".");
    };
    rd.readAsText(file);
  };
  return (
    <div className="flex h-screen overflow-hidden">

function ScoreRing({ pct }){
  const r=26, c=2*Math.PI*r, off=c-(pct/100)*c;
  const color = pct>=80?"#34d399":pct>=40?"#fbbf24":"#fb7185";
  return (
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r={r} fill="none" stroke="#1e293b" strokeWidth="6"/>
      <circle cx="32" cy="32" r={r} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 32 32)"/>
      <text x="32" y="36" textAnchor="middle" fontSize="15" fontWeight="700" fill="#e2e8f0">{pct}%</text>
    </svg>
  );
}

/* ================= Root ================= */
// Compact CMMC tree + live status per tenant, shared with TaskFlow (Project Management) via
// a same-origin localStorage bridge so the PM view mirrors CMMC domains/controls/sub-controls.
// Live CMMC snapshot for one tenant (domains → controls → sub-controls + status + per-control progress).
function tenantBridge(p){
  const domains = FAMILIES.map(f=>{
    const controls = CONTROLS.filter(c=>c.family===f.code).map(c=>{
      const st = p.controls[c.id] || { status:"incomplete", objectives:{} };
      const objectives = c.objectives.map(o=>({ label:o.label, text:o.text, status:(st.objectives[o.label]&&st.objectives[o.label].status)||"incomplete" }));
      return { id:c.id, pid:c.pid, title:c.title, status:st.status||"incomplete",
        objDone: objectives.filter(o=>o.status==="complete").length, objTotal: objectives.length, objectives };
    });
    return { code:f.code, name:f.name, done:controls.filter(c=>c.status==="complete").length, total:controls.length, controls };
  });
  const done = CONTROLS.filter(c=>p.controls[c.id]?.status==="complete").length;
  const curPct = progressPct(p);
  // Week-over-week delta from the tenant's dated history snapshots (see recordSnapshot/pickBaseline).
  const base = pickBaseline(p.history, 7);
  const hasBaseline = Array.isArray(p.history) && p.history.some(h=> h.ts <= Date.now()-7*86400000);
  const basePct = base ? base.pct : curPct;
  const baseDone = base ? base.done : done;
  return { name:p.name, sprs:sprsScore(p), pct:curPct, done, total:CONTROLS.length,
    week:{ hasBaseline, pctChange: curPct-basePct, doneChange: done-baseDone, basePct, baseDate: base?base.date:null },
    domains };
}
function buildPmBridge(state){
  const tenants = {};
  (state.profiles||[]).forEach(p=>{ tenants["cf-"+p.id] = tenantBridge(p); });
  return { version:1, updatedAt:Date.now(), tenants };
}

function App(){
  const [state, setState] = useState(loadState);
  useEffect(()=>{ saveState(state); }, [state]);
  // publish the CMMC bridge for TaskFlow whenever anything changes
  useEffect(()=>{ try{ localStorage.setItem("controlforge.pm.v1", JSON.stringify(buildPmBridge(state))); }catch(e){} }, [state]);
  // TaskFlow (the PM iframe) can ask FreeGRCTool.com to open a control in the CMMC tab
  useEffect(()=>{
    const onMsg=(e)=>{ const d=e.data; if(!d) return;
      if(d.type==="cf-open-control" && d.id) setState(s=>({ ...s, selectedControlId:d.id, activeView:"framework" }));
      else if(d.type==="cf-open-ssp") setState(s=>({ ...s, activeView:"ssp" }));
      else if(d.type==="cf-new-tenant"){
        // TaskFlow's "New Tenant" → create a blank tenant here; reply with its bridge so TaskFlow links it as a project.
        const p = newProfile(String(d.name||"").trim() || "New Tenant");
        setState(s=>({ ...s, profiles:[...s.profiles, p] }));
        try{ e.source && e.source.postMessage({ type:"cf-cmmc-bridge", clientId:"cf-"+p.id, data: tenantBridge(p) }, "*"); }catch(_){}
      } };
    window.addEventListener("message", onMsg);
    return ()=>window.removeEventListener("message", onMsg);
  }, []);

  // On load, record/refresh today's compliance snapshot for every tenant (one entry per day) so
  // the dashboard can compare current state to ~one week ago.
  useEffect(()=>{
    setState(s=>{
      if(!s.profiles.length) return s;
      return { ...s, profiles: s.profiles.map(p=>({ ...p, history: recordSnapshot(p) })) };
    });
  }, []);

  const activeProfile = state.profiles.find(p=>p.id===state.activeProfileId);

  const updateProfile = useCallback((mutator)=>{
    setState(s=>{
      const profiles = s.profiles.map(p=>{
        if(p.id!==s.activeProfileId) return p;
        const copy = JSON.parse(JSON.stringify(p));
        return mutator(copy) || copy;
      });
      return { ...s, profiles };
    });
  }, []);

  const selected = state.selectedControlId || "3.1.1";
  const onNavigate = (view)=> setState(s=>({ ...s, activeView:view }));
  const onSelect = (id)=> setState(s=>({ ...s, selectedControlId:id }));
  const onOpenControl = (id)=> setState(s=>({ ...s, selectedControlId:id, activeView:"framework" }));

  if(activeProfile){
    if(state.activeView==="command")
      return <CommandCenter state={state} setState={setState} chrome={{ onNavigate, activeProfile }} />;
    if(state.activeView==="dashboard")
      return <DashboardView profile={activeProfile} updateProfile={updateProfile} onNavigate={onNavigate} onOpenControl={onOpenControl} />;
    if(state.activeView==="scope")
      return <ScopeView profile={activeProfile} updateProfile={updateProfile} onNavigate={onNavigate} />;
    if(state.activeView==="framework")
      return <FrameworkView profile={activeProfile} updateProfile={updateProfile} onNavigate={onNavigate} selected={selected} onSelect={onSelect} />;
    if(state.activeView==="evidence")
      return <EvidenceView profile={activeProfile} onNavigate={onNavigate} onOpenControl={onOpenControl} />;
    if(state.activeView==="policies")
      return <PoliciesView profile={activeProfile} updateProfile={updateProfile} onNavigate={onNavigate} onOpenControl={onOpenControl} />;
    if(state.activeView==="ssp")
      return <SSPView profile={activeProfile} updateProfile={updateProfile} onNavigate={onNavigate} onOpenControl={onOpenControl} />;
    if(state.activeView==="projmgmt")
      return <ProjectManagementView profile={activeProfile} onNavigate={onNavigate} fullBridge={buildPmBridge(state)} />;
  }
  return <CommandCenter state={state} setState={setState} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
