// attach family + weight + level
CONTROLS.forEach(c=>{
  const fam = c.id.split(".")[1]; // e.g. "1" -> AC by position
  const famIndex = { "1":"AC","2":"AT","3":"AU","4":"CM","5":"IA","6":"IR","7":"MA","8":"MP","9":"PS","10":"PE","11":"RA","12":"CA","13":"SC","14":"SI" };
  c.family = famIndex[fam];
  c.weight = weightOf(c.id);
  c.partial = PARTIAL.has(c.id);
  c.level = L1.has(c.id) ? "L1" : "L2";
  c.pid = c.family + ".L2-" + c.id; // CMMC practice id
});

const ACME_POLICY_CONTENT = {"Acme, Inc- Acess Control Policy.docx":"<p>Acme, inc.</p><p>Access Control</p><p>Document Control</p><p>Document Number</p><p>Revision</p><p>Function</p><p>Information Security</p><p>Policy Owner (Title)</p><p>Chief Information Security Officer</p><h4>1. Statement of Scope and Purpose</h4><p>Acme, inc. Information Security establishes policy by restricting access to information systems, data, dissemination of data and system resources to ensure the Confidentiality, Integrity and Availability Acme, inc. enterprise assets.</p><h4>2. Applicable Documents</h4><p>Higher Governing Documents:</p><p>DoDI 8500.01 - Cybersecurity</p><p>NIST Special Publication 800.53r4 - Risk Management Framework</p><p>NIST Special Publication 800.171r2 - Protecting CUI in Nonfederal Systems &amp; Organizations</p><p>Acme, inc. Documents:</p><p>Acme, inc. Enterprise System Security Plan</p><p>Acme, inc. Technical Standards</p><h4>3. Requirements</h4><p>To whom does this policy apply? Place an \"x\" by all that apply:</p><p>Geographic area: ☒ Global   ☐ U.S. Only   ☐ Country Specific: _______________________</p><p>Covered persons: ☒ Employees   ☒ Board members   ☒ Non-permanent staff*   ☐ Other: _______________________</p><p>*Non-permanent staff means agency/vendor staff, consultants, contractors, and any other temporary staff</p><h4>1  Purpose</h4><p>The purpose of the Access Control policy is to centrally define the policies and standards on how organization systems must be configured and personnel utilizing the Information System (IS) must adhere to.</p><p>This document should be viewed as a living document subject to change as necessary due to, but not limited to, changes in the organization’s contractual or legal obligations. As such, it is the responsibility of organization personnel to maintain awareness of the organization’s defined policies and standards.</p><h4>2  Scope</h4><p>This policy applies to all Acme, inc. employees and contractors (referred to as personnel throughout the document) accessing or managing Acme, inc.’s IS.</p><h4>3  Executive Leadership Commitment</h4><p>Acme, inc. Executive Leadership is committed to following this policy and the supporting procedures that the Information Security (InfoSec) Department has established, maintains, and updates on an annual basis.</p><h4>4  Roles and Responsibilities</h4><h4>4.1  InfoSec Department</h4><p>Develop and maintain cybersecurity policies and procedures to adhere with regulatory requirements of IS assets managed by Acme, inc..</p><p>Advise the Information Technology (IT) department on configuring the IS roles based on the principle of least privilege and separation of duties.</p><p>Reviews and approves/disapproves any third-party provider IS related products or services prior to contract as they relate to being able to meet or exceed existing regulatory requirements imposed on Acme, inc..</p><h4>4.2  IT Department (Information Owners)</h4><p>Develop and maintain information technology policies, standards and procedures to adhere with regulatory requirements and industry best practices of IS assets managed by Acme, inc..</p><p>Configures the IS roles based on the principle of least privilege and separation of duties.</p><p>Develop and maintain IS assets as defined by organizationally defined procedures.</p><p>Assigns the appropriate IS roles based on the assigned responsibilities of a specific user.</p><p>Advises InfoSec on the approves/disapproves any third-party provider IS related products or services prior to contract as they relate to being able to meet or exceed existing regulatory requirements imposed on Acme, inc..</p><h4>4.3  HR Department</h4><p>Maintain a list of authorized staff with access to Acme, inc. IS resources and assets.</p><p>Provide the InfoSec and IT Departments with the appropriate onboarding information of new staff to IS resources and assets.</p><p>Confirm and notify the InfoSec and IT Departments of staff role changes and/or terminations as applicable.</p><h4>4.4  Department Managers (Data Owners)</h4><p>Approve and submit staff role changes and/or terminations as applicable to either HR or the IT Department.</p><h4>5  Compliance</h4><p>For Acme, inc. personnel, failure to comply with this policy may result in disciplinary actions up to and including dismissal from Acme, inc. employment and removal from access to the IS services and components. Acme, inc. personnel are subject to any applicable legal requirements for compliance violations of this policy. Depending on the legal requirements, and the nature of the violation, penalties could include fines and/or criminal charges.</p><h4>6  Policy Methodology</h4><p>6.1  Limit system access to authorized users, processes acting on behalf of authorized users, and devices (including other systems).</p><p>Limit system access to the types of transactions and functions that authorized users are permitted to execute.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.1 Basic Security Requirements</h4><h4>3.1.2 Basic Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-2 Account Management</p><p>AC-3 Access Enforcement</p><p>AC-17 Remote Access</p><p>The IT Department shall perform the following within the IS:</p><p>Standard users shall be configured with no administrative security or configuration related privileges.</p><p>All administrative users shall also be assigned a standard user account for non-administrative duties.</p><p>Create and maintain a roles and responsibilities matrix outlining assigned responsibilities of each role.</p><p>Configure the appropriate access controls, group policies, and/or mobile device management policies required to limit access to the IS to only authorized personnel, service accounts, and devices.</p><p>Assign/Revise/Remove personnel access based on approved requests from HR and Department Managers.</p><h4>6.2  Control the flow of CUI in accordance with approved authorizations.</h4><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.3 Derived Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-4 Information Flow Enforcement</p><p>The Department Managers (Data Owners) perform the following within the IS:</p><p>Document and maintain the approved accessors of data through the IS</p><p>Supply the Information Owner with approved accessors as changes occur</p><p>Perform and document quarterly audits of approved accessors</p><p>The IT Department (Information Owners) perform the following within the IS:</p><p>Administer control of approved accessors’ ability to access the IS</p><p>Document and maintain the approved authorizations for the control and flow of data through the IS within a data flow diagram.</p><p>Data flow diagram must include sources and destinations for CUI within the IS and between interconnected systems.</p><p>6.3  Separate the duties of individuals to reduce the risk of malevolent activity without collusion.</p><p>Employ the principle of least privilege, including for specific security functions and privileged accounts.</p><p>Use non-privileged accounts or roles when accessing nonsecurity functions.</p><p>Prevent non-privileged users from executing privileged functions and capture the execution of such functions in audit logs.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.4 Derived Security Requirements</h4><p>3.1.5</p><p>3.1.6</p><p>3.1.7</p><p>NIST SP 800-53 rev. 4</p><p>AC-5 Separation of Duties</p><p>AC-6 Least Privilege (LP)</p><p>AC-6(1) LP – Access to Security Functions</p><p>AC-6(2) LP – Non-Privileged Access for Nonsecurity Functions</p><p>AC-6(5) LP – Privileged Accounts</p><p>AC-6(9) LP – Log Use of Privileged Functions</p><p>AC-6(10) LP - Prohibit Non-Privileged Users from Executing Privileged Functions</p><p>The IT Department shall perform the following within the IS:</p><p>Document and maintain a roles and responsibilities matrix outlining duties for individuals assigned to specific roles.</p><p>Configure the IS to require separate authorizations from authorized individuals in the event additional temporary privileges are requested by personnel to carry out assigned duties.</p><p>Configure IS user roles with only enough access and to perform assigned duties for both privileged and non-privileged accounts.</p><p>Require all users to sign off on the Acceptable Use Policy (AUP) that outlines acceptable privileged and non-privileged user requirements prior to IS access.</p><p>Configure the IS to capture non-privileged user attempts at performing security or privileged functions in log data sent to the SIEM.</p><p>User Definitions:</p><p>Non-Privileged users are individuals who do not possess appropriate authorizations to perform privileged functions. These users are granted only the permissions required to perform their basic job functions, and are explicitly restricted from executing any privileged activities such as:</p><p>Establishing system accounts</p><p>Performing system integrity checks</p><p>Conducting patching operations</p><p>Administering cryptographic key management</p><p>Circumventing intrusion detection or malicious code protection mechanisms</p><p>Privileged users are individuals who are granted elevated permission because their job functions require them. These permissions allow them to perform privileged functions, which typically involve control, monitoring, or administration of systems and their security measures. Some of the Roles of a Privileged user include:</p><p>Global Administrator</p><p>Other custom roles with elevated access rights</p><p>These roles enable users to:</p><p>Establish and manage system accounts</p><p>Configure access authorizations (permissions, privileges)</p><p>Set intrusion detection parameters</p><p>Administer cryptographic key management</p><p>Modify system configuration settings</p><p>Some of the non-security functions that Acme, inc. considers essential are defined as, but not limited to:</p><p>Sending email, starting a program, browsing the internet, placing a VoIP call, creating a folder or document, printing a file, etc.</p><p>Some of the privileged functions that Acme, inc. considers essential are defined as, but not limited to:</p><p>Install software, stop/start services, create user accounts, restart servers, create/modify a DHCP scope, manage the VDI, modify network rules, etc.</p><h4>6.4  Limit unsuccessful logon attempts.</h4><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.8 Derived Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-7 Unsuccessful Logon Attempts</p><p>The IT Department shall configure the IS to limit the number of consecutive unsuccessful login attempts within a set time based on parameters outlined in the Acme, inc. Technical Standards documentation.</p><h4>6.5  Provide privacy and security notices consistent with applicable CUI rules.</h4><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.9 Derived Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-8 System Use Notification</p><p>The IT Department shall configure the IS where capable of presenting the appropriate privacy and security notices prior to establishing an initial session based on parameters outlined in the Acme, inc. Technical Standards documentation.</p><p>6.6  Use session lock with pattern-hiding displays to prevent access and viewing of data after a period of inactivity.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.10 Derived Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-11 Session Lock (SL)</p><p>AC-11(1) SL – Pattern-Hiding Displays</p><p>The IT Department shall configure the IS to perform a session lock to hide previously displayed data after a set time based on parameters outline in the Acme, inc. Technical Standards documentation.</p><h4>6.7  Terminate (automatically) a user session after a defined condition.</h4><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.11 Derived Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-12 Session Termination</p><p>The IT Department shall configure the IS to perform a session termination automatically after a set time based on parameters outlined in the Acme, inc. Technical Standards documentation if not initiated by an end user previously.</p><h4>6.8  Monitor and control remote access sessions.</h4><p>Employ cryptographic mechanisms to protect the confidentiality of remote access sessions.</p><p>Route remote access via managed access control points.</p><p>Authorize remote execution of privileged commands and remote access to security-relevant information.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.12 Derived Security Requirements</h4><p>3.1.13</p><p>3.1.14</p><p>3.1.15</p><p>NIST SP 800-53 rev. 4</p><p>AC-17(1) Remote Access (RA) – Automated Monitoring/Control</p><p>AC-17(2) RA – Protection of Confidentiality/Integrity Using Encryption</p><p>AC-17(3) RA – Manage Access Control Points</p><p>AC-17(4) RA – Privileged Commands/Access</p><p>Remote access to the Acme, inc. network is strictly controlled and permitted only through the PaloAlto Global Connect VPN. All remote users are issued company-managed laptops preconfigured with the VPN client. The VPN connection is required to establish any remote session with the internal network, including systems that store, or process Controlled Unclassified Information (CUI).</p><p>Upon initiating a remote session, users must authenticate using multifactor authentication (MFA) and accept a privacy notice indicating that their connection is subject to monitoring. The VPN enforces encrypted tunnels using FIPS-validated cryptographic mechanisms to ensure confidentiality and integrity of data in transit.</p><p>The system employs automated monitoring and logging of remote access sessions, capturing details such as user identity, session timestamps, and access resources. These logs are reviewed regularly by the security team to detect unauthorized access attempts or policy violations.</p><p>The IT Department shall configure all remote access to the IS with the following parameters:</p><p>Retain logs of all remote access attempts within the SIEM</p><p>Where configurable ensure that settings are turned on to require FIPS-validated cryptography is in use during remote access sessions.</p><p>Configure the appropriate conditional access policies to only allow for authorized access by personnel with permissions to remotely access the IS through specified and managed channels.</p><p>Assign permissions for personnel to security relevant systems/services or to perform remote execution of privileged commands based on duties outlined in the roles and responsibilities matrix and/or upon approved authorizations.</p><h4>6.9  Authorize wireless access prior to allowing such connections.</h4><p>Protect wireless access using authentication and encryption.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.16 Derived Security Requirements</h4><p>3.1.17</p><p>NIST SP 800-53 rev. 4</p><p>AC-18 Wireless Access (WA)</p><p>AC-18(1) WA – Authentication and Encryption</p><p>If wireless access points are utilized within the IS boundary the IT Department shall configure the wireless access points with the following parameters:</p><p>Log all wireless access points in an inventory and document locations within the network diagram.</p><p>Configure wireless access points to require authorized authentication prior to connection to the wireless network.</p><p>Validate and configure wireless access points to utilize FIPS validated cryptography.</p><h4>6.10  Control connection of mobile devices.</h4><p>Encrypt CUI on mobile devices and mobile computing platforms.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.18 Derived Security Requirements</h4><p>3.1.19</p><p>NIST SP 800-53 rev. 4</p><p>AC-19 Access Control for Mobile Devices (ACMD)</p><p>AC-19(5) ACMD – Full Device/Container-Based Encryption</p><p>If mobile devices are utilized to access data within the IS, the IT Department shall configure mobile devices through a mobile device manager (MDM) with the following parameters:</p><p>Maintain an inventory of mobile devices with access to IS resources.</p><p>Configured the MDM to only allow access from authorized devices with encryption enabled.</p><h4>6.11  Verify and control/limit connections to and use of external systems.</h4><p>Limit use of portable storage devices on external systems.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.20 Derived Security Requirements</h4><p>3.1.21</p><p>NIST SP 800-53 rev. 4</p><p>AC-20 Use of External System (UES)</p><p>AC-20(1) UES – Limits on Authorized Use</p><p>AC-20(2) UES – Portable Storage Devices</p><p>Acme, inc.’s formal policy for governing the use of portable storage devices containing Controlled Unclassified Information (CUI) on external systems requires that:</p><p>Only organization-issued portable storage devices (e.g., USB drives, external hard disks) may be used for storing or transferring CUI.</p><p>Each device authorized for external use is identified and documented, including serial number, assigned custodian, and intended use case.</p><p>Devices are checked out from the site’s FSO for specific business functions and returned upon completion of use.</p><p>The site’s local inventory system shall track the issuance, usage and return of each device to ensure accountability and traceability.</p><p>Acme, inc. shall actively enforce the defined limitations on portable storage device usage through a combination of administrative and technical controls.</p><h4>6.12  Control CUI posted or processed on publicly accessible systems.</h4><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><h4>3.1.22 Derived Security Requirements</h4><p>NIST SP 800-53 rev. 4</p><p>AC-22 Publicly Accessible Content</p><p>The Department Managers over sales, public relations and marketing shall create and follow procedures to review submitted postings on Acme, inc. managed public forums prior to posting of information. Procedures shall include a process for removal of posting during reviews if sensitive information is discovered.</p><p>Acme, inc. shall manage CUI from Publicly Accessible Content, in addition to the established polices published by the Acme, inc. Corporate Communications Department in the following manner.</p><p>Step 1 – Authorization:</p><p>Maintain a list of personnel authorized to post content.</p><p>Require role-based training on CUI handling and public information controls.</p><p>Step 2 – Content Creation:</p><p>Authors must classify content using internal guidelines.</p><p>Drafts must be submitted to the designated reviewer before publication.</p><p>Step 3 – Review and Approval:</p><p>Reviewers assess content for CUI and other sensitive data.</p><p>Approved content is logged with metadata (author, reviewer, date, platform).</p><p>Step 4 – Publication:</p><p>Only approved content is posted using secure credentials.</p><p>Audit logs capture posting activity for accountability.</p><p>Step 5 – Monitoring and Review:</p><p>Conduct quarterly audits of public content.</p><p>Use automated tools where it is feasible to scan for CUI indicators.</p><p>Step 6 – Incident Response:</p><p>If CUI is found on a public system:</p><p>Remove the content immediately.</p><p>Notify the Information Security Office.</p><p>Document the incident and initiate corrective actions.</p><p>Breaches of this Policy</p><p>Compliance with this Policy is mandatory in all cases. Any breaches of this Policy will result in disciplinary action, up to and including termination of employment. Employees must report any actual or suspected breach of this Policy. Reports can be made via your supervisor, Human Resources, an Ethics Champion, or the Acme, inc. Hotline at +1 (833) 996-3948 (toll-free in the U.S. only; international rates apply outside the U.S.)</p>","CMMC_ACCESS_CONTROL_POLICY.docx":"<p>420370276225290090900</p><p>Last Update Date</p><p>07-02-2024</p><p>Owner</p><p>Edward Francis</p><p>Status</p><p>In Review</p><p>CMMC Access Control Policy</p><p>Approval History</p><p>Version</p><p>Approved By</p><p>Approved On</p><p>1.0</p><p>David Wyatt</p><p>04-20-2023</p><p>Purpose</p><p>The purpose of this policy is to define the correct use and management of logical access controls for the protection of agency information systems and assets. To effectuate the mission and purposes of LP3, the company shall establish a coordinated plan and program for Information Technology (IT) implemented and maintained through policies, standards, and procedures (PSPs), as authorized by LP3.</p><p>The LP3 Information Security policy serves to be consistent with best practices associated with organizational Information Security management. It is the intention of this policy to establish an access control capability throughout LP3 and its business units to help the organization implement security best practices with regard to access control. This policy reflects the higher-level managers’ objectives for our processes.</p><p>Scope</p><p>The Access Management Policy applies to the following.</p><p>• All Employees of LP3</p><p>• All Contractors of LP3</p><p>• All vendors / third-party/visitors who temporarily access Company's equipment</p><p>• All information systems of the LP3</p><p>• All data repositories of the LP3</p><p>Background</p><p>The Access Management Policy defines the rules put in place to help prevent unauthorized, illegal, or malicious access to information systems and resources owned by LP3. This policy also defines the rules for how access is requested, granted, and revoked to the information systems for an employee or third-party contractor.  This policy also defines the rules in place for an individual to request elevated/privileged access to systems and resources for temporary use. This policy also defines at a high level the type of accounts used however the actual implementation of these accounts is delegated to the individual systems themselves. The policy also outlines strong authentication mechanisms such as passwords and multifactor authentication, but those are discussed in detail in the Password Policy document.</p><p>Enforcement</p><p>The Access Management Policy is enforced by all system administrators and department heads to all company administered information systems and any exceptions must be reviewed and approved by the information security team. All and any breaches of this policy will be subject to the company Acceptable Use Policy, Code of Conduct, and Sanctions Policy. Any violations of Acceptable Use Policy on a personal device may be subject to a range of disciplinary action, ranging from an administrative warning to civil or criminal litigation, depending on the severity of the violation.</p><p>Policy</p><p>LP3 implements the principle of \"least privilege\" and \"role-based access control\" within logical access control mechanisms so that only authorized users can access company systems and data.</p><p>Types of account</p><p>All information systems must have one or many of these account types.</p><p>• Administrator accounts (with Superuser access)</p><p>• User accounts based on role in the information system</p><p>• System accounts</p><p>• Privileged accounts</p><p>General User access management</p><p>• All employees, contractors, and third-party users are assigned a unique identifier.</p><p>• All information systems of the Company must require at least a User Id and a password to log in and gain access to the system.</p><p>• Each information system must enforce the password and login restrictions based on the password policy.</p><p>• Each information system should define, document, and implement its unique access management covering all aspects of the user lifecycle from onboarding to offboarding.</p><p>• Each information system must follow a minimum privilege policy, ensuring that the access rights to the users are minimum and required to perform the tasks expected of the users.</p><p>New user onboarding</p><p>• All new employees of the Company must onboard using an onboarding checklist or an onboarding process.</p><p>• Employees or users must request access to department-level information systems to the appropriate department manager, who must approve access to department-level information systems.</p><p>• Special privilege requests must be submitted based on the new employee's ROLE to the appropriate information system owners.</p><p>• Elevated access must have at least two levels of approval and must be strictly reviewed and only provided if users' day-to-day tasks require it.</p><p>User offboarding</p><p>• A responsible party must revoke terminated employee's access by the end of the day of the employee's last working day in the Company.</p><p>• The responsible party could be the terminated employee's direct manager, Company's HR department, or the IT department. The responsible party must ensure the review and revocation of access of the terminated employee.</p><p>• System owners must access review orphan accounts or access terminated employees.</p><p>Elevated access management</p><p>• Elevated access must be formally requested from the IT team or from the information system owners whose access is required.</p><p>• Elevated access must be time-bound and have a date and time at which the access will expire and be revoked.</p><p>• Elevated access can also be granted for an incident and it is the responsibility of the owner to revoke that access.</p><p>• Elevated access should follow the principle of minimum privilege.</p><p>• Elevated access must be reviewed at least every six months to ensure that the users with elevated access are still in the roles requiring elevated permissions.</p><p>Access management for third parties/contractors</p><p>• All-access requests for contractors and partners should follow the same process as mentioned in the sections above.</p><p>• Access for third-party workers, contractors, and partners must be enabled for the approved period during which their partnership agreement or contract is valid.</p><p>• Remote access to third-party contractors must be provided only after a formal request.</p><p>Password and other authentication mechanisms</p><p>• All information systems must enforce a login with password requirements as defined in the password policy document.</p><p>• Information systems with highly classified data should enforce multi-factor authentication (MFA) as defined in the password policy document.</p><p>Audit and Log</p><p>• All user access to information systems must be logged.</p><p>• At the minimum, logs must contain the unique Id that can be linked backed to a system user.</p><p>• All logs must be stored for at least 60 days.</p><p>• All logs must automatically alert for malicious access attempts or be reviewed manually every 30 days</p><p>AC.L1-3.1.1: Limit information system access to authorized users and processes that act on behalf of authorized users or devices (including other information systems).</p><p>Account Creation</p><p>All account creations will be submitted by the requesting Department Manager (DM) to the IT Support email address for completion using the &lt;Account Request Ticketing System&gt;. All required fields must be completed before the account can be created. If a non-standard account is needed, the request will be submitted to the IT Support email address for review &lt;at example@email.com&gt;. The IT Support team will determine if the request will be approved/denied and submitted to the IT team for creation or if it will need to be reviewed/approved by the Configuration Control Board (CCB).</p><p>The following relates to standard accounts:</p><p>• DM will be responsible for stating start and end dates of access for each system account. End dates will be set on accounts within Active Directory if applicable.</p><p>• Systems administrators and members of the IT Support team shall respond and act accordingly to requests within a timely fashion, offering at least a (???)-hour turnaround for account creation.</p><p>• During such tenure, the temporary account holder shall do work when accessing, using, or relying on LP3’s infrastructure within the bounds of all policies and procedures. Any policies or procedures listed and cited within the Facilities Security Plan (FSP) of %ORG% or its subsidiaries shall be considered governing above and beyond this procedure.</p><p>• Should a definite end date and time apply to any employee, contractor, or other account holder, the IT Support team shall create the account with the proper disablement times as stated by the DM or Human Resources (HR).</p><p>LP3 defines the types of information system accounts to support organizational missions/business functions such as:</p><p>• Standard</p><p>• Full Time Employee</p><p>• Part Time Employee</p><p>• Temporary Account</p><p>• Contractor</p><p>• Consultant</p><p>• Non-Standard</p><p>• Administrative Account</p><p>• System/Application Account</p><p>• Specialized Account</p><p>Work From Home (WFH)</p><p>Personnel that either Work from Home or use personal devices to access &lt;company IS resources&gt; shall:</p><p>• Inform their DM and the IT Administrator (ITA) of the use of such a device</p><p>• Apply all company required software (anti-virus, malware scanner, remote interface software, VPN, etc.)</p><p>• Ensure the physical security of the device(s)</p><p>• Maintain appropriate secure handling of the device (lock screens, inactivity time-out, etc.)</p><p>In times of emergencies (i.e. natural disaster, public health crisis, or other unforeseen events), LP3 may quickly grant remote access privileges to additional personnel.</p><p>Whenever possible, these personnel are to be provided with company information assets and devices to continue their work remotely. All of these devices shall be inventoried and cataloged by the IT Department. The catalog of devices will be kept within company information systems and reviewed when the devices are returned or when personnel leaves the employ of the company.</p><p>Personnel that are granted special access rights in this manner are to be made aware of the risks and threats that this form of remote access entails. Additional training and/or instruction will be required to brief these personnel of the required practice changes from working internally on company hardware to remote access on company or personal devices.</p><p>Bring Your Own Device (BYOD)</p><p>In cases that there is an immediate need for expanded remote access and personal device usage the ITA and DMs will coordinate to establish the access required for essential personnel to continue working uninterrupted, or as close to uninterrupted as possible.</p><p>Personnel that are granted special access rights in this manner are to be made aware of the risks and threats that this form of access entails. Additional training and/or instruction will be required to brief these personnel of the required practice changes from working internally on company hardware to access from personal devices. These personnel will be required to use a password for remote access that is different from the one they use on the company information system. This can lower the risk of credentials being stolen, compromised, or lost.</p><p>Employees who participate in the BYOD policy must:</p><p>• Not store or access Personally Identifiable Information (PII) or CUI belonging to LP3 or its clients on personally owned devices without prior authorization from the ITA or the CISO.</p><p>• Destroy, remove or return all data (electronic or otherwise) belonging to LP3 once their relationship with the company ends, or once they are no longer the owner or primary user of the device (i.e. the sale or transfer of the device to another person).</p><p>• Remove or return all software application licenses belonging to LP3 when the device is no longer used for company business.</p><p>• Notify the ITA of any theft or loss of the personal device containing data or software application licenses belonging to the company.</p><p>Employees are expected to refrain from using their personal computing devices to conduct %ORG%-related business communications while operating a vehicle. This prohibition includes using a personal computing device to place or receive calls or voicemail messages, read or respond to e-mails, text messages, or instant messages, surf the Internet, or for any other purpose while operating a vehicle. Employees who are charged with traffic violations resulting from the use of their personal device while driving will be solely responsible for all liabilities resulting from such actions.</p><p>Technical support from LP3 for personally owned computing devices is limited to the following:</p><p>• Troubleshooting network connection issues while on the company network.</p><p>• Troubleshooting and installation of approved LP3 software resources.</p><p>• Configuration of email clients for connection to the company email system.</p><p>• Configuration of the SSL VPN client to allow access to company resources (with prior approval).</p><p>• Providing software application support if the software is required to perform job functions as determined by the Information Technology department.</p><p>As a user of LP3’s resources under the BYOD policy the user holds the following responsibilities:</p><p>• For registering networked personal devices in &lt;the network registration database&gt; in order to maintain access to the network.</p><p>• For all traffic originating from networked personal devices, regardless of whether the user personally generates the traffic.</p><p>• For abiding by all applicable laws set forth by Federal, State and Local Governments.</p><p>• For protecting the user’s own privacy, and for not violating the privacy of any other person.</p><p>• For keeping networked personal devices up to date with current security patches.</p><p>• For using anti-virus software and ensuring that such software is at the most current release.</p><p>• For protecting any and all sensitive data for which the user has access to.</p><p>At no time does LP3 accept liability for the maintenance, backup, or loss of data on a personal device. It is the responsibility of the equipment owner to backup all software and data to other appropriate backup storage systems before requesting assistance from IT.</p><p>Any violations of Acceptable Use Policy on a personal device may be subject to a range of disciplinary action, ranging from an administrative warning to civil or criminal litigation, depending on the severity of the violation.</p><p>AC.L1-3.1.2: Limit information system access to the types of transactions and functions that authorized users are permitted to execute</p><p>Assign Network Access</p><p>To maintain the accountability and integrity of LP3 information systems, it is best practice to maintain account rights and permissions in a method of “most restrictive” meaning that account permissions shall be configured to provide the user access to only those resources required, and no excessive permissions shall be granted.</p><p>User roles will be established based on type of work performed, as well as contracts, proposals, and projects that require specific LP3 information systems resources.  Each role defined, and its required rights will be documented and audited to ensure proper availability, accountability, and integrity of the role.</p><p>LP3 information systems resources shall be assigned in groups based on role access, and user accounts will be added or removed from these groups based on role classification as required.  Each resource may be assigned multiple groups with varying levels of rights based on such roles to allow for “most restrictive” access to those that may not need elevated rights.</p><p>In the event of a role or account change, the DM requesting the change must submit a LP3 New User Request for or send an email to the &lt;IT Support email address&gt;. IT Support will then notify the &lt;IT Authority/DM&gt; which will review and supply an approval or denial of request. If approved, the IT Support team will complete the request in a timely manner. Quarterly audits of all user access and roles will be performed to ensure proper access and procedural controls.</p><p>Remote Access for Work from Home Personnel</p><p>LP3 understands that some personnel will be required to work from home or another remote location, outside of the company’s local information system. For these personnel, LP3 has deployed a remote access option for qualifying personnel. Remote access authorization and credentials are to be controlled by the CISO and/or &lt;IT Authority/DM&gt;.</p><p>Remote Access personnel shall comply with all standing company policy for data handling, transfer, and access.</p><p>AC.L2-3.1.3: Control the flow of CUI in accordance with approved authorizations</p><p>Information Flow Procedure:</p><p>LP3’s information system enforces approved authorizations for controlling the flow of information within the system and between interconnected systems. This is controlled by rule sets or established configuration settings in boundary protection devices (e.g., gateways, routers, etc.) maintained by the IT Support Team.</p><p>Any requests for changes to the rule sets must be submitted to the IT Support Team via a ticket and approved by the ITA. The IT Support Team will be responsible for maintaining documentation detailing all current rules and changes.</p><p>Requirements for Work from Home Personnel</p><p>In the event that CUI data must be accessed by any personnel that is working from home or other remote location, the hardware and connection settings are to be setup by the ITA to be identical with all related aspects of LP3’s Information System (VPN, encrypted device, etc.).</p><p>This type of access is only granted in rare circumstances, when absolutely no other method of access to CUI data is possible and the access to the CUI is essential to the personnel carrying out their duties.</p><p>AC.L2-3.1.4: Separate the duties of individuals to reduce the risk of malevolent activity without collusion</p><p>LP3:</p><p>• Separates Normal User Rights from Admin Access Rights.</p><p>• Documents separation of duties of individuals.</p><p>• Defines information system access authorizations to support separation of duties.</p><p>Privileged Accounts/Functions</p><p>If elevated privileges are required/desired, such rights may be assigned to a user or a second user account with elevated rights may be created to provide the proper availability and accountability of user actions as they pertain to LP3’s information system resources. The best practice method is to create a second user account with elevated privileges so that proper access logging is achieved.  However, in some cases, the elevated rights may be assigned directly to the user’s regular account.</p><p>Procedures to Request or Revoke Elevated Privileges</p><p>All requests for elevated privileges must be submitted via an Account Creation/Modification ticket by the DM, and approved by the IT Administrator, who will document the time and date of the approval.</p><p>When elevated access is no longer needed, such assignments will be revoked within &lt;###&gt; hours, and the IT Administrator will likewise document the time and date such privileges have been removed.</p><p>AC.L2-3.1.5: Employ the principle of least privilege, including for specific security functions and privileged accounts</p><p>Least Privilege</p><p>LP3 employs the principle of least privilege, allowing only authorized accesses for users (or processes acting on behalf of users) which are necessary to accomplish assigned tasks in accordance with organizational missions and business functions.</p><p>Authorize access to security functions</p><p>LP3 explicitly authorizes access to security devices like firewalls, routers, switches, network administration, servers, databases, and applications.</p><p>Privileged Accounts</p><p>LP3 restricts privileged accounts on the Information System to administrators.</p><p>Privileged Access - Third Party Providers</p><p>LP3 issues account authorizations on a permanent or temporary basis only to qualified and vetted third parties when needed to perform administrative functions on certain components. Agreements with third party providers will ensure the external entity may access  LP3’s systems only to perform authorized duties on the system with authorized, qualified and vetted personnel. This access may be granted on a Permanent or Temporary basis, depending on the nature of the work being performed.</p><p>1. Permanent Access: Based on a signed contractual agreement between LP3 and the third party provider. A LP3 system administrator will grant authorized personnel access only to those resources necessary to perform their job under a signed agreement. Upon contract completion, termination, or breach of Acceptable Use Policy, all access granted to authorized personnel should be immediately revoked.</p><p>2. Temporary Access: Based on a signed contractual agreement between LP3 and the third party provider. A LP3 system administrator will grant authorized personnel access only to those resources necessary to perform their job under a signed agreement for a specific and limited time. Upon contract completion, expiration, termination, or breach of Acceptable Use Policy, all access granted to authorized personnel should be immediately revoked.</p><p>Auditing use of privileged functions</p><p>The information system audits the execution of privileged functions.</p><p>&lt;Describe IT Audit functions of privileged accounts within your organization’s environment.&gt; explicitly authorizes access to security devices like firewalls, routers, switches, network administration, servers, databases, and applications.</p><p>Privileged Accounts</p><p>LP3 restricts privileged accounts on the Information System to administrators.</p><p>Privileged Access - Third Party Providers</p><p>LP3 issues account authorizations on a permanent or temporary basis only to qualified and vetted third parties when needed to perform administrative functions on certain components. Agreements with third party providers will ensure the external entity may access %ORG%’s systems only to perform authorized duties on the system with authorized, qualified and vetted personnel. This access may be granted on a Permanent or Temporary basis, depending on the nature of the work being performed.</p><p>1. Permanent Access: Based on a signed contractual agreement between LP3 and the third party provider. A LP3 system administrator will grant authorized personnel access only to those resources necessary to perform their job under a signed agreement. Upon contract completion, termination, or breach of Acceptable Use Policy, all access granted to authorized personnel should be immediately revoked.</p><p>2. Temporary Access: Based on a signed contractual agreement between LP3 and the third party provider. A LP3 system administrator will grant authorized personnel access only to those resources necessary to perform their job under a signed agreement for a specific and limited time. Upon contract completion, expiration, termination, or breach of Acceptable Use Policy, all access granted to authorized personnel should be immediately revoked.</p><p>Auditing use of privileged functions</p><p>The information system audits the execution of privileged functions.</p><p>&lt;Describe IT Audit functions of privileged accounts within your organization’s environment.&gt; employs the principle of least privilege, allowing only authorized accesses for users (or processes acting on behalf of users) which are necessary to accomplish assigned tasks in accordance with organizational missions and business functions.</p><p>Authorize access to security functions</p><p>LP3 explicitly authorizes access to security devices like firewalls, routers, switches, network administration, servers, databases, and applications.</p><p>Privileged Accounts</p><p>LP3 restricts privileged accounts on the Information System to administrators.</p><p>Privileged Access - Third Party Providers</p><p>LP3 issues account authorizations on a permanent or temporary basis only to qualified and vetted third parties when needed to perform administrative functions on certain components. Agreements with third party providers will ensure the external entity may access  LP3’s systems only to perform authorized duties on the system with authorized, qualified and vetted personnel. This access may be granted on a Permanent or Temporary basis, depending on the nature of the work being performed.</p><p>1. Permanent Access: Based on a signed contractual agreement between LP3 and the third party provider. A LP3 system administrator will grant authorized personnel access only to those resources necessary to perform their job under a signed agreement. Upon contract completion, termination, or breach of Acceptable Use Policy, all access granted to authorized personnel should be immediately revoked.</p><p>2. Temporary Access: Based on a signed contractual agreement between LP3 and the third party provider. A LP3 system administrator will grant authorized personnel access only to those resources necessary to perform their job under a signed agreement for a specific and limited time. Upon contract completion, expiration, termination, or breach of Acceptable Use Policy, all access granted to authorized personnel should be immediately revoked.</p><p>Auditing use of privileged functions</p><p>The information system audits the execution of privileged functions.</p><p>&lt;Describe IT Audit functions of privileged accounts within your organization’s environment.&gt;</p><p>AC.L2-3.1.6: Use non-privileged accounts or roles when accessing non-security functions</p><p>Non-privileged access for non-security functions</p><p>LP3 requires that users of information system accounts, or roles, with admin access to use non-privileged accounts or roles, when accessing non-security functions.</p><p>AC.L2-3.1.7: Prevent non-privileged users from executing privileged functions and capture the execution of such functions in audit logs</p><p>Prohibit non-privileged users from executing privileged functions</p><p>The LP3 information system is configured to prevents non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures. The use of policies and procedures are deployed to enforce and ensure compliance.</p><p>AC.L2-3.1.8: Limit unsuccessful logon attempts</p><p>Unsuccessful Logon Attempts</p><p>The information system:</p><p>• Enforces a limit of &lt;i.e. 3&gt; consecutive invalid logon attempts by a user within &lt;i.e. 3 Minutes&gt; Minutes; and</p><p>• Automatically locks the account for &lt;i.e. 15 Minutes&gt;.</p><p>Requirements for Work from Home Personnel</p><p>The remote access setup from personnel that are working from home, or another location outside of LP3’s office(s), requires more stringent monitoring of unsuccessful logins, due to the nature of remote access and the risks and threats that this method involves. The information system will lock an account after &lt;2&gt; failed logon attempts from an external IP address.</p><p>AC.L2-3.1.9: Provide privacy and security notices consistent with applicable CUI rules</p><p>System Use Notification</p><p>Information systems within the organization that contain or transmit CUI should display the following message to users who attempt to access it:</p><h4>WARNING:</h4><p>You are accessing an Information System (IS) that is provided by LP3 for US Government (USG) and LP3 work purposes only. By using this IS (which includes any device attached to this IS), you consent to the following conditions:</p><p>-LP3 may intercept and monitor communications on this IS for purposes including, but not limited to: penetration testing, COMSEC monitoring, network operations and defense, and personnel misconduct (PM).</p><p>-At any time, LP3 may inspect data stored on this IS.</p><p>-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG and company-authorized purposes.</p><p>-This IS includes security measures (e.g., authentication and access controls) to protect USG and LP3 interests--not for your personal benefit or privacy.</p><p>-Notwithstanding the above, using this IS does not constitute consent to PM searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.</p><p>This message must be written to provide privacy and security notices consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance. Furthermore, the message should state that:</p><p>• Users are accessing a LP3 information system;</p><p>• Use of the information system indicates consent to monitoring and recording;</p><p>• Unauthorized use of the information system is prohibited and subject to criminal and civil penalties;</p><p>• Information system usage may be monitored, recorded, and subject to audit; and</p><p>• Retains the notification message or banner on the screen until users acknowledge the usage conditions and take explicit actions to log on to or further access the information system.</p><p>For publicly accessible systems, the following System Use Information banner should be displayed to the user when they attempt to log in to the system from outside of the organization’s network:</p><h4>WARNING:</h4><p>This software and system (“System”) are the property of LP3. The System is for authorized use only by individuals and entities authorized by LP3. By using this system, you acknowledge, notice, and agree to comply with LP3 Terms and Conditions of Use, as may be updated from time to time.</p><p>You are accessing a System which may allow access to a U.S. government information system.  This System and its usage may be monitored or recorded, and is subject to audit, except where prohibited.  Unauthorized use of the System is prohibited and may be subject to criminal and civil penalties.  By accessing this System, you agree to the conditions stated in this Warning and grant consent to permitted monitoring and recording of all activities which take place on this System.</p><p>Similar to the previous message, this System Use Information banner should incorporate the following:</p><p>• The banner is written and approved by legal. The Extranet user is authorized by using an issued username and password and must accept the banner before granting further access;</p><p>• Display references, if any, to monitoring, recording, or auditing that are consistent with privacy accommodations for such systems that generally prohibit those activities; and</p><p>• Includes a description of the authorized uses of the system.</p><p>Requirements for Work from Home Personnel</p><p>Personnel that are working from home or other location outside of LP3 Information System that require access to sensitive data are required to use a Virtual Desktop Interface (VDI) to access such data. This ensures that the environment where the access is taking place is more secure and can be monitored with all appropriate messaging provided to the user as required by company policies.</p><p>AC.L2-3.1.10: Use session lock with pattern-hiding displays to prevent access and viewing of data after a period of inactivity</p><p>Session Lock</p><p>The information system prevents further access to the system by initiating a session lock after &lt;i.e. 15 Minutes&gt; of inactivity. If the user has CUI on the screen and leaves the desk unattended the user must voluntarily initiate a session locked screen prior to departing workstation and retain the session lock until the user re-establishes access using established identification and authentication procedures.</p><p>AC.L2-3.1.11: Automatically terminate user sessions after a defined condition</p><p>Session Termination</p><p>The information system automatically terminates a user session after logout and will display an explicit logout message to users indicating the reliable termination of authenticated communications session.</p><p>AC.L2-3.1.12: Monitor and control remote access sessions</p><p>Remote Access</p><p>LP3:</p><p>• Establishes and documents usage restrictions, configuration/connection requirements, and implementation guidance for each type of remote access allowed; and</p><p>• Authorizes remote access to the information system prior to allowing such connections.</p><p>Automated monitoring/control</p><p>The information system monitors existing firewalls and controls for personnel having remote access &lt;using monitoring/control system&gt;. The logging server generates an auditable record and archives remote access activity.</p><p>AC.L2-3.1.13: Employ cryptographic mechanisms to protect the confidentiality of remote access sessions</p><p>Protection of confidentiality/integrity using encryption</p><p>The information system implements cryptographic mechanisms to protect the confidentiality and integrity of remote access sessions.</p><p>AC.L2-3.1.14: Route remote access via managed access control points</p><p>Managed access control points</p><p>The information system routes all remote accesses through &lt;###&gt; VPN Gateways. Near-future implementations will consolidate from &lt;###&gt; to &lt;###&gt; VPN managed network access control points.</p><p>&lt;Enter information about their VPN Gateway setup to justify meeting control&gt;</p><p>AC.L2-3.1.15: Authorize remote execution of privileged commands and remote access to security-relevant information.</p><p>Privileged commands/access</p><p>LP3:</p><p>• Authorizes the execution of privileged commands and access to security-relevant information via remote access with the user’s same privileged access as on the internal LP3 network.</p><p>The IT Helpdesk Request System documents the rationale for such access.</p><p>AC.L2-3.1.16: Authorize wireless access prior to allowing such connections</p><p>Wireless Access</p><p>LP3:</p><p>• Establishes and documents usage restrictions, configuration/connection requirements, and implementation guidance for wireless access; and</p><p>Authorizes wireless access to the information system prior to allowing such connections.</p><p>AC.L2-3.1.17: Protect wireless access using authentication and encryption</p><p>Authentication and encryption</p><p>The information system protects wireless access to the system using authentication of Active Directory user accounts and encryption.</p><p>AC.L2-3.1.18: Control connection of mobile devices</p><p>Access Control for Mobile Devices</p><p>LP3:</p><p>• Establishes usage restrictions, configuration requirements, connection requirements, and implementation guidance for organization-controlled mobile devices; and</p><p>• Authorizes the connection of mobile devices to organizational information systems.</p><p>Requirements for Work from Home Personnel</p><p>All personnel that are working from home or other locations outside of the LP3 Information System shall only use devices approved by the ITA that meet the security and hardware requirements for LP3’s information system.</p><p>AC.L2-3.1.19: Encrypt CUI on mobile devices and mobile computing platforms</p><p>Full device/container-based encryption</p><p>LP3 employs full-device encryption to protect the confidentiality and integrity of CUI on laptops, smart phones, and tablets. LP3 will use a cloud-based service or Storage as a Service (SaaS) to encrypt the hard drives on all laptops regardless of CUI. For more Information reference Mobile Device Policy.</p><p>Requirements for WFH Personnel</p><p>All personnel that are working from home or other locations outside of LP3’s Information System shall only use devices approved by the ITA that meet the security and hardware requirements for the company’s information system.</p><p>In unique cases that require the rapid deployment of personnel to work from home, such as a natural disaster, public health crisis, or other unforeseen circumstances, the ability to use personal devices on the company information system is at the discretion of the ITA and/or Senior Management.</p><p>AC.L1-3.1.20: Verify and control/limit connections to and use of external information systems</p><p>Use of external Information Systems</p><p>LP3 establishes terms and conditions by having all employees sign the Employee's agreement for the protection of proprietary information and the assignment of invention for Exempt or non-Exempt Personnel form, or Third Party Providers signing NDA agreements or other types of agreements consistent with any trust relationships established with other organizations owning, operating, and/or maintaining external information systems, allowing authorized individuals to:</p><h4>1. Access the information system from external information systems; and</h4><p>2. Process, store, or transmit organization-controlled information using external information systems.</p><p>AC.L2-3.1.21: Limit use of portable storage devices on external systems</p><p>LP3 restricts the use of organization-controlled portable storage devices by authorized individuals on external information systems. Personal and unauthorized storage devices shall not be connected or used with any of LP3’s Information Systems. Reference Removable Media Usage Policy</p><p>AC.L1-3.1.22: Control information posted or processed on publicly accessible information systems</p><p>Publicly Accessible Content</p><p>LP3:</p><p>• Designates individuals authorized to post information onto a publicly accessible information system;</p><p>• Trains authorized individuals to ensure that publicly accessible information does not contain nonpublic information;</p><p>• Reviews the proposed content of information prior to posting onto the publicly accessible information system to ensure that nonpublic information is not included; and</p><p>• Reviews the content on the publicly accessible information system for nonpublic information. LP3’s public website content is managed by Marketing.</p><p>• Marketing is instructed to ensure that no sensitive or confidential information is published. A review process is in place that includes a product specialist, Export compliance, and legal before IT is allowed to publish the content.</p><p>• The Public Website should be periodically reviewed, in case information is published that might be sensitive or confidential. In such an event, Marketing will review the material, and if they find it necessary, shall take down the information or remove the publication from circulation.</p><p>• Depending on the kind of information that was taken down or removed follow up actions in coordination with LP3’s executive management might be taken.</p><p>Requirements for Work from Home Personnel</p><p>While working from home on non-company devices, users shall ensure that all personal accounts (Facebook, Twitter, Outlook, Office, etc.) do not have access to drives that contain CUI. As a rule, CUI should never leave company property. However, LP3 understands, and may apply appropriate security controls, to allow personnel with an absolute need for CUI data to have access to it when no other method can be safely conducted.</p><p>Roles and Responsibilities</p><p>LP3’s Chief Information Security Officer (CISO) is &lt;????&gt;. Responsibilities are listed in Appendix A.</p><p>LP3’s Information Technology Manager (ITM) is &lt;????&gt;. Responsibilities are listed in Appendix A.</p><p>LP3’s Department Managers (DM) are &lt;????&gt;. Responsibilities are listed in Appendix A.</p>","ACCESS_MANAGEMENT_POLICY.docx":"<p>Access Management Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>12/5/22</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of the Access Management Policy is to define the level of access each user has to company-owned or managed information systems and the data in LP3's systems. This policy document describes the general access rules for all company-owned or company-managed information systems.</p><p>Scope</p><p>The Access Management Policy applies to the following.</p><p>• All Employees of LP3</p><p>• All Contractors of LP3</p><p>• All vendors / third-party/visitors who temporarily access Company's equipment</p><p>• All information systems of the LP3</p><p>• All data repositories of the LP3</p><p>Background</p><p>The Access Management Policy defines the rules put in place to help prevent unauthorized, illegal, or malicious access to information systems and resources owned by LP3. This policy also defines the rules for how access is requested, granted, and revoked to the information systems for an employee or third-party contractor.  This policy also defines the rules in place for an individual to request elevated/privileged access to systems and resources for temporary use. This policy also defines at a high level the type of accounts used however the actual implementation of these accounts is delegated to the individual systems themselves. The policy also outlines strong authentication mechanisms such as passwords and multifactor authentication, but those are discussed in detail in the Password Policy document.</p><p>Policy</p><p>The Company shall implement the principle of \"least privilege\" and \"role-based access control\" within logical access control mechanisms so that only authorized users can access company systems and data.</p><p>Types of account</p><p>All information systems must have one or many of these account types.</p><p>• Administrator accounts (with Superuser access)</p><p>• User accounts based on role in the information system</p><p>• System accounts</p><p>• Privileged accounts</p><p>General User access management</p><p>• All employees, contractors, and third-party users are assigned a unique identifier.</p><p>• All information systems of the Company must require at least a User Id and a password to log in and gain access to the system.</p><p>• Each information system must enforce the password and login restrictions based on the password policy.</p><p>• Each information system should define, document, and implement its unique access management covering all aspects of the user lifecycle from onboarding to offboarding.</p><p>• Each information system must follow a minimum privilege policy, ensuring that the access rights to the users are minimum and required to perform the tasks expected of the users.</p><p>New user onboarding</p><p>• All new employees of the Company must onboard using an onboarding checklist or an onboarding process.</p><p>• Employees or users must request access to department-level information systems to the appropriate department manager, who must approve access to department-level information systems.</p><p>• Special privilege requests must be submitted based on the new employee's ROLE to the appropriate information system owners.</p><p>• Elevated access must have at least two levels of approval and must be strictly reviewed and only provided if users' day-to-day tasks require it.</p><p>User offboarding</p><p>• A responsible party must revoke terminated employee's access by the end of the day of the employee's last working day in the Company.</p><p>• The responsible party could be the terminated employee's direct manager, Company's HR department, or the IT department. The responsible party must ensure the review and revocation of access of the terminated employee.</p><p>• System owners must access review orphan accounts or access terminated employees.</p><p>Elevated access management</p><p>• Elevated access must be formally requested from the IT team or from the information system owners whose access is required.</p><p>• Elevated access must be time-bound and have a date and time at which the access will expire and be revoked.</p><p>• Elevated access can also be granted for an incident and it is the responsibility of the owner to revoke that access.</p><p>• Elevated access should follow the principle of minimum privilege.</p><p>• Elevated access must be reviewed at least every six months to ensure that the users with elevated access are still in the roles requiring elevated permissions.</p><p>Access management for third parties/contractors</p><p>• All-access requests for contractors and partners should follow the same process as mentioned in the sections above.</p><p>• Access for third-party workers, contractors, and partners must be enabled for the approved period during which their partnership agreement or contract is valid.</p><p>• Remote access to third-party contractors must be provided only after a formal request.</p><p>Password and other authentication mechanisms</p><p>• All information systems must enforce a login with password requirements as defined in the password policy document.</p><p>• Information systems with highly classified data should enforce multi-factor authentication (MFA) as defined in the password policy document.</p><p>Audit and Log</p><p>• All user access to information systems must be logged.</p><p>• At the minimum, logs must contain the unique Id that can be linked backed to a system user.</p><p>• All logs must be stored for at least 60 days.</p><p>• All logs must automatically alert for malicious access attempts or be reviewed manually every 30 days</p><p>Enforcement</p><p>The Access Management Policy is enforced by all system administrators and department heads to all company administered information systems and any exceptions must be reviewed and approved by the information security team. All and any breaches of this policy will be subject to the company Code of Conduct and Sanctions Policy.</p>","ACME_Inc_Acceptable_Use_Policy.docx":"<h4>0.  DOCUMENT CONTROL</h4><h4>DOCUMENT NUMBER:</h4><p>1600-D00034087</p><h4>REVISION:</h4><p>A</p><h4>FUNCTION:</h4><p>Security</p><h4>POLICY OWNER</h4><p>Director, Security</p><h4>1.  STATEMENT OF SCOPE AND PURPOSE</h4><p>ACME, Inc. Information Systems (as defined in the “Scope” section below) shall be used in an ethical and legal manner and in compliance with all relevant ACME, Inc. policies and procedures, maintaining security and minimizing compromise as outlined in this Acceptable Use Policy (“Policy”). The purpose of this Policy is to provide standards, requirements, and expectations for access to, and use of, ACME, Inc. Information Systems.</p><h4>2.  APPLICABLE DOCUMENTS</h4><p>N/A</p><h4>3.  DEFINITIONS</h4><p>Definitions of Key Terms/Words:</p><p>a. Information: Includes digital data in any form, including, but not limited to text, email, images, audio and video.</p><p>b. Non-Business Use: Use of ACME, Inc. Information Systems other than to perform assigned job responsibilities, provide contracted services to ACME, Inc., or otherwise conduct or advance ACME, Inc.’s business activities and interests.</p><p>c. User or Users: All individuals covered by this Policy who have access to or use ACME, Inc. Information Systems.</p><p>d. Capitalized terms: Terms used in this Policy, but not defined in this Policy, shall have the meaning given to them in the ACME, Inc. Corporate Policy Framework.</p><p>e. ACME, Inc. Technology: ACME, Inc.-owned endpoint devices and assets, including but not limited to: computers (workstations/laptops), mobile devices (e.g., phones, tablets), storage devices, and peripherals.</p><h4>4.  REQUIREMENTS</h4><p>To whom does this policy apply? Place an “x” by all that apply:</p><p>Geographic area:</p><p>☒ Global   ☐ U.S. Only   ☐ Country Specific: _______________________________</p><p>Covered persons:</p><p>☒ Employees   ☒ Board members   ☒ Non-permanent staff*   ☐ Other: _______________________________</p><p>*Non-permanent staff means agency/vendor staff, consultants, contractors, and any other temporary staff</p><h4>5.  RESPONSIBILITY</h4><p>Security, Information Security (InfoSec), Information Technology (IT) and Human Resources (HR) Departments are responsible for administering this Policy. Updates to this Policy will be made available in electronic form and published on the Corporate Governance Intranet site. Changes will be noted in the Record of Changes (at the end of this Policy) to highlight the pertinent changes from the previous version of this Policy.</p><h4>6.  POLICY</h4><p>Details and Definition of Policy</p><h4>6.1.  Overview</h4><p>This Policy provides standards, requirements, and expectations for access to, and use of, ACME, Inc. Information Systems. ACME, Inc. Information Systems are primarily intended for ACME, Inc. business purposes and benefit (except for the limited Non-Business Uses as described below).</p><h4>6.2.  Applicability</h4><p>This Policy applies to all ACME, Inc. businesses and employees; all vendors, contractors, customers, suppliers, temporary staff, contractors, consultants and any other third parties, including their personnel, authorized to access or accessing ACME, Inc. Information Systems (individually, a “User” and collectively “Users”); all unclassified information technology resources and communication systems owned, leased or made available by ACME, Inc. which are used to store, process or transmit information; and all use of such resources and systems when accessed using an employee’s, vendor’s, contractor’s and consultant’s own resources, including, but not limited to:</p><p>Email systems and accounts.</p><p>Internet and intranet access.</p><p>Telephones, including wired and mobile phones, smartphones, tablets or other handheld computing devices and pagers.</p><p>Voicemail systems.</p><p>Local area networks and virtual private networks.</p><p>Printers, photocopiers, and scanners; Fax machines, e-fax systems, and modems.</p><p>External data storage devices (e.g., USB [thumb] drives, CDs, DVDs, tape, disk).</p><p>All other associated computer, network and communication systems, hardware, software, storage devices and other devices (all technology in this entire paragraph collectively referred to in this Policy as “ACME, Inc. Information Systems”).</p><p>Any waivers to this Policy must be authorized in writing by the ACME, Inc. Chief Information Security Officer (CISO). The ACME, Inc. CISO will work with all necessary functions to gain approval on any waiver requests.</p><h4>6.3.  Procedures</h4><p>ACME, Inc. Information Systems are primarily intended for ACME, Inc. business purposes and benefit (except for the limited Non-Business Uses as described below).</p><p>Use of ACME, Inc. Information Systems is restricted to protect ACME, Inc., its employees, its contractors, proprietary information of ACME, Inc. and its customers and suppliers, and to ensure that users may access and use information on the ACME, Inc. Information Systems efficiently and in a lawful and ethical manner.</p><p>All activity on and use of ACME, Inc. Information Systems are subject to monitoring at any time and without notice. Accordingly, all users of ACME, Inc. Information Systems are hereby advised that they shall have no expectation of privacy when using ACME, Inc. Information Systems.</p><p>ACME, Inc. Information Systems shall be used in an ethical and legal manner and in compliance with all relevant ACME, Inc. policies, procedures, standards, and Code of Business Conduct, maintaining security and minimizing compromise. Additional requirements and terms and conditions of this Policy are:</p><p>Exceptions to this Policy must be requested through the Policy Exception Form and approved by the ACME, Inc. Director of Security and maintained by ACME, Inc. CISO.</p><p>Any violation of this Policy may result in disciplinary action up to and including termination. Security incidents and violations relating to this Policy and/or ACME, Inc.’s Information Systems must be reported immediately; and</p><p>Access to or use of ACME, Inc. Information Systems by Users shall signify their understanding of, and agreement to, the terms and conditions of this Policy. For Users with a U.S. Government-issued security clearance, violations of this Policy may constitute a reportable event to the U.S. Government and may result in suspension or loss of security clearance.</p><h4>6.3.1.  Acceptable Business and Non-Business Use of ACME, Inc. Information Systems</h4><p>ACME, Inc. Information Systems are provided to conduct ACME, Inc. business for ACME, Inc.’s benefit. Except for the limited Non-Business Use authorized in this Section A below, Users are authorized to use ACME, Inc. Information Systems (and information stored on them) only for purposes of conducting ACME, Inc. business in the course of performing their job responsibilities or their contract with ACME, Inc., as the case may be. Users must not use personal devices to conduct ACME, Inc. business.</p><p>(ACME, Inc. may authorize and approve the use of personal cell phones provided that and only after ACME, Inc. authorized applications and tools are installed on the personal cell phone)</p><p>Users are responsible for all information they create, receive, retrieve, store, or send using ACME, Inc. Information Systems. Users must comply with this policy and all other relevant ACME, Inc. policies, procedures and standards when using ACME, Inc. Information Systems, including ACME, Inc.’s Code of Business Conduct, HR policies and policies relating to information technology, information security, confidentiality, intellectual property, social media, and privacy that have been provided or otherwise made available to the User. Users must use the ACME, Inc. Information Systems in an ethical and lawful manner.</p><p>Users who are authorized to access and use ACME, Inc.’s email and Internet to perform their job responsibilities are permitted to access and use those systems minimally and occasionally for NonBusiness Use during business hours, as long as it does not interfere with ACME, Inc. duties and job responsibilities. Non-Business use shall not involve excessive use of bandwidth (for example, transmitting/receiving excessively large audio or video files or other attachments that may disrupt server performance) or otherwise interfere with the efficient functioning of ACME, Inc. Information Systems. Non-Business Use of ACME, Inc. Information Systems shall be minimal and occasional. In addition, Non-Business Use of any ACME, Inc. Information System shall not interfere with the business activities of other Users who are on working time. Non-Business Use must not result in any billing or direct cost to ACME, Inc..</p><h4>6.3.2.  Monitoring, Disclosure &amp; Deletion of Information: Information not Private</h4><p>ACME, Inc. Information Systems and the information stored, processed, or transmitted on them are, and remain at all times, ACME, Inc.’s property, regardless of whether that information is created, stored, or received for business use or Non-Business Use. Consequently, all information stored on, or transmitted by, ACME, Inc. Information Systems is not private to the User and there shall be no expectation thereof. Users shall not use ACME, Inc. Information Systems to store or transmit information about personal matters intended to be private, such as communications with a personal physician or a personal attorney.</p><p>Users shall have no expectation of privacy in any information transmitted over, or stored on, the ACME, Inc. Information Systems network. Any or all uses of ACME, Inc. Information Systems and all information stored on ACME, Inc. Information Systems may be, at ACME, Inc.’s sole discretion, periodically accessed, reviewed, monitored in real time (intercepted), recorded, copied, audited, deleted, and/or inspected as ACME, Inc. deems appropriate.</p><p>ACME, Inc. may, in its sole discretion, bypass any passwords or access codes to inspect, investigate, locate, access, read or search any information received, transmitted, or stored on ACME, Inc. Information Systems (within appropriate security guidelines).</p><p>Additionally, ACME, Inc. may, in its sole discretion, access information, including email and voicemail, of (a) an employee who leaves ACME, Inc. permanently or who is unavailable for an extended period to ensure that ACME, Inc. business continues without interruption, and (b) a vendor, contractor, supplier, customer, or consultant whose contract with ACME, Inc. has expired or been terminated.</p><p>ACME, Inc. may, in its discretion, delete any information related to any business or Non-Business Use, including photographs, videos and music, stored on ACME, Inc. Information Systems. Users who want to avoid permanent deletion of information pertaining to Non-Business Use, shall not store it on ACME, Inc. Information Systems. Even when a User deletes information, ACME, Inc. may be able to recreate, retrieve or review the deleted information. All deleted information is subject to inspection by ACME, Inc. in its sole discretion.</p><p>ACME, Inc. may, in its sole discretion, disclose any information stored on the Information Systems to authorized ACME, Inc. personnel or any third party, including law enforcement authorities or any other government agency.</p><p>ACME, Inc. not exercising its rights with respect to certain information in no way modifies or waives ACME, Inc.’s right to access, review and monitor, delete or disclose other information. ACME, Inc.’s rights may be altered or modified only in writing signed by the Securit
