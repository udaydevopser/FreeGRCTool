ckup procedures</p><p>• Restoration procedures</p><p>• Testing / Validation steps</p><p>• Recovery time and recovery point objectives for each asset</p><p>• Escalation structure during the disaster period</p><p>• Communication steps</p><p>• The recovery steps must be in the following order of priority.</p><p>• Critical operations during disaster</p><p>• Minimal operations after recovery</p><p>• Full recovery and normal operations</p><p>Reviewing and maintaining the plan</p><p>• The contingency plan must be reviewed at least annually.</p><p>• The contingency plan must be reviewed and approved by company management.</p><p>• After each review, the necessary changes must be applied to the plan</p><p>• Key personnel must be notified of the changes</p><p>• Distributing copies of the contingency plan to key contingency personnel.</p><p>• Asset custodians and data owners are required to be trained in their contingency roles and responsibilities for systems.</p><p>Testing the plan</p><p>• A contingency plan must be tested once per year</p><p>• The contingency plan test results are documented</p><p>• Asset owners and custodians of the information systems are responsible for the testing of the plan.</p><p>• Asset owners and custodians of the information systems are responsible for making any corrective actions in the plan as a result of the test exercises.</p><p>Enforcement</p><p>Business Continuity policy is enforced by the Senior Management team along with information security team and in some cases the business operation teams such as IT support teams.</p>","CLEAN_DESK_POLICY.docx":"<p>420370276225290090900</p><p>Clean Desk Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>12/05/22</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of the Clean Desk Policy is to increase awareness amongst employees of LP3 about protecting sensitive and classified information by keeping their work areas clean of sensitive documents and information.</p><p>Scope</p><p>The clean desk policy applies to following</p><p>• All Employees of LP3.</p><p>• All Contractors of LP3.</p><p>• All vendors/third-party/visitors who temporarily access LP3's equipment.</p><p>Background</p><p>Information theft and accidental exposure of sensitive information can lead to large scale data breaches and other attacks on the information systems. By keeping their work areas and desks clean all employees can contribute towards protecting confidential information of the company.</p><p>Policy</p><p>Laptops, computers, and other electronics</p><p>• All laptops and computers are locked when not used, and the user is not at their desk.</p><p>• Physical devices such as laptops will not be left unattended in public places or places not adequately protected by the company, such as user conferences and client meetings.</p><p>• Laptops to be kept in a drawer or secured by a locking cable when left unattended for more extended periods in the office, such as overnight</p><p>Work area (personal and shared)</p><p>• Personal work areas must be free of all confidential papers, reports, and printouts.</p><p>• No sticky notes or written down papers for passwords</p><p>• Remove sensitive printouts from the printer as soon as the print job completes</p><p>• Drawers and other restricted file cabinets must always be locked, and the keys must not be left in plain sight</p><p>• Employees must not leave sensitive notes or drawings on the whiteboard</p><p>• Employees must ensure that sensitive information is disposed of in reliable shredders and not left in disposal/trash baskets</p><p>Public events, common areas</p><p>• Whiteboards containing Restricted or Controlled data must be thoroughly erased.</p><p>• Printouts containing Restricted or Controlled information should be immediately removed from standard printers</p><p>• File cabinets containing Restricted or Controlled information must be kept closed and locked when not in use or when left unattended.</p><p>• Storage devices with sensitive information must be secured in a locked drawer.</p><p>Enforcement</p><p>Clean desk policy is enforced by information security team. Information security team conducts regular audits of work areas by conducting walk throughs or with the help of building and floor admins. Noncompliance and violations to this policy will be dealt according to the sanctions policy</p>","AVAILABILITY_POLICY - still needs SLA data.docx":"<p>420370276225290090900</p><p>Availability Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>12/05/22</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of this policy is to outline the measures put in place by LP3 to ensure the Availability of the LP3's information systems to its customers as per the defined SLAs.</p><p>Scope</p><p>This policy applies to following</p><p>• Information systems</p><p>• Support personnel</p><p>• Third-party vendors</p><p>Background</p><p>LP3 intends to reduce the duration of unexpected or unplanned downtime of information systems for its customer. This policy outlines the procedures put in place to ensure that the systems are available as per the promised SLAs to the customers. This policy also outlines the measures put in place for increased system redundancy and improved failover mechanisms to fulfill customers' availability SLAs</p><p>Policy</p><p>Defining Availability</p><p>All Information systems have defined, documented, and agreed upon SLAs for availability for all customers.</p><p>TODO PROVIDE AVAILABILITY SLAs FOR YOUR PRODUCT OFFERINGS OR A REFERENCE TO YOUR CUSTOMER SLA Document</p><p>Unique availability SLAs for customers are documented and agreed upon formally in writing.</p><p>TODO PROVIDE AVAILABILITY SLAs FOR SPECIFIC CUSTOMERS AND OFFERINGS</p><p>Ensuring Availability</p><p>• All critical systems must have redundant databases.</p><p>• Tests of backup data must be conducted twice per year.</p><p>• Tests of configurations must be conducted twice per year.</p><p>• Backups and associated media must be maintained for a minimum of thirty (30) days and retained for at least one (1) year or per legal and regulatory requirements.</p><p>• Load balancers must be used in all production systems to increase redundancy and failover protection.</p><p>• The network infrastructure that supports critical resources must have system-level redundancy (including but not limited to a secondary power supply, backup disk array, and secondary computing system).</p><p>• Critical core components (including but not limited to routers, switches, and other devices linked to Service Level Agreements (SLAs)) must have an actively maintained spare. SLAs require parts replacement within twenty-four (24) hours.</p><p>• Servers that support critical resources have redundant power supplies and network interface cards.</p><p>Communication of failures</p><p>• System and network failures must be monitored in real-time and immediately reported to designated IT support personnel.</p><p>• Customers must be notified of scheduled outages (e.g., system maintenance) that require periods of downtime. This notification must specify the date and time of the system maintenance, expected duration, and anticipated system or service resumption time.</p><p>• Company or critical external personnel must be notified about their duties during the downtimes.</p><p>• Specific responsibilities and tasks for responding to emergencies and resuming business operations must be included in the outage plan.</p><p>Enforcement</p><p>Availability policy is enforced by the Customer Success team along with the Operation Manage. Exceptions are allowed upon formal approval from the customer success team</p>"};

// Build Acme, Inc. fully compliant, with the sample-company policies linked to their controls.
function buildAcmeSample(id){
  const co = "Acme, Inc.";
  const controls = {}, domains = {}, policies = {};
  CONTROLS.forEach(c=>{
    const m = FAM_META[c.family];
    const objectives = {};
    c.objectives.forEach(ob=>{ objectives[ob.label] = { status:"complete", note: OBJ_PREFILL[c.id+"|"+ob.label] || objLanguage(c, ob, m, co), attachments:[] }; });
    controls[c.id] = { status:"complete", note:"", attachments:[], objectives };
  });
  FAMILIES.forEach(f=>{ domains[f.code] = { ssp: domainLanguage(f, FAM_META[f.code], co) }; });
  ACME_POLICY_LIST.forEach(pl=>{
    const mp = ACME_POLICY_MAP[pl.file] || { controls:[] };
    policies[pl.file] = { name: pl.name, controls: mp.controls.filter(cid=>controls[cid]), content: ACME_POLICY_CONTENT[pl.file]||"", contentUpdated: Date.now() };
  });
  // Attach one placeholder evidence artifact (JPG under sample/evidence/) to every control, so the
  // Evidence tab and SSP show auditable evidence for all 110 controls.
  ACME_EVIDENCE.forEach(ev=>{ if(controls[ev.id]) controls[ev.id].attachments.push({ id:uid(), name:ev.name, href: encodeURI("sample/evidence/"+ev.file), type:"image/jpeg", size:0, added:Date.now(), linked:true }); });
  const p = { id: id || uid(), name:co, slug:"acme-inc", createdAt:Date.now(),
    controls, domains, ssp:{ ...ACME_SSP }, scope:{ notes: ACME_SCOPE, diagrams:[] },
    customPolicies: ACME_POLICY_LIST.map(pl=>({ file:pl.file, name:pl.name, ext:pl.ext })), policies };
  p.history = [ metricsOf(p) ];
  return p;
}


/* ---------- scoring ---------- */
function sprsScore(profile){
  let deduction = 0;
  CONTROLS.forEach(c=>{
    const st = profile.controls[c.id];
    if(!st || st.status !== "complete") deduction += c.weight;
  });
  return 110 - deduction;
}
function progressPct(profile){
  const done = CONTROLS.filter(c=>profile.controls[c.id]?.status==="complete").length;
  return Math.round(done/CONTROLS.length*100);
}
function familyStats(profile, famCode){
  const cs = CONTROLS.filter(c=>c.family===famCode);
  const done = cs.filter(c=>profile.controls[c.id]?.status==="complete").length;
  const prog = cs.filter(c=>profile.controls[c.id]?.status==="inprogress").length;
  return { total:cs.length, done, prog };
}

/* A control (requirement) is compliant only when all its assessment objectives are complete;
   a family/domain is compliant when all its controls are. Sub-control status is the source of
   truth — recompute + store the control status whenever objectives change so scoring stays right. */
function deriveStatus(control, cstate){
  const ss = control.objectives.map(ob => (cstate.objectives[ob.label] && cstate.objectives[ob.label].status) || "incomplete");
  if(ss.length && ss.every(s=>s==="complete")) return "complete";
  if(ss.some(s=>s==="complete" || s==="inprogress")) return "inprogress";
  return "incomplete";
}
function recomputeControl(prof, controlId){
  const control = CONTROLS.find(c=>c.id===controlId); const cs = prof.controls[controlId];
  if(control && cs) cs.status = deriveStatus(control, cs);
}
// The "domain policy" for a sub-control = policies linked to its control, or to any control in the same family.
function domainPolicies(profile, control){
  return allPolicies(profile).filter(p=>{
    const ctrls = policyMeta(profile, p).controls;
    return ctrls.includes(control.id) || ctrls.some(cid => { const c = CONTROLS.find(x=>x.id===cid); return c && c.family===control.family; });
  });
}

/* ---------- date + snapshot history ---------- */
const pad2 = (n)=> String(n).padStart(2,"0");
const todayISO = ()=>{ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDay = (iso)=>{ if(!iso) return "—"; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
const daysAgo = (iso)=>{ const [y,m,d]=iso.split("-").map(Number); return Math.round((Date.parse(todayISO())-Date.parse(`${y}-${pad2(m)}-${pad2(d)}`))/86400000); };

// current compliance metrics for a profile
function metricsOf(profile){
  const done = CONTROLS.filter(c=>profile.controls[c.id].status==="complete").length;
  const prog = CONTROLS.filter(c=>profile.controls[c.id].status==="inprogress").length;
  const fam = {}; FAMILIES.forEach(f=>{ fam[f.code] = familyStats(profile, f.code).done; });
  return { date:todayISO(), ts:Date.now(), score:sprsScore(profile), pct:progressPct(profile), done, prog, inc:CONTROLS.length-done-prog, fam };
}
// pick the snapshot closest to `days` ago: newest entry at least that old, else earliest recorded
function pickBaseline(history, days){
  if(!history || !history.length) return null;
  const cutoff = Date.now() - days*86400000;
  const older = history.filter(h=>h.ts<=cutoff);
  if(older.length) return older[older.length-1];
  return history[0];
}
// record/refresh today's snapshot (one entry per calendar day)
function recordSnapshot(profile){
  const hist = Array.isArray(profile.history) ? [...profile.history] : [];
  const m = metricsOf(profile);
  if(hist.length && hist[hist.length-1].date===m.date) hist[hist.length-1] = m;
  else hist.push(m);
  return hist;
}

/* ================= Rich text editor ================= */
function RichText({ value, onChange, placeholder, minHeight }){
  const ref = useRef(null);
  // Sync DOM from `value` on mount and when it changes externally (e.g. .docx import),
  // but never while the user is typing in this editor (would reset the caret).
  useEffect(()=>{ const el=ref.current; if(el && document.activeElement!==el && el.innerHTML!==(value||"")) el.innerHTML = value||""; }, [value]);
  const exec = (cmd, val)=>{ document.execCommand(cmd, false, val); ref.current.focus(); onChange(ref.current.innerHTML); };
  const link = ()=>{ const url = prompt("Link URL:"); if(url) exec("createLink", url); };
  const Btn = ({cmd,arg,label,title,fn}) => (
    <button type="button" title={title} onMouseDown={e=>e.preventDefault()}
      onClick={()=> fn ? fn() : exec(cmd,arg)}
      className="px-2 py-1 text-xs rounded hover:bg-slate-700 text-slate-300 font-semibold">{label}</button>
  );
  return (
    <div className="rounded-lg border border-slate-700 bg-slate-900/60 overflow-hidden">
      <div className="flex items-center gap-0.5 px-1.5 py-1 border-b border-slate-700 bg-slate-800/50">
        <Btn cmd="bold" label="B" title="Bold" />
        <Btn cmd="italic" label="I" title="Italic" />
        <Btn cmd="underline" label="U" title="Underline" />
        <span className="w-px h-4 bg-slate-700 mx-1" />
        <Btn cmd="insertUnorderedList" label="• List" title="Bullet list" />
        <Btn cmd="insertOrderedList" label="1. List" title="Numbered list" />
        <Btn fn={link} label="Link" title="Insert link" />
      </div>
      <div ref={ref} contentEditable suppressContentEditableWarning data-placeholder={placeholder}
        onInput={e=>onChange(e.currentTarget.innerHTML)} style={{minHeight:(minHeight||80)+"px"}}
        className="richtext overflow-y-auto px-3 py-2 text-sm text-slate-200 leading-relaxed focus:bg-slate-900" />
    </div>
  );
}

/* ================= Attachments ================= */
function Attachments({ items, onAdd, onRemove }){
  const inputRef = useRef(null);
  const handle = (files)=>{
    Array.from(files).forEach(file=>{
      if(file.size > 4*1024*1024){
        if(!confirm(`"${file.name}" is ${fmtBytes(file.size)}. Files are stored in-browser and large files may exceed storage limits. Attach anyway?`)) return;
      }
      const reader = new FileReader();
      reader.onload = ()=> onAdd({ id:uid(), name:file.name, size:file.size, type:file.type, dataUrl:reader.result, added:Date.now() });
      reader.readAsDataURL(file);
    });
  };
  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-2">
        {items.map(a=>(
          <div key={a.id} className="group flex items-center gap-2 pl-2.5 pr-1.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs">
            <span className="text-indigo-300">{a.href ? "🔗" : "📎"}</span>
            <a href={a.href || a.dataUrl} {...(a.href ? { target:"_blank", rel:"noopener noreferrer" } : { download:a.name })} className="text-slate-200 hover:text-indigo-300 font-medium max-w-[180px] truncate" title={a.name}>{a.name}</a>
            {a.size ? <span className="text-slate-500">{fmtBytes(a.size)}</span> : (a.href ? <span className="text-slate-600 text-[10px]">linked</span> : null)}
            <button onClick={()=>onRemove(a.id)} className="text-slate-500 hover:text-rose-400 px-1" title="Remove">✕</button>
          </div>
        ))}
      </div>
      <input ref={inputRef} type="file" multiple className="hidden" onChange={e=>{ handle(e.target.files); e.target.value=""; }} />
      <button onClick={()=>inputRef.current.click()}
        className="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-300 hover:text-indigo-200 border border-indigo-500/40 hover:border-indigo-400 rounded-lg px-3 py-1.5 bg-indigo-500/10">
        <span>＋</span> Upload artifact
      </button>
    </div>
  );
}

function StatusPill({ status, onChange, size="md", linkPolicies, onLinkPolicy }){
  const [open,setOpen] = useState(false);
  const s = STATUS[status] || STATUS.incomplete;
  const pad = size==="sm" ? "px-2.5 py-1 text-[11px]" : "px-3 py-1.5 text-xs";
  const showLink = Array.isArray(linkPolicies) && !!onLinkPolicy;
  return (
    <div className="relative inline-block">
      <button onClick={()=>setOpen(o=>!o)} onBlur={()=>setTimeout(()=>setOpen(false),150)}
        className={`inline-flex items-center gap-2 rounded-lg border font-semibold ${pad} ${s.chip}`}>
        <span className={`w-2 h-2 rounded-full ${s.dot}`} />{s.label}<span className="opacity-60 text-[10px]">▼</span>
      </button>
      {open && (
        <div className={`absolute z-30 mt-1 right-0 ${showLink?"w-60":"w-40"} rounded-lg border border-slate-700 bg-slate-800 shadow-xl py-1 fade-in`}>
          {STATUS_ORDER.map(k=>(
            <button key={k} onMouseDown={e=>e.preventDefault()} onClick={()=>{ onChange(k); setOpen(false); }}
              className="w-full flex items-center gap-2 px-3 py-2 text-xs text-slate-200 hover:bg-slate-700">
              <span className={`w-2 h-2 rounded-full ${STATUS[k].dot}`} />{STATUS[k].label}
              {k===status && <span className="ml-auto text-indigo-400">✓</span>}
            </button>
          ))}
          {showLink && (<>
            <div className="border-t border-slate-700 my-1" />
            <div className="px-3 py-1 text-[10px] uppercase tracking-wide text-slate-500 font-semibold">🔗 Link to policy</div>
            {linkPolicies.length ? linkPolicies.map(p=>(
              <button key={p.file} onMouseDown={e=>e.preventDefault()} onClick={()=>{ onLinkPolicy(p.file); setOpen(false); }}
                className="w-full flex items-center gap-2 px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-700 text-left">
                <span className="text-indigo-300 shrink-0">📄</span><span className="truncate">{p.name}</span></button>
            )) : <div className="px-3 py-2 text-[11px] text-slate-500 leading-snug">No policy linked to this domain yet — link one on the Policies page.</div>}
          </>)}
        </div>
      )}
    </div>
  );
}

/* ================= Objective (sub-control) row ================= */

  const st = state || { status:"incomplete", note:"", attachments:[] };
  return (
    <div className="rounded-lg border border-slate-700/70 bg-slate-800/40">
      <div className="flex items-start gap-3 px-3 py-2.5">
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-mono text-[11px] text-indigo-300 font-semibold shrink-0">{ctrl.id}[{obj.label}]</span>
            <span className={`w-2 h-2 rounded-full shrink-0 ${STATUS[st.status].dot}`} />
            {linkedName && <span className="inline-flex items-center gap-1 text-[10px] font-semibold px-1.5 py-0.5 rounded bg-indigo-500/10 border border-indigo-500/30 text-indigo-200">🔗 {linkedName}</span>}
          </div>
          <p className="text-sm text-slate-300 mt-0.5">{obj.text}</p>
        </div>
        <StatusPill size="sm" status={st.status} onChange={v=>onPatch(v==="complete" ? { status:v } : { status:v, policyFile:null })} linkPolicies={linkPolicies} onLinkPolicy={onLinkPolicy} />
      </div>
      <div className="px-3 pb-3 pt-0 space-y-3">
        <div>
          <label className="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">SSP Language</label>
          <div className="mt-1"><RichText value={st.note} onChange={v=>onPatch({ note:v })} placeholder="" /></div>
        </div>
        <div>
          <label className="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Evidence</label>
          <div className="mt-1"><Attachments items={st.attachments||[]}
            onAdd={a=>onPatch({ attachments:[...(st.attachments||[]), a] })}
            onRemove={id=>onPatch({ attachments:(st.attachments||[]).filter(x=>x.id!==id) })} /></div>
        </div>
      </div>
    </div>
  );
}

/* ================= Control detail (right pane) ================= */
function ControlDetail({ ctrl, cstate, patchControl, patchObjective, setControlStatus, linkObjectivePolicy, profile, onNavigate }){
  const st = cstate;
  const doneObj = ctrl.objectives.filter(ob=>st.objectives[ob.label]?.status==="complete").length;
  const domainPols = profile ? domainPolicies(profile, ctrl).map(p=>({ file:p.file, name: policyMeta(profile,p).name })) : [];
  const polNameOf = (file)=>{ const p = profile && allPolicies(profile).find(x=>x.file===file); return p ? policyMeta(profile,p).name : null; };
  return (
    <div className="fade-in">
      {/* header */}
      <div className="border-b border-slate-800 pb-4 mb-4">
        <div className="flex items-start justify-between gap-4 flex-wrap">
          <div className="min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <h1 className="text-lg font-bold text-white">{ctrl.pid}</h1>
              <span className="text-lg font-semibold text-indigo-300">{ctrl.title}</span>
            </div>
            <div className="flex items-center gap-2 mt-1.5 flex-wrap">
              <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">{ctrl.family} · {FAMILIES.find(f=>f.code===ctrl.family).name}</span>
              <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">NIST 800-171 {ctrl.id}</span>
              {ctrl.level==="L1" && <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-sky-500/15 border border-sky-500/40 text-sky-300">Also CMMC L1</span>}
            </div>
          </div>
          <div className="text-right shrink-0">
            <div className={`inline-flex flex-col items-center px-3 py-1.5 rounded-lg border ${st.status==="complete" ? "border-emerald-500/40 bg-emerald-500/10" : "border-slate-700 bg-slate-800"}`}>
              <span className="text-[10px] uppercase tracking-wide text-slate-400 font-semibold">SPRS Impact</span>
              <span className={`text-lg font-bold ${st.status==="complete" ? "text-emerald-300" : "text-rose-300"}`}>
                {st.status==="complete" ? "+0" : "−"+ctrl.weight}
              </span>
              <span className="text-[10px] text-slate-500">{ctrl.weight} pt{ctrl.weight>1?"s":""}{ctrl.partial?" · partial credit":""}</span>
            </div>
          </div>
        </div>
        <p className="text-sm text-slate-300 mt-3 leading-relaxed">{ctrl.text}</p>
        <div className="flex items-center gap-3 mt-3">
          <span className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Status</span>
          <StatusPill status={st.status} onChange={v=>setControlStatus(v)} />
          <span className="text-xs text-slate-500 ml-2">{doneObj}/{ctrl.objectives.length} objectives complete{doneObj===ctrl.objectives.length ? " · control compliant" : ""}</span>
        </div>
      </div>

      {/* control-level evidence */}
      <div className="mb-5">
        <h3 className="text-sm font-bold text-slate-200 mb-2">Artifacts / evidence</h3>
        <Attachments items={st.attachments||[]}
          onAdd={a=>patchControl({ attachments:[...(st.attachments||[]), a] })}
          onRemove={id=>patchControl({ attachments:(st.attachments||[]).filter(x=>x.id!==id) })} />
        <div className="mt-3 rounded-lg bg-slate-800/40 border border-slate-700/60 p-3">
          <div className="text-[11px] uppercase tracking-wide text-slate-500 font-semibold mb-1.5">Example artifacts that satisfy this control</div>
          <ul className="space-y-1">
            {ctrl.artifacts.map((a,i)=>(<li key={i} className="text-xs text-slate-400 flex gap-2"><span className="text-indigo-400">•</span>{a}</li>))}
          </ul>
        </div>
      </div>

      {/* linked policies */}
      {(()=>{ const linked = profile ? policiesForControl(profile, ctrl.id) : [];
        return (
          <div className="mb-5">
            <div className="flex items-center gap-2 mb-2">
              <h3 className="text-sm font-bold text-slate-200">Linked policies</h3>
              {onNavigate && <button onClick={()=>onNavigate("policies")} className="text-[11px] font-semibold text-indigo-300 hover:text-indigo-200">Manage →</button>}
            </div>
            {linked.length ? (
              <div className="flex flex-wrap gap-2">
                {linked.map(p=>{ const m=policyMeta(profile,p);
                  return <a key={p.file} href={p.href} target="_blank" rel="noopener noreferrer" download={p.file}
                    className="inline-flex items-center gap-1.5 text-xs font-medium bg-slate-800 border border-slate-700 hover:border-indigo-500 hover:text-white text-slate-200 rounded-lg px-2.5 py-1.5">
                    <span>📄</span>{m.name}<span className="text-[10px] text-slate-500">↗</span></a>;

          </div>
        );
      })()}

      {/* objectives (sub-controls) */}
      <div>
        <h3 className="text-sm font-bold text-slate-200 mb-2">Assessment objectives (sub-controls) · 800-171A</h3>
        <div className="space-y-2">
          {ctrl.objectives.map(ob=>{
            const os = st.objectives[ob.label];
            return (
              <ObjectiveCard key={ob.label} ctrl={ctrl} obj={ob}
                state={os}
                onPatch={patch=>patchObjective(ob.label, patch)}
                linkPolicies={domainPols}
                linkedName={os && os.policyFile ? polNameOf(os.policyFile) : null}
                onLinkPolicy={file=>linkObjectivePolicy(ob.label, file)} />
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ================= Framework tree (middle) ================= */
function FrameworkTree({ profile, selected, onSelect, query }){
  const [openFams, setOpenFams] = useState(()=> new Set([CONTROLS.find(c=>c.id===selected)?.family || "AC"]));
  const toggle = (code)=> setOpenFams(prev=>{ const n=new Set(prev); n.has(code)?n.delete(code):n.add(code); return n; });
  const q = query.trim().toLowerCase();

  const matches = (c)=> !q || c.id.includes(q) || c.pid.toLowerCase().includes(q) || c.title.toLowerCase().includes(q) || c.text.toLowerCase().includes(q);

  return (
    <div className="text-sm">
      {FAMILIES.map(fam=>{
        const controls = CONTROLS.filter(c=>c.family===fam.code && matches(c));
        if(q && controls.length===0) return null;
        const stats = familyStats(profile, fam.code);
        const isOpen = openFams.has(fam.code) || !!q;
        const pct = Math.round(stats.done/stats.total*100);
        return (
          <div key={fam.code} className="mb-0.5">
            <div className={`w-full flex items-center gap-2 px-2 py-2 rounded-lg ${selected===fam.code ? "bg-indigo-500/15 border border-indigo-500/40" : "hover:bg-slate-800/70 border border-transparent"}`}>
              <button onClick={()=>toggle(fam.code)} className="text-slate-500 hover:text-slate-200 text-xs w-3 shrink-0">{isOpen?"▾":"▸"}</button>
              <button onClick={()=>{ onSelect(fam.code); setOpenFams(prev=>new Set(prev).add(fam.code)); }}
                className={`font-bold text-xs tracking-wide flex-1 uppercase text-left truncate ${selected===fam.code ? "text-white" : "text-slate-200 hover:text-indigo-300"}`}
                title="Open domain home page">{fam.code}: {fam.name}</button>
              {stats.done===stats.total
                ? <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 shrink-0">✓ COMPLIANT</span>
                : <span className="text-[10px] text-slate-500 font-mono">{stats.done}/{stats.total}</span>}
              <span className="w-10 h-1.5 rounded-full bg-slate-700 overflow-hidden shrink-0">
                <span className="block h-full bg-emerald-500" style={{width:pct+"%"}} /></span>
            </div>
            {isOpen && (
              <div className="ml-4 border-l border-slate-800 pl-1">
                {controls.map(c=>{
                  const cs = profile.controls[c.id];
                  const active = selected===c.id;
                  return (
                    <button key={c.id} onClick={()=>onSelect(c.id)}
                      className={`w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left ${active ? "bg-indigo-500/15 border border-indigo-500/40" : "hover:bg-slate-800/60 border border-transparent"}`}>
                      <span className={`w-2 h-2 rounded-full shrink-0 ${STATUS[cs?.status||"incomplete"].dot}`} />
                      <span className="font-mono text-[11px] text-indigo-300 shrink-0">{c.pid}</span>
                      <span className={`text-xs truncate ${active?"text-white":"text-slate-300"}`}>{c.title}</span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ================= Domain home page ================= */
function DomainHome({ famCode, profile, ssp, setDomainSsp, onOpenControl }){
  const fam = FAMILIES.find(f=>f.code===famCode);
  const controls = CONTROLS.filter(c=>c.family===famCode);
  const stats = familyStats(profile, famCode);
  const objTotal = controls.reduce((s,c)=>s+c.objectives.length, 0);
  const objDoneN = controls.reduce((s,c)=>{ const cs=profile.controls[c.id]; return s + c.objectives.filter(ob=>cs.objectives[ob.label]?.status==="complete").length; }, 0);
  const compliant = stats.done===stats.total;
  return (
    <div className="fade-in max-w-4xl">
      <div className="border-b border-slate-800 pb-4 mb-4">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <div className="flex items-center gap-2 flex-wrap">
              <h1 className="text-xl font-bold text-white">{fam.code}</h1>
              <span className="text-lg font-semibold text-indigo-300">{fam.name}</span>
              {compliant && <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/40">✓ DOMAIN COMPLIANT</span>}
            </div>
            <div className="text-xs text-slate-500 mt-1">CMMC domain · {stats.total} controls · {objTotal} assessment objectives</div>
          </div>
          <div className="grid grid-cols-2 gap-2 text-center">
            <div className="rounded-lg border border-slate-700 bg-slate-800 px-4 py-1.5"><div className="text-lg font-bold text-emerald-300">{stats.done}/{stats.total}</div><div className="text-[10px] text-slate-500 uppercase">Controls</div></div>
            <div className="rounded-lg border border-slate-700 bg-slate-800 px-4 py-1.5"><div className="text-lg font-bold text-slate-200">{objDoneN}/{objTotal}</div><div className="text-[10px] text-slate-500 uppercase">Objectives</div></div>
          </div>
        </div>
        <p className="text-sm text-slate-300 mt-3 leading-relaxed">{DOMAIN_DESC[famCode]}</p>
      </div>

      {/* SSP description */}
      <div className="mb-6">
        <h3 className="text-sm font-bold text-slate-200 mb-1">SSP description</h3>
        <p className="text-[11px] text-slate-500 mb-2">Describe how your organization addresses the {fam.name} domain. This narrative will feed the System Security Plan (SSP).</p>
        <RichText value={ssp} onChange={setDomainSsp} minHeight={160} placeholder="" />
      </div>

      {/* controls in this domain */}
      <div>
        <h3 className="text-sm font-bold text-slate-200 mb-2">Controls in this domain</h3>
        <div className="space-y-1.5">
          {controls.map(c=>{
            const cs = profile.controls[c.id];
            const d = c.objectives.filter(ob=>cs.objectives[ob.label]?.status==="complete").length;
            return (
              <button key={c.id} onClick={()=>onOpenControl(c.id)}
                className="w-full flex items-center gap-3 px-3 py-2 rounded-lg border border-slate-800 bg-slate-900/40 hover:border-indigo-500/50 hover:bg-slate-800/40 text-left">
                <span className={`w-2 h-2 rounded-full shrink-0 ${STATUS[cs?.status||"incomplete"].dot}`} />
                <span className="font-mono text-[11px] text-indigo-300 shrink-0">{c.pid}</span>
                <span className="text-sm text-slate-200 truncate flex-1">{c.title}</span>
                <span className="text-[11px] text-slate-500 shrink-0">{d}/{c.objectives.length} obj</span>
                <span className="text-xs text-indigo-300 shrink-0">→</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ================= Framework view ================= */
function FrameworkView({ profile, updateProfile, onNavigate, selected, onSelect }){
  const [query, setQuery] = useState("");
  const isDomain = FAMILIES.some(f=>f.code===selected);
  const ctrl = isDomain ? null : CONTROLS.find(c=>c.id===selected);
  const cstate = ctrl ? profile.controls[selected] : null;
  const setDomainSsp = (v)=> updateProfile(p=>{ p.domains = { ...(p.domains||{}) }; p.domains[selected] = { ...(p.domains[selected]||{}), ssp:v }; return p; });

  const patchControl = (patch)=> updateProfile(p=>{
    p.controls[selected] = { ...p.controls[selected], ...patch }; return p;
  });
  const patchObjective = (label, patch)=> updateProfile(p=>{
    const c = p.controls[selected];
    c.objectives = { ...c.objectives, [label]: { ...c.objectives[label], ...patch } };
    recomputeControl(p, selected); // sub-controls roll up to the control
    return p;
  });
  // Control status is a bulk shortcut: set every sub-control to the chosen status.
  const setControlStatus = (v)=> updateProfile(p=>{
    const c = p.controls[selected]; const objs = {};
    Object.keys(c.objectives).forEach(k=> objs[k] = { ...c.objectives[k], status:v });
    c.objectives = objs; recomputeControl(p, selected); return p;
  });
  // Link a sub-control to a policy → marks that sub-control compliant.
  const linkObjectivePolicy = (label, file)=> updateProfile(p=>{
    const c = p.controls[selected];
    c.objectives = { ...c.objectives, [label]: { ...c.objectives[label], status:"complete", policyFile:file } };
    recomputeControl(p, selected); return p;
  });

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="framework" onNavigate={onNavigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar profile={profile}>
          <SearchBox value={query} onChange={setQuery} />
        </TopBar>
        <div className="flex-1 flex min-h-0">
          <div className="w-[340px] shrink-0 border-r border-slate-800 overflow-y-auto px-2 py-3 bg-[#0d1119]">
            <FrameworkTree profile={profile} selected={selected} onSelect={onSelect} query={query} />
          </div>
          <div className="flex-1 overflow-y-auto px-6 py-5">
            {isDomain
              ? <DomainHome famCode={selected} profile={profile} ssp={(profile.domains||{})[selected]?.ssp||""} setDomainSsp={setDomainSsp} onOpenControl={onSelect} />
              : (ctrl && cstate && <ControlDetail ctrl={ctrl} cstate={cstate} patchControl={patchControl} patchObjective={patchObjective} setControlStatus={setControlStatus} linkObjectivePolicy={linkObjectivePolicy} profile={profile} onNavigate={onNavigate} />)}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================= Controls list view ================= */
const verCompare = (a,b)=>{ const pa=a.split(".").map(Number), pb=b.split(".").map(Number); for(let i=0;i<3;i++){ if((pa[i]||0)!==(pb[i]||0)) return (pa[i]||0)-(pb[i]||0); } return 0; };
const objDone = (ctrl, cs)=> ctrl.objectives.filter(ob=>cs.objectives[ob.label]?.status==="complete").length;
const evidenceCount = (cs)=>{ let n=(cs.attachments||[]).length; Object.values(cs.objectives||{}).forEach(ob=>{ n+=(ob.attachments||[]).length; }); return n; };


/* ================= Dashboard (portal home) ================= */
function Dial({ code, name, done, total, onClick }){
  const pct = total ? Math.round(done/total*100) : 0;
  const r=34, circ=2*Math.PI*r, off=circ-(pct/100)*circ;
  const color = pct>=80?"#34d399":pct>=40?"#fbbf24":pct>0?"#fb7185":"#475569";
  return (
    <button onClick={onClick} title={`${code}: ${name} — ${done}/${total} complete`}
      className="group flex flex-col items-center rounded-xl border border-slate-800 bg-slate-900/40 hover:border-slate-600 hover:bg-slate-800/40 px-2 py-3 transition-colors">
      <svg width="88" height="88" viewBox="0 0 88 88" className="shrink-0">
        <circle cx="44" cy="44" r={r} fill="none" stroke="#1e293b" strokeWidth="8"/>
        <circle cx="44" cy="44" r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
          strokeDasharray={circ} strokeDashoffset={off} transform="rotate(-90 44 44)"
          style={{transition:"stroke-dashoffset .4s ease"}}/>
        <text x="44" y="41" textAnchor="middle" fontSize="21" fontWeight="800" fill="#e2e8f0">{code}</text>
        <text x="44" y="58" textAnchor="middle" fontSize="12" fontWeight="700" fill={color}>{pct}%</text>
      </svg>
      <div className="mt-1.5 text-[11px] font-semibold text-slate-300 group-hover:text-white text-center leading-tight h-7 flex items-center">{name}</div>
      <div className="text-[10px] text-slate-500">{done}/{total} controls</div>
    </button>
  );
}

function Delta({ v, suffix }){
  if(!v) return <span className="text-slate-500 text-xs font-semibold">±0{suffix||""}</span>;
  const up = v>0;
  return <span className={`text-xs font-bold ${up?"text-emerald-400":"text-rose-400"}`}>{up?"▲":"▼"} {up?"+":""}{v}{suffix||""}</span>;
}

function DashboardView({ profile, updateProfile, onNavigate, onOpenControl }){
  const captureRef = useRef(null);
  const [copyState, setCopyState] = useState("idle");
  const contact = profile.contact || {};
  const editContact = ()=>{
    const name = prompt("Primary contact name:", contact.name||"");
    if(name===null) return;
    const email = prompt("Primary contact email:", contact.email||"");
    if(email===null) return;
    updateProfile(p=>{ p.contact = { name:name.trim(), email:(email||"").trim() }; return p; });
  };

  const score = sprsScore(profile), pct = progressPct(profile);
  const done = CONTROLS.filter(c=>profile.controls[c.id].status==="complete").length;
  const prog = CONTROLS.filter(c=>profile.controls[c.id].status==="inprogress").length;
  const inc  = CONTROLS.length - done - prog;
  const firstOf = (code)=> CONTROLS.find(c=>c.family===code).id;
  const scoreColor = score>=88?"text-emerald-300":score>=0?"text-amber-300":"text-rose-300";

  // week-over-week baseline
  const base = pickBaseline(profile.history, 7);
  const isSelfBaseline = base && base.date===todayISO();
  const dScore = base ? score - base.score : 0;
  const dPct   = base ? pct   - base.pct   : 0;
  const dDone  = base ? done  - base.done  : 0;
  const famDeltas = (base && base.fam)
    ? FAMILIES.map(f=>({ code:f.code, d: familyStats(profile,f.code).done - (base.fam[f.code]||0) })).filter(x=>x.d!==0).sort((a,b)=>b.d-a.d)
    : [];

  async function copyScreenshot(){
    const node = captureRef.current;
    if(!node) return;
    if(typeof window.html2canvas !== "function"){ setCopyState("error"); setTimeout(()=>setCopyState("idle"),3500); return; }
    setCopyState("working");
    try{
      const canvas = await window.html2canvas(node, { backgroundColor:"#0f1420", scale:2, useCORS:true, logging:false,
        ignoreElements:(el)=> el.getAttribute && el.getAttribute("data-noshot")==="1" });
      await new Promise(res=> canvas.toBlob(async(blob)=>{
        try{
          if(!blob) throw new Error("no blob");
          if(navigator.clipboard && window.ClipboardItem){
            await navigator.clipboard.write([ new window.ClipboardItem({ "image/png": blob }) ]);
            setCopyState("copied");
          } else throw new Error("clipboard unavailable");
        }catch(e){
          const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${profile.slug}-compliance-${todayISO()}.png`;
          document.body.appendChild(a); a.click(); a.remove();
          setCopyState("downloaded");
        }
        res();
      }, "image/png"));
      setTimeout(()=>setCopyState("idle"), 3500);
    }catch(e){ console.error(e); setCopyState("error"); setTimeout(()=>setCopyState("idle"),3500); }
  }
  const copyLabel = { idle:"📸 Copy screenshot", working:"Capturing…", copied:"✓ Copied — paste into email", downloaded:"⬇ Saved PNG (clipboard blocked)", error:"⚠ Capture failed — retry" }[copyState];
  const copyCls = copyState==="copied" ? "border-emerald-500/50 bg-emerald-500/15 text-emerald-300"
    : copyState==="error" ? "border-rose-500/50 bg-rose-500/15 text-rose-300"
    : "border-indigo-500/50 bg-indigo-500/15 text-indigo-200 hover:bg-indigo-500/25";

  const Tile = ({ n, label, cls }) => (
    <div className="rounded-xl border border-slate-800 bg-slate-900/40 px-4 py-3">
      <div className={`text-2xl font-bold ${cls}`}>{n}</div>
      <div className="text-[11px] uppercase tracking-wide text-slate-500 font-semibold mt-0.5">{label}</div>
    </div>
  );
  const CompareTile = ({ label, now, was, delta, suffix, nowCls }) => (
    <div className="rounded-xl border border-slate-800 bg-slate-900/50 px-4 py-3">
      <div className="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">{label}</div>
      <div className="flex items-baseline gap-2 mt-0.5">
        <span className={`text-2xl font-bold ${nowCls||"text-white"}`}>{now}{suffix||""}</span>
        <Delta v={delta} suffix={suffix} />
      </div>
      <div className="text-[11px] text-slate-500 mt-0.5">was {base ? (was+(suffix||"")) : "—"}</div>
    </div>
  );

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="dashboard" onNavigate={onNavigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar profile={profile} />
        <div className="flex-1 overflow-y-auto px-6 py-6">
          {/* toolbar (not part of the screenshot) */}
          <div className="mb-4 flex items-start justify-between gap-3 flex-wrap" data-noshot="1">
            <div>
              <h1 className="text-xl font-bold text-white">Compliance Dashboard</h1>
              <p className="text-sm text-slate-400 mt-0.5">Snapshot of {profile.name}'s assessment progress across all control families.</p>
              <div className="text-xs mt-1 flex items-center gap-2">
                <span className="text-slate-500 font-semibold">Primary contact:</span>
                {(contact.name || contact.email)
                  ? <span className="text-slate-300">{contact.name}{contact.email ? ` · ${contact.email}` : ""}</span>
                  : <span className="text-slate-500 italic">none</span>}
                <button onClick={editContact} className="text-indigo-300 hover:text-indigo-200 font-semibold">{(contact.name||contact.email) ? "Edit" : "＋ Add"}</button>
                <span className="text-slate-600">·</span>
                <span className="text-slate-500">flows to Project Management</span>
              </div>
              <div className="text-xs mt-1 flex items-center gap-2">
                <span className="text-slate-500 font-semibold">SV4 boundary:</span>
                {(() => { const nd = ((profile.scope||{}).diagrams||[]).length; return nd
                  ? <span className="text-slate-300">{nd} diagram{nd!==1?"s":""}</span>
                  : <span className="text-slate-500 italic">no diagram</span>; })()}
                <button onClick={()=>onNavigate("scope")} className="text-indigo-300 hover:text-indigo-200 font-semibold">Open SV4 →</button>
              </div>
            </div>
            <button onClick={copyScreenshot} disabled={copyState==="working"} data-noshot="1"
              className={`inline-flex items-center gap-2 rounded-lg border px-3.5 py-2 text-xs font-semibold transition-colors ${copyCls}`}>
              {copyLabel}
            </button>
          </div>

          {/* ================= captured region (executive screenshot) ================= */}
          <div ref={captureRef} className="rounded-2xl bg-[#0f1420] p-5 border border-slate-800/60">
            {/* header for the exec image */}
            <div className="flex items-end justify-between gap-3 flex-wrap pb-4 mb-5 border-b border-slate-800">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold text-sm">CF</div>
                <div>
                  <div className="text-lg font-bold text-white leading-tight">{profile.name} — CMMC Level 2 Compliance Status</div>
                  <div className="text-xs text-slate-500">NIST SP 800-171 Rev 2 · 110 controls · Generated {fmtDay(todayISO())}</div>
                </div>
              </div>
              <div className={`px-3 py-1.5 rounded-lg border text-center ${score>=88?"border-emerald-500/40 bg-emerald-500/10":score>=0?"border-amber-500/40 bg-amber-500/10":"border-rose-500/40 bg-rose-500/10"}`}>
                <div className="text-[10px] uppercase tracking-wide text-slate-400 font-semibold">SPRS</div>
                <div className={`text-xl font-bold ${scoreColor}`}>{score}<span className="text-xs text-slate-500 font-normal"> / 110</span></div>
              </div>
            </div>

            {/* executive snapshot: current vs one week ago */}
            <div className="flex items-center justify-between mb-2 flex-wrap gap-1">
              <h2 className="text-sm font-bold text-slate-200">Executive Snapshot <span className="text-slate-500 font-normal">· current vs one week ago</span></h2>
              <div className="text-[11px] text-slate-500">Baseline: {base ? `${fmtDay(base.date)} (${daysAgo(base.date)===0?"today":daysAgo(base.date)+(daysAgo(base.date)===1?" day":" days")+" ago"})` : "none yet"}</div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-2">
              <CompareTile label="SPRS Score" now={score} was={base?base.score:"—"} delta={dScore} nowCls={scoreColor} />
              <CompareTile label="% Complete" now={pct} was={base?base.pct:"—"} delta={dPct} suffix="%" nowCls="text-white" />
              <CompareTile label="Controls Complete" now={done} was={base?base.done:"—"} delta={dDone} nowCls="text-emerald-300" />
            </div>
            {isSelfBaseline
              ? <p className="text-[11px] text-slate-500 mb-5">Baseline was first recorded today — week-over-week deltas populate automatically as daily snapshots accrue.</p>
              : <div className="mb-5 flex items-center gap-2 flex-wrap">
                  <span className="text-[11px] text-slate-500 font-semibold">Family movement:</span>
                  {famDeltas.length ? famDeltas.map(f=>(
                    <span key={f.code} className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${f.d>0?"text-emerald-300 border-emerald-500/30 bg-emerald-500/10":"text-rose-300 border-rose-500/30 bg-rose-500/10"}`}>{f.code} {f.d>0?"+":""}{f.d}</span>
                  )) : <span className="text-[11px] text-slate-500">No family-level change since baseline.</span>}
                </div>}

            {/* status tiles */}
            <div className="grid grid-cols-1 md:grid-cols-[auto_1fr] gap-4 mb-6">
              <div className="rounded-xl border border-slate-800 bg-gradient-to-b from-slate-900 to-[#0d1119] p-5 flex items-center gap-5">
                <ScoreRing pct={pct} />
                <div>
                  <div className="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Overall Progress</div>
                  <div className="flex items-baseline gap-1"><span className="text-4xl font-bold text-white">{pct}<span className="text-lg">%</span></span></div>
                  <div className="text-xs text-slate-400 mt-1">{done} of {CONTROLS.length} controls complete</div>
                </div>
              </div>
              <div className="grid grid-cols-3 gap-3">
                <Tile n={done} label="Complete" cls="text-emerald-300" />
                <Tile n={prog} label="In Progress" cls="text-amber-300" />
                <Tile n={inc} label="Incomplete" cls="text-slate-300" />
