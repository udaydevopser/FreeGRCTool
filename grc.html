y Director &amp; General Counsel.</p><h4>6.3.3.  Prohibited Conduct</h4><p>Misuse or abuse of ACME, Inc. Information Systems and, in particular, ACME, Inc.’s email system and Internet access, and any violation of ACME, Inc. polices, including the Code of Business Conduct, and policies relating to information technology, information security, confidentiality, intellectual property, social media and privacy that have been provided or otherwise made available to the User using the ACME, Inc. Information Systems, could expose ACME, Inc. and any individual who engages in the improper conduct to civil or criminal liability. For this reason, all Users shall carefully review the following list, which is not intended to be all-inclusive, of prohibited conduct in using ACME, Inc. Information Systems:</p><p>Engaging in conduct that is illegal, unethical or a violation of ACME, Inc. polices, including the Code of Business Conduct, and policies relating to information technology, information security, confidentiality, intellectual property, social media, and privacy that have been provided or otherwise made available to the User with access to ACME, Inc. Information Systems.</p><p>Accessing or disclosing ACME, Inc. proprietary or confidential information stored on ACME, Inc. Information Systems when not authorized to do so. ACME, Inc. proprietary or confidential information may include, but is not limited to, non-public financial data, such as estimates of financial performance; sensitive business information, such as marketing strategies, product launches and pricing policies; plans for the acquisition or disposition of corporate assets; intellectual property, know-how, trade secrets; personnel or payroll information, human resources information, private or personal information; and information about customers, suppliers or third parties;</p><p>Disclosing a User's own passwords, ID, authentication information, credentials and/or access codes for ACME, Inc. Information Systems to any person or use of such information of another User.</p><p>Downloading software to, or installing software on, ACME, Inc. Information Systems without the prior approval of an authorized representative of the IT Department.</p><p>Misappropriating or infringing a patent, copyright, or other intellectual property right of ACME, Inc. or any third party, for example, by downloading or sharing copyrighted software, movies, or music without permission of the copyright owner.</p><p>Intentionally sending, receiving, downloading, or implementing any malicious code or software, such as worms, viruses, or spyware.</p><p>Creating, sending, storing, or viewing any content that ACME, Inc. considers to be offensive, obscene, sexually explicit, or pornographic. Offensive material includes, but is not limited to, sexual comments, jokes or images and pornography; racial slurs; sexist comments; or any comments, jokes or images that are offensive on the basis of race, color, creed, sex, sexual orientation, age, national origin, or ancestry, physical or mental disability, veteran status, or any other category protected by federal, state, or local laws.</p><p>Harassment, threats, defamation, hostility, bullying or discrimination against any person.</p><p>Soliciting for or engaging in any other activities on behalf of any outside business venture, political campaign, political group, charity, or religious group.</p><p>Communicating with a personal attorney through ACME, Inc.-provided email (excluding through ACME, Inc.-provided wired and mobile phones and smartphones).</p><p>Encrypting any information, including email and voicemail, unless the encryption software was issued by and otherwise authorized in advance by ACME, Inc..</p><p>Circumventing any access-related authentication requirements.</p><p>Dissemination of unauthorized email messages including spam, mass mailings, etc.</p><p>Damage, disruption, or exposure of systems, resources, or data to unauthorized access or harm.</p><p>Outside employment or non-ACME, Inc. commercial activities for personal financial gain.</p><p>Campaigning for political office or soliciting political contributions; and</p><p>Political lobbying, wagering, or betting.</p><h4>6.3.4.  Security, Access, and Passwords</h4><p>Individuals sharing computers shall log in and out as required, using their own password and credentials.</p><p>Users shall not sign on to any unclassified ACME, Inc. Information System using the password, username, or credentials of another User.</p><p>Passwords/PINS relating to any ACME, Inc. Information System must be kept private and conform to password/PIN guidelines, including using strong passwords/PINS, changing passwords/PINS periodically and using password/PINS that are difficult to determine. Passwords/PINS must never be written down or stored in plain text on any machine. Password/PIN protection must be enabled on all ACME, Inc. Information Systems in the possession of a User (laptop, phone, tablet, etc.).</p><p>Do not use the password created for your ACME, Inc. account as the password for any other systems.</p><p>Information Technology personnel will not ask for your password: if there is a need to access your account, user passwords will be reset, and the User will be informed.</p><p>Users shall always lock their computer screen when leaving their computer desktop or laptop and log out if they are leaving for any significant period of time. Only ACME, Inc.-approved screensavers may be used, and screen locks are applied with a setting of no more than fifteen (15) minutes.</p><p>Every ACME, Inc. employee or assigned contractor who generates, or is provided, printed CUI or hardware as part of his/her ACME, Inc. position is responsible to safeguard each in a secure manner (e.g. locked container, desk, cabinet, etc.) which precludes access to unauthorized persons (e.g. people without the need-to-know, foreign nationals).</p><p>Non-ACME, Inc. devices (mobile devices, removable media, personal laptops/tablets, etc.) are not permitted to connect to or access the ACME, Inc. network without written permission and approval.</p><p>Do not insert any external storage media from non-ACME, Inc. resources (including mobile devices, vendor presentations, unknown sources, etc.) without approval from an authorized IT representative. Requests to use non-ACME, Inc.-supplied external storage media on ACME, Inc. resources must be submitted through the ticketing system. All such media must be scanned for malicious content before use on ACME, Inc. resources.</p><p>Portable computers shall be connected to the network at least once every two (2) weeks to ensure patches are installed and User account information is updated. All systems must connect within thirty (30) days, or they will be automatically disabled due to inactivity.</p><h4>6.3.5.  Equipment</h4><p>Under no circumstances shall ACME, Inc. Technology be serviced by unauthorized external non-ACME, Inc. personnel or unauthorized ACME, Inc. personnel. Users are not permitted to have equipment assessed and/or serviced outside of ACME, Inc. without IT representative approval. IT equipment shall be procured, installed, relocated, or disposed of only by the authorized IT representative.</p><p>If taking company equipment offsite, reasonable care shall be taken to protect the equipment from damage, compromise, theft, etc. Laptops shall be placed in the trunk of cars, so they are not visible. Users must return any ACME, Inc. Information Systems issued to that User upon termination of employment or contract, or at ACME, Inc.’s request.</p><p>Travel to or between non-U.S. locations with technology/technical data subject to U.S. Export Controls, whether in hard copy or stored on electronic devices, including but not limited to, laptops, smart phones, tablets, and external storage devices, may constitute an export/re-export of the subject technology/technical data to the countries visited. U.S. employees are prohibited from taking ACME, Inc. Technology on personal international travel unless authorized in writing by the Security Director. Referenced authorization will be maintained by ACME, Inc. CISO. Authorized international business travel requiring the use of ACME, Inc. Technology requires prior coordination and approval, which includes obtaining approvals from Export Control, Security, and Information Security. On a case-bycase basis, a sanitized laptop, storage device and/or mobile phone may be required to ensure only authorized content is available while on international business travel.</p><h4>6.3.6.  Network</h4><p>Critical data must be stored on a network drive, or regularly copied to a network drive so backups can be made.</p><p>Non-ACME, Inc. Information Systems (e.g., visitor's laptops) must not be connected to the main data network without prior authorization from an IT representative. A ACME, Inc. Guest Network is provided to allow guests to access the internet for business purposes while onsite.</p><p>Users shall not open any .COM, .SCR, .VBS, or .EXE or other unknown or unexpected file, email, or email attachment without first contacting an authorized IT representative.</p><p>Under no circumstances shall forwarding of emails, including auto forwarding (e.g., Out of Office Assistant), be used to re-direct emails regarding ACME, Inc. business to non-ACME, Inc. addresses (e.g., Internet-based email providers such as Gmail, Hotmail, Yahoo, etc.). Email is monitored by InfoSec and all email forwarding is subject to review.</p><h4>6.3.7.  Software</h4><p>Software Code of Ethics</p><p>Unauthorized duplication of copyrighted computer software violates the law and is contrary to ACME, Inc.’s standards of conduct. We disapprove of such copying and recognize the following principles as a basis for preventing its occurrences:</p><p>We will neither engage in, nor tolerate the making or using of unauthorized software copies under any circumstances.</p><p>We will provide legally acquired software to meet the legitimate software needs in a timely fashion and in sufficient quantities for all our computers.</p><p>We will comply with all license or purchase terms regulating the use of any software we acquire or use; and</p><p>We will enforce reasonable internal controls to prevent the making or using of unauthorized software copies, including effective measures to verify compliance with these standards and appropriate disciplinary measures for violation of these standards.</p><p>Other Software Requirements:</p><p>No software shall be procured for, or installed onto, any computer by any non-IT support person without IT approval.</p><p>No third-party application that provides remote access to Information Systems (e.g., VPN Clients or Remote Desktop viewers such as GoToMeeting, TeamViewer, LogMeIn123) is permitted without approval from an authorized IT representative.</p><p>Users shall not undertake the development of applications or databases without the approval from an authorized IT representative, unless software development responsibilities are part of their job responsibilities.</p><p>Mobile Device applications must be downloaded through the Apple Store or Google Play; and</p><p>Under no circumstances shall the mobile device’s operating system be tampered with (i.e. jailbreaking, rooting, etc.).</p><h4>6.3.8.  EMAIL/INTERNET/MOBILE DEVICE USE</h4><p>If you receive any virus warnings, do not take any action, and contact an authorized IT representative immediately.</p><p>Do not forward suspicious emails to another User inside or outside of the company systems. Information Technology has incorporated an anti-spam O365 built in solution to address this.</p><p>Click the “Report” button and use the dropdown “Report Phishing” in your ACME, Inc. email to report suspicious emails.</p><p>All internet activity is monitored, including browsed locations, activity, browsing times, and content viewed. Summary reports of user activity may be distributed to managers and departments to review and assess how IT resources are being utilized.</p><p>Users shall not disclose their company user account or email address for any non-business-related services. This includes using corporate usernames or email addresses for personal email, social media, dating, file sharing, and multi-media content hosting web sites.</p><p>Users are expected to comply with National Industrial Security Program and U.S. export regulations when transmitting data that could contain export-controlled data. Entering, modifying, transmitting, or storing of classified information on an unclassified computer or device is strictly prohibited.</p><p>ACME, Inc. authorizes corporate wireless LAN access for all employees that are issued ACME, Inc. laptops.</p><p>Users with ACME, Inc.-owned mobile phones to access ACME, Inc. Information Systems must not disable password protection on the device.</p><p>Telephone conversations, text messages and voicemail messages of every employee may, without notice, be monitored, recorded, and reviewed.</p><p>Under no circumstances shall forwarding of phone calls (e.g. call forwarding) be used to redirect phone calls, voicemails or text messages regarding ACME, Inc. business to non-ACME, Inc. numbers (e.g., personal cell phone, desk phones, computers). Phones are monitored by InfoSec and all call forwarding is automatically flagged and subject to review.</p><h4>6.3.9.  WAIVERS</h4><p>Any waivers to this Policy must be authorized in writing by the ACME, Inc. CISO. The ACME, Inc. CISO will work with all necessary functions to gain approval on any waiver requests.</p><h4>6.3.10.  CONDUCT NOT PROHIBITED BY THIS POLICY</h4><p>This Policy is not intended to restrict communications or actions protected or required by state or federal law.</p><h4>6.3.11.  REPORTING VIOLATIONS AND SECURITY INCIDENTS</h4><p>Users must immediately report any violations of this Policy, as well as any Information Security Incident, to the Information Security Team, their supervisor, IT Department, or the Chief Information Security Officer (CISO). Information Security Incidents include, but are not limited to, any unauthorized access, disclosure, acquisition, or destruction, of information stored on ACME, Inc. Information Systems, as well as the loss or theft of any ACME, Inc. Technology. If a device is thought to be lost is recovered, the device shall be submitted directly to Information Security prior to use to ensure the device has not been compromised or infected with any malware or virus that could damage ACME, Inc. Information Systems. All violations and security incidents at cleared ACME, Inc. facilities shall be reported to the local Facility Security Officer (FSO).</p><h4>6.3.12.  DISCIPLINE</h4><p>Violations of this Policy may result in disciplinary actions which may include withdrawal of access to ACME, Inc. Information Systems (including but not limited to computers and mobile devices) and up to and including termination of employment and/or civil or criminal penalties. Additionally, violations of this policy by cleared ACME, Inc. employees may constitute reporting to the U.S. Government and result in suspension or loss of the employee’s security clearance.</p><h4>6.3.13.  RESPONSIBLITIES</h4><p>The Information Technology (IT) and Human Resources (HR) Departments are responsible for the administration of this Policy. Updates to this Policy will be made available in electronic form and published on the Intranet. Changes will be noted in the Record of Changes (at the end of this Policy) to highlight the pertinent changes from the previous version of this Policy.</p><h4>6.3.14.  ACKNOWLEDGEMENT OF RECEIPT AND REVIEW</h4><p>I have read and understood the above Policy and agree that it is my responsibility to be familiar with and abide by the terms.</p><p>Printed Name:</p><p>Signature:</p><p>Date:</p><h4>BREACHES OF THIS POLICY</h4><p>Compliance with this Policy is mandatory in all cases. Any breaches of this Policy will result in disciplinary action, up to and including termination of employment. Employees must report any actual or suspected breach of this Policy. Reports can be made via your supervisor, Human Resources, an Ethics Champion, or the ACME, Inc. Ethics Hotline at +1 (833) 996-3948 (toll-free in the U.S. only; international rates apply outside the U.S.)</p>","ACCEPTABLE_USE_POLICY.docx":"<p>Acceptable Use Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>3/31/23</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of this policy is to outline the acceptable use of LP3 information assets and computer equipment. These rules are in place to protect the employee and the company. Inappropriate use exposes the company to risks including malware attacks, compromise of network systems and services, and legal liability.</p><p>Scope</p><p>The Acceptable Use Policy applies to the following</p><p>• All Employees of LP3</p><p>• All Contractors of LP3</p><p>• All vendors / third-party / visitors who temporarily access LP3's equipment</p><p>• All computers/laptops</p><p>• All mobile devices</p><p>• Internet and Intranet usage</p><p>• Software procured</p><p>• Leased or rented equipment</p><p>Background</p><p>The Acceptable Use Policy outlines the rules for using electronics and computer equipment for business use. The rules in this policy are written to reduce the risk of intentional or accidental exposure of confidential and business information to third parties by improper use of company equipment and network. These rules prevent illegal, harmful, discriminatory, or abusive behavior using the company networks or property.</p><p>Policy</p><p>Acceptable use policy requires that under no circumstances is an employee authorized to engage in any activity that is illegal under local, state, federal, or international law while utilizing company-owned resources. The use of all resources must be strictly for the Company's business purposes.</p><p>General Use and Ownership</p><p>While the Company desires to provide a reasonable level of privacy, users should be aware that the data they create on the corporate systems and network remains the property of the Company.</p><p>Because of the need to protect the Company's network and information assets, management cannot guarantee the confidentiality of personal information stored by employees on any computer system or device belonging to the Company.</p><p>Employees are responsible for exercising good judgment regarding the reasonableness of personal use. In the absence of clear guidance or if there is any uncertainty, employees should consult their supervisor or manager.</p><p>For security and maintenance purposes, authorized individuals within the Company may monitor security cameras, equipment, systems, and network traffic.</p><p>LP3 reserves the right to audit networks, systems, and their contents (e.g., email or chat) periodically to ensure compliance with this policy.</p><p>Data Protection</p><p>Employees should take all necessary steps to prevent unauthorized access to the Company's confidential information. Examples include personally identifiable information such as employees' or customers' tax data, credit card data, birth dates, home addresses, SSN or Immigration ID numbers, phone numbers, other sensitive data, corporate strategies, trade secrets, and sales data. Employees recognize that access to such data is on a need-to-know basis.</p><p>Laptop &amp; Tablet Security</p><p>Employees are provided with a laptop or a tablet when starting at the Company. The employee must acknowledge that they are responsible for the device's physical security allocated to them. All laptops and tablets acquired for or on behalf of the Company are company property. Employees recognize that laptops and tablets are expensive and that employees should exercise common sense in keeping these devices safe and secure. In this regard, employees must</p><p>• Store any files or documents that need backup in the Company's shared file drives or other data repositories.</p><p>• Store their laptop in a secure location when not in use.</p><p>Employees are prohibited from</p><p>• Attempting to remove or circumvent antivirus, password-protected screen savers, or other security measures installed on their laptops when given to them.</p><p>• Leaving laptops unattended outside the office in any capacity.</p><p>• Knowingly leaving PII on the laptop or sending an email can result in termination.</p><p>Confidential Conversations</p><p>Employees should not have conversations about a customer's identifiable information in the open office. It is important to remember that frequently there are potentially third parties, vendors, and others in the office.</p><p>Computer use</p><p>• Employees must keep passwords secure and should never share accounts with unauthorized individuals. Authorized users are responsible for the security of their passwords and accounts.</p><p>• Employees must not use corporate passwords for non-business-related applications and websites. Employees must use the password manager provided, and all corporate passwords must be distinct and must adhere to the corporate password policy.</p><p>• Employees must not use the password manager's master password for other systems.</p><p>• All computing devices used by the employee connected to the company network shall be continually executing approved malware-scanning software with a current virus database.</p><p>• Employees must not tamper with Anti-Malware software.</p><p>• Employees must use extreme caution when opening email attachments received from unknown senders that may contain viruses and other malware. If unsure about the origin, authenticity, or security of an email, ask someone from the technical operations staff, post in the technology channel in Slack, or send an email (WITHOUT forwarding potentially offending email and attachments) to the information security team mailbox.</p><p>• Employees must not install software from any source unless specifically authorized by the IT department. Users may download business required data files from the Internet but must check them for viruses before executing them.</p><p>• Employees must not send any sensitive data such as credit card numbers, telephone calling card numbers, personal information (e.g., Social Security numbers), or passwords through the Internet.</p><p>• Employees must use Microsoft or Google's authenticator app for a multi-factor authorization solution with their company email address.</p><p>• Employees must keep antivirus software updated and functional at all times.</p><p>• Employees must set up a screensaver with a password with a timeout of 2 minutes.</p><p>Mobile Phones</p><p>• All mobile phones must be password protected with a screensaver set to a 1-minute timeout.</p><p>• No mobile device can access data classified as secret or highly sensitive.</p><p>• Personal Electronic Equipment Use</p><p>• Employees should not bring personal computers or other electronic devices to the workplace or connect them to company electronic systems (excluding Company email or messaging applications such as SLACK or TEAMs on mobile phones) unless expressly permitted via an approved request by the Company. Those personal devices include but are not limited to desktop or laptop computers, tablets, USB memory sticks, or other portable data storage devices not owned by the Company.</p><p>Printer, copier, and fax machine use</p><p>• When printing, copying, or receiving a fax containing confidential information, the involved users must not leave the machine until all copies of the sensitive information are removed.</p><p>• All paper copies of sensitive information must be disposed of by shredding or other methods approved by the IT department.</p><p>• Confidential information must not be sent outside the Company.</p><p>Unacceptable use</p><p>• The following activities are, in general, prohibited. The list below is not comprehensive but attempts to provide examples of activities that fall into the category of unacceptable use. Failure to abide by the acceptable use policy can result in disciplinary action, including termination.</p><p>• Under no circumstances is an employee authorized to engage in any activity that is illegal under local, state, federal, or international law while utilizing Company's information assets or resources.</p><p>• Violations of the rights of any person or Company by copyright, trade secret, patent or other intellectual property, or similar laws or regulations, including, but not limited to, the installation or distribution of 'pirated' or other software products that are not licensed for use by the Company.</p><p>• Unauthorized copying of copyrighted material including, but not limited to, digitization and distribution of photographs from magazines, books, or other copyrighted sources, copyrighted music, and the installation of any copyrighted software for which the Company or the end-user does not have an active license are strictly prohibited.</p><p>• Using a Company's computing asset to procure or transmit material that actively violates sexual harassment or hostile workplace laws.</p><p>• Any form of harassment via email, telephone, or paging, whether through language, frequency, or size of messages.</p><p>• Making fraudulent offers of products, items, or services originating from any Company account.</p><p>• Sending unsolicited email messages, including the sending of 'junk mail' or other advertising material to individuals who did not specifically request such material (email spam).</p><p>• Providing information about, or lists of, Company's employees to parties outside the Company.</p><p>• Solicitation of email for any other email address other than that of the poster's account, with the intent to harass or to collect replies.</p><p>• Creating or forwarding 'chain letters', 'Ponzi', or other 'pyramid' schemes.</p><p>• Blogging or other publication by employees about employees or Company's business interests, whether using Company's property and systems or personal computer systems, is not permitted without explicit management authorization.</p><p>• Exporting software, technical information, encryption software, or technology in violation of international or regional export control laws is illegal. The appropriate management should be consulted prior to the export of any material that is in question.</p><p>• Using removable media (including personal USB sticks, SD cards, or external hard drives) not provided by the Company.</p><p>Enforcement</p><p>The Acceptable Use Policy is enforced by management alongside the information security team. All exceptions to the policy should be brought to the attention of management and/or the information security team.</p>","CMMC_AWARENESS_AND_TRAINING_POLICY.docx":"<p>CMMC Awareness and Training Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>1/19/25</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of this policy is to ensure security awareness and training controls protect information systems and Personally Identifiable Information (PII). It is designed to uphold the availability, confidentiality, and integrity of data. The LP3 Information Security policy serves to be consistent with best practices associated with organizational Information Security management. The intent of this policy is to establish a method that will be used to evaluate third party services which host LP3 Information and third-party products which are procured to process LP3 information, for information security risks.  Training requirements are designed to not only inform LP3 staff of Cybersecurity Awareness and activities but are also mandated for access to certain Client systems (e.g. CMMC for CUI handling, National Industrial Security Program (NISP)  for Classified Programs)</p><p>Scope</p><p>The scope of this policy is applicable to all IT resources owned or operated by LP3. Any information that is transmitted or stored on LP3 IT resources (including e-mail, messages, and files), and not specifically identified as the property of other parties, is considered the property of LP3. All users (LP3 employees, contractors, vendors, or others) of IT resources are responsible for adhering to this policy.</p><p>This policy defines responsibilities for the protection and appropriate use of sensitive information in electronic or non-electronic formats, that is processed, received, generated, accessed, and transmitted by applications or stored on LP3.</p><p>This policy applies to all LP3 employees and users, regardless of segment/business unit, location, or assignment within the LP3 organization, and all LP3 IT systems and data.</p><p>Any exception to the policy must be approved in writing by LP3’s Chief Information Security Officer (CISO) in advance.</p><p>AT.L2-3.2.1: Ensure that managers, system administrators, and users of organizational systems are made aware of the security risks associated with their activities and of the applicable policies, standards, and procedures related to the security of those systems.</p><p>IT Security Awareness Training Procedures:</p><p>The Human Resources (HR) Department Manager (DM) will provide and track basic security awareness training given to all LP3 users with the support and assistance of the Facility Security Officer (FSO). Initial training will be provided to all LP3 users as part of initial training for new users. Refresher training will be provided at least annually.</p><p>The FSO will review security awareness training materials at least annually and provide updated training material to the HRM if they determine the training no longer addresses LP3 configuration, processes, or requirements. If the IT Manager (ITM) feels that changes to Information Systems (IS) necessitate immediate retraining, they will provide updated training materials to the HRM, identify what subset of IS users require training, and request training be provided as soon as practicable.</p><p>AT.L2-3.2.2: Ensure that personnel are trained to carry out their assigned information security- related duties and responsibilities.</p><p>IT Role-Based Security Training Procedures:</p><p>1. The DM of personnel requiring elevated IS permissions will submit an Elevated Access Request to the ITM. The ITM will review and approve request as appropriate.</p><p>2. The ITM will develop and provide specialized, role-based security training to personnel designated to fill IS roles requiring greater responsibility or permissions than regular IS users.</p><p>3. The ITM will ensure this training takes place before designated personnel are granted permissions or perform the assigned duties that necessitated their training.</p><p>4. The ITM will provide the HR DM records of specialized training. The HR DM will track this specialized, role-based training.</p><p>5. The ITM will review all personnel with designated roles or elevated IS permissions, validate that the role or elevated access are still required, and provide role-based refresher training to all such personnel at least annually.</p><p>On a yearly basis, all employees shall complete the following training:</p><p>• Identifying and Safeguarding Personally Identifiable Information (PII)</p><p>• Unauthorized Disclosure of Classified Information and CUI</p><p>• Insider Treat Awareness training</p><p>• DoD Annual Security Awareness Refresher</p><p>This list of training and their location is found at the following SharePoint List on LP3’s Employees SharePoint site:</p><p>https://lp3gov.sharepoint.com/:l:/s/LP3Employees/JABBvt_fZg4tSIFgFl-ZGY9WAQArCeg82CSec3JZt6SSKYs?e=5wWjS2</p><p>Once training is completed, employees are required to upload their certificates through the following forms:</p><p>https://lp3gov.sharepoint.com/:l:/s/LP3Employees/JAAI0ORpndyNRJCQQvIOed-hAX7HxT39tco4thYF44bT_G0?e=laDrrU</p><p>AT.L2-3.2.3: Provide security awareness training on recognizing and reporting potential indicators of insider threat</p><p>Sensitive Information Access Training Procedure:</p><p>The DM of personnel requiring elevated information access will submit a Sensitive Information Access Request to the Security Officer (SO). The SO will review and approve request as appropriate.</p><p>The SO will develop and provide specialized, role-based security training to those personnel requiring access to designated classes of sensitive information or to classified information. The SO will ensure this role-based training is provided before personnel are authorized access to the sensitive information that necessitated the training.</p><p>The SO will provide the HR DM records of specialized training. The HR DM will track this specialized, role-based training.</p><p>The SO will review all personnel with elevated information access, validate that the elevated access is still required, and retrain all personnel with elevated access at least annually.</p><p>Insider Threat Training Procedure</p><p>The HR DM will provide and track Insider Threat training to all personnel with the support of the SO. Initial training will be provided to all personnel as part of initial training for new personnel. Refresher training will be provided at least annually.</p><p>The SO will review security awareness training materials at least annually and provide updated training material to the HR DM if they determine the training requires additional or updated material on recognizing and reporting potential indicators of insider threat.</p><p>If the SO or DM feels that threat changes necessitate immediate retraining, they will provide updated training materials to the HR DM, and request training be provided as soon as practicable.</p><p>Roles and Responsibilities</p><p>Human Resources Manager (HRM) (Acting) is Scott Lawler, CEO: Ensuring the security of LP3's data and information systems is a shared responsibility amongst all employees, contractors, consultants, and affiliates of LP3. Individuals may have more than one role.</p><p>Chief Security Officer (CSO) is Scott Lawler/Jim Magee: Ensures that this policy is approved and reviewed on an annual basis. Provides communication to the staff of changes or modifications to this policy. Responsible for overseeing the LP3's Security and Insider Risk Programs and supporting security and other investigations as appropriate. The CSO is also responsible for overseeing LP3's policies, processes and training addressing the handling and safeguarding of LP3's proprietary and sensitive Information.</p><p>Chief Information Security Officer (CISO) is Jim Magee: Oversees the development and execution of the cybersecurity awareness training program. Serves as a liaison to the users, IT department, law enforcement, and other stakeholders.</p><p>Chief Information Officer (CIO) is Scott Lawler, CEO: Oversees and provides guidance and support for the processes and resources that implement security controls within Enterprise IT systems and services. Monitors, records, stores, and reviews all systems and the information transmitted or stored on them as per compliance with all applicable local, state, and federal laws associated with use of the LP3's information systems and data.</p><p>Facility Security Officer (FSO) is Jim Magee:  Oversees the security of sensitive information and systems within LP3. Maintains a secure environment and ensures compliance with security requirements.</p><p>Information Security Officer (ISO) is David Wyatt:   Manages and maintains the cybersecurity posture of LP3. The ISO safeguards information assets and maintains a resilient cybersecurity posture within LP3.</p><p>Chief Technology Officer (CTO) is David Wyatt:  Ensures the safeguarding of information and ensuring a resilient cybersecurity posture within LP3. Some key responsibilities include:</p><p>• Risk Management</p><p>• Security Policies and Procedures</p><p>• Security Architecture</p><p>• Vulnerability Management</p><p>• Incident Response</p><p>• Access Control</p><p>• Collaboration with IT Teams</p><p>• Security Awareness Training</p><p>• Security Monitoring</p><p>• Security Audits and Compliance</p><p>• Policy and Regulation Awareness</p><p>• Security Incident Reporting</p><p>IT Group: Responsible to perform the following for Enterprise IT:</p><p>• Applying risk-based controls including access, backup, documentation, and timelyemergency response practices for all systems and applications under its control.</p><p>• Providing operational IT support in accordance with global security policies.</p><p>• Recommending necessary changes to this policy and seeking CISO approval to keep thispolicy updated after major changes to the IT environment.</p><p>• Ensuring this policy is implemented within LP3's Enterprise IT environment.</p><p>User: Any person who has been authorized by the owner of the system or information to read, enter, and update that information or authenticate to the systems. This includes LP3 employees, contractors, and other third-party non-employees. The users’ responsibilities are to:</p><h4>1. Review and comply with LP3's IT policies, security requirements, and standards.</h4><p>2. Use the equipment, data, systems, and network in accordance with the “AcceptanceUse Policy.”</p><h4>3. Comply with controls established by the system originator or owner.</h4><h4>4. Prevent disclosure of confidential or sensitive information.</h4><p>5. Notify the Cybersecurity Team to report any potential or actual incident or non-compliance.</p><p>LP3 Managers: Responsible to have their team members complete the assigned training on time.</p><p>System Owner: Responsible for the overall procurement, development, integration, modification, or operation and maintenance of their information system.</p><p>Systems Administrator:</p><p>• Responsible for the management, configuration, and reliable operation of the LP3's multi-user computing environment. Duties include installing and configuring system hardware and software within the program dedicated or Innovation IT systems to comply with and enable this policy.</p><p>• Establishing and managing user accounts</p><p>• Upgrading software</p><p>• Performing backup and recovery tasks to manage risks from system flaws/vulnerabilities, malicious code, unauthorized code changes, and inadequate error.handling</p><p>• Building, patching, documenting, maintaining, and decommissioning all networksystems.</p><p>Policy Requirements</p><p>LP3 IT is controlled by the following policy statements and shall adhere to these practices to demonstrate compliance. LP3 has developed processes and procedures to facilitate the implementation of the awareness training policies, standards, and associated controls. LP3 will continue to develop policies, procedures, standards, and associated controls as necessary.</p><p>Cybersecurity Awareness and Training LP3 has developed a cybersecurity awareness and training program for continuous education of personnel on security topics. Through the completion of mandatory, comprehensive cybersecurity training course, LP3 managers, system administrators, and users of LP3 systems are made aware of the security risks associated with their activities and existence of applicable policies, standards, and procedures related to the security of those systems. LP3 Learning Management System (LMS) will be leveraged to the greatest extent possible to achieve professional training and development for all annual refresher cybersecurity training. LP3 will provide company-wide basic security awareness training to all users:</p><h4>1. As part of initial training for newly hired users (on-boarding).</h4><h4>2. When required by major system changes.</h4><h4>3. On an annual basis at a minimum.</h4><h4>4. Training should include, but is not limited to, the following topics:</h4><p>• Access to information not required for job performance</p><p>• Access to LP3 Proprietary, LP3 RESTRICTED, PII, and CUI Information</p><p>• Insider Threat</p><p>• Security Awareness</p><p>• Violations of LP3-specific policies and procedures</p><p>Privileged User Training</p><p>Personnel are trained to carry out their assigned information security-related duties and responsibilities. LP3 provides additional role-based training to personnel in the following instances:</p><h4>1. Before authorizing access to systems and/or performing assigned duties.</h4><h4>2. When required by major systems changes.</h4><h4>3. On an annual basis or as required.</h4><p>4. When required for specialized roles, such as System Administrators or Security Engineers</p><p>Security-Related Duty Training</p><p>LP3 will provide cybersecurity personnel with the prerequisite education, knowledge, skills, and abilities to perform their specific functions or require industry certifications to carry out and complete job duties. LP3 may also provide specialized training to cybersecurity personnel in the context of job functions. Specialized training may include new certifications and/or maintenance of current certifications by completing Continuing Professional Education (CPE) courses.</p><p>Certification</p><p>Upon completion of the Cybersecurity Training course, all users must acknowledge the \"Acceptable Use Policy”, before receiving a certificate of completion and maintaining access to the systems.</p><p>Training Cadence</p><p>All Users are provided with Cybersecurity Awareness Essentials Training at the time of access to LP3 IT systems (within 30 days of onboarding for new employees, and annually thereafter). Non-employee users must adhere and acknowledge the acceptable user policy with 30 days of on-boarding. Additional training may be provided, as appropriate, following major system changes. Any exception to this cadence must be approved in writing by LP3’s CISO.</p><p>Employees must also comply with all Prime Contractor and/or Client Cyber Training requirements. Failure to comply may result in removal from contract (At discretion of Prime/Client)</p><p>Cybersecurity Awareness training includes recognizing and reporting potential indicators of insider threat based the following relevant awareness security topics:</p><h4>1. CUI Handling</h4><h4>2. National Security (Classified) handling</h4><h4>3. Mobile security</h4><h4>4. Phishing</h4><h4>5. Physical security</h4><h4>6. Removable media</h4><h4>7. Password security</h4><h4>8. Safe web browsing</h4><h4>9. Social engineering</h4><h4>10. Working remotely</h4><p>Failure to Complete Training</p><p>Users who fail to comply with the mandatory awareness training requirements will be deemed in breach of LP3's policy. Action may be taken against such non-compliant users in accordance with existing LP3 corrective action procedures to include the disabling of accounts, disruption of services, and/or further disciplinary action, up to and including termination of employment or contractor engagement. All required cybersecurity training is required to be completed within 30 days of course assignment.</p><p>Training Records</p><p>Training completion records for all users who are assigned cybersecurity awareness courses will be stored in the LMS system to the greatest extent possible. Responsibilities include:</p><h4>1. Documenting and monitoring individual system security training activities.</h4><h4>2. Assigning, tracking, and monitoring compliance-linked training on an annual basis.</h4><h4>3. Retaining individual training records.</h4><p>Definitions</p><p>Cybersecurity Awareness: Cybersecurity awareness and training is recommended for the entire workforce and partners as a necessary defense against cyber-attacks. The training promotes the design and implementation of an awareness program through the development of effective materials. The training should include educational, awareness-based content to help employees understand the threats they face and invoke appropriate precautions against security incidents. Cybersecurity awareness and training topics include:</p><h4>1. Malware</h4><h4>2. CUI/Classified Handling</h4><h4>3. Mobile security</h4><h4>4. Phishing</h4><h4>5. Physical security</h4><h4>6. Removable media</h4><h4>7. Password security</h4><h4>8. Safe web browsing</h4><h4>9. Social engineering</h4><h4>10. Working remotely</h4><p>References</p><p>Records Retention Acceptable Use Policy Training and Awareness</p>","ACME_Inc_InfoSec_Awareness_and_Training_Policy_v2.docx":"<h4>0. DOCUMENT CONTROL</h4><h4>DOCUMENT NUMBER:</h4><p>900-D00034091</p><h4>REVISION:</h4><p>C</p><h4>FUNCTION:</h4><p>Information Security</p><h4>POLICY OWNER (TITLE):</h4><p>Chief Information Security Officer</p><h4>1. STATEMENT OF SCOPE AND PURPOSE</h4><p>ACME, Inc. Information Security establishes policy by restricting access to information systems, data, dissemination of data and system resources to ensure the Confidentiality, Integrity and Availability ACME, Inc. enterprise assets.</p><h4>2. APPLICABLE DOCUMENTS</h4><p>Higher Governing Documents:</p><p>DoDI 8500.01 - Cybersecurity</p><p>NIST Special Publication 800.53r4 - Risk Management Framework</p><p>NIST Special Publication 800.171r2 - Protecting CUI in Nonfederal Systems &amp; Organizations</p><p>ACME, Inc. Documents:</p><p>ACME, Inc. Enterprise System Security Plan</p><p>ACME, Inc. Technical Standards</p><h4>3. REQUIREMENTS</h4><p>To whom does this policy apply? Place an “x” by all that apply:</p><p>Geographic area:</p><p>☒ Global   ☐ U.S. Only   ☐ Country Specific: _______________________________</p><p>Covered persons:</p><p>☒ Employees   ☒ Board members   ☒ Non-permanent staff*   ☐ Other: _______________________________</p><p>*Non-permanent staff means agency/vendor staff, consultants, contractors, and any other temporary staff</p><h4>1 PURPOSE</h4><p>The purpose of the Awareness and Training Policy is to centrally define the policies and standards of how the Information System (IS) is configured, audit requirements are documented, and what organizational personnel must adhere to.</p><p>This document should be viewed as a living document subject to changes in the organization’s contractual or legal obligations. As such, it is the responsibility of the organization personnel to maintain awareness of the organization's defined policies and standards.</p><h4>2 SCOPE</h4><p>This policy applies to all ACME, Inc. employees and contractors (referred to as personnel throughout the document) accessing or managing ACME, Inc.’s IS.</p><h4>3 EXECUTIVE LEADERSHIP COMMITMENT</h4><p>ACME, Inc. Executive Leadership is committed to following this policy and the supporting procedures that the Information Security (InfoSec) Department has established, maintains, and updates on an annual basis.</p><h4>4 ROLES AND RESPONSIBILITIES</h4><h4>4.1 INFOSEC DEPARTMENT</h4><p>Develop and maintain cybersecurity policies and procedures to adhere with regulatory requirements of IS assets managed by ACME, Inc..</p><p>Issues and tracks all ACME, Inc. users Security and Awareness Training for initial and annual completion.</p><h4>4.2 IT DEPARTMENT</h4><p>Develop and maintain information technology policies, standards and procedures to adhere with regulatory requirements and industry best practices of IS assets managed by ACME, Inc..</p><p>Accounts and maintains IS assets as defined by organizational procedures.</p><p>Advises InfoSec on appropriate Security and Awareness Training.</p><h4>4.3 HR DEPARTMENT</h4><p>Responsible for assigning and alerting Security Awareness and Training during the onboarding process.</p><p>Responsible for assigning and alerting the continuation of Security Awareness and Training throughout an employee’s tenure.</p><h4>4.4 DEPARTMENT MANAGERS</h4><p>Ensures that team members complete required training and understand their responsibilities.</p><h4>5 COMPLIANCE</h4><p>For ACME, Inc. personnel, failure to comply with this policy may result in disciplinary actions up to and including dismissal from ACME, Inc. employment and removal from access to the IS services and components. ACME, Inc. personnel are subject to any applicable legal requirements for compliance violations of this policy. Depending on the legal requirements, and the nature of the violation, penalties could include fines and/or criminal charges.</p><h4>6 POLICY METHODOLOGY</h4><p>6.1 ENSURE THAT MANAGERS, SYSTEMS ADMINISTRATORS, AND USERS OF ORGANIZATIONAL SYSTEMS ARE MADE AWARE OF THE SECURITY RISKS ASSOCIATED WITH THEIR ACTIVITIES AND OF THE APPLICABLE POLICIES, STANDARDS, AND PROCEDURES RELATED TO THE SECURITY OF THOSE SYSTEMS.ENSURE THAT PERSONNEL ARE TRAINED TO CARRY OUT THEIR ASSIGNED INFORMATION SECURITY-RELATED DUTIES AND RESPONSIBILITIES.PROVIDE SECURITY AWARENESS TRAINING ON RECOGNIZING AND REPORTING POTENTIAL INDICATORS OF INSIDER THREAT.</p><p>NIST Mappings</p><p>NIST SP 800-171 rev. 2</p><p>3.2.13.2.23.2.3</p><p>Basic Security RequirementsBasic Security RequirementsDerived Security Requirements</p><p>NIST SP 800-53 rev. 4</p><p>AT-2AT-2(2)AT-3</p><p>Security Awareness Training (SAT)SAT – Insider ThreatRole-Based Security Training</p><p>All ACME, Inc. personnel are required to complete security training as outline in the ACME, Inc. Technical Standards document, to be better positioned to protect FCI and CUI data as follows:</p><p>Within thirty (30) days of hire.</p><p>Refresher training annually as scheduled by the HR &amp; InfoSec Department.</p><p>Any significant/sentinel/novel event caused by an individual, policy or process which changes ACME, Inc.’s risk posture.</p><p>Any major system changes the InfoSec Department may require additional security, insider threat, or specific system component training necessary.</p><p>Staff on extended medical leave are exempt from training requirements until they can return to work.</p><p>Role Based Training will be provided to all administrator personnel to carry out responsibilities specific to their role (i.e. Privileged Users etc.).</p><p>Supervisors must complete appropriate management training in accordance with the HR training policy.</p><h4>BREACHES OF THIS POLICY</h4><p>Compliance with this Policy is mandatory in all cases. Any breaches of this Policy will result in disciplinary action, up to and including termination of employment. Employees must report any actual or suspected breach of this Policy. Reports can be made via your supervisor, Human Resources, an Ethics Champion, or the ACME, Inc. Hotline at +1 (833) 996-3948 (toll-free in the U.S. only; international rates apply outside the U.S.)</p>","CMMC_AUDIT_AND_ACCOUNTABILITY_POLICY.docx":"<p>420370276225290090900</p><p>CMMC Audit and Accountability Policy</p><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>4/20/23</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>The purpose of this document is to establish the &lt;System Name&gt; logging and auditing policy and procedures, and to identify staff roles and responsibilities in support of audit and accountability procedures. This document addresses: the creation, protection, and retention of information system audit records to the extent needed to enable the monitoring, analysis, investigation, and reporting of unlawful, unauthorized, or inappropriate information system activity; and how the actions of individual information system users can be uniquely traced to those users so they can be held accountable for their actions.</p><p>The LP3 Information Security policy serves to be consistent with best practices associated with organizational Information Security management. The intent of this policy is to establish a method that will be used to evaluate third party services which host LP3 Information and third-party products which are procured to process LP3 information, for information security risks.</p><p>Scope</p><p>The scope of this policy is applicable to all IT resources owned or operated by LP3. Any information not specifically identified as the property of other parties, that is transmitted or stored on LP3 IT resources (including e-mail, messages, and files) is the property of LP3. All users of LP3 IT resources are responsible for adhering to this policy.</p><p>Roles and Responsibilities</p><p>The LP3 Chief Information Security Officer (CISO) is &lt;???&gt;.</p><p>The LP3 Information Technology Manager (ITM) is &lt;???&gt;.</p><p>The LP3 Information System Security Manager (ISSM) is &lt;???&gt;.</p><p>Contents</p><p>TOC \\o \"1-3\" \\h \\z \\u Update History\t PAGEREF _Toc236735456 \\h 1</p><p>Purpose\t PAGEREF _Toc236735457 \\h 2</p><p>Scope\t PAGEREF _Toc236735458 \\h 2</p><p>Roles and Responsibilities\t PAGEREF _Toc236735459 \\h 2</p><p>Table of contents\t PAGEREF _Toc236735460 \\h 2</p><p>AU.L2-3.3.1: Create and retain system audit logs and records to the extent needed to enable the monitoring, analysis, investigation, and reporting of unlawful or unauthorized system activity.\t PAGEREF _Toc236735461 \\h 4</p><p>New section title\t PAGEREF _Toc236735462 \\h 5</p><p>LP3:\t PAGEREF _Toc236735463 \\h 5</p><p>Real-Time Audit Procedures:\t PAGEREF _Toc236735464 \\h 5</p><p>Daily Audit Procedures:\t PAGEREF _Toc236735465 \\h 6</p><p>AU.L2-3.3.3: Review and update logged events\t PAGEREF _Toc236735466 \\h 6</p><p>Reviews and update Procedures:\t PAGEREF _Toc236735467 \\h 6</p><p>AU.L2-3.3.4: Alert in the event of an audit logging process failure\t PAGEREF _Toc236735468 \\h 6</p><p>AU.L2-3.3.5: Correlate audit record review, analysis, and reporting processes for investigation and response to indications of unlawful, unauthorized, suspicious, or unusual activity\t PAGEREF _Toc236735469 \\h 7</p><p>AU.L2-3.3.6: Provide audit record reduction and report generation to support on-demand analysis and reporting\t PAGEREF _Toc236735470 \\h 7</p><p>AU.L2-3.3.7: Provide a system capability that compares and synchronizes internal system clocks with an authoritative source to generate time stamps for audit records.\t PAGEREF _Toc236735471 \\h 7</p><p>LP3's information system:\t PAGEREF _Toc236735472 \\h 7</p><p>AU.L2-3.3.8: Protect audit information and audit logging tools from unauthorized access, modification, and deletion\t PAGEREF _Toc236735473 \\h 8</p><p>New section title\t PAGEREF _Toc236735474 \\h 8</p><p>Appendix A - Acronyms\t PAGEREF _Toc236735475 \\h 8</p><p>Acronym\t PAGEREF _Toc236735476 \\h 8</p><p>Definition\t PAGEREF _Toc236735477 \\h 8</p><p>AU.L2-3.3.1: Create and retain system audit logs and records to the extent needed to enable the monitoring, analysis, investigation, and reporting of unlawful or unauthorized system activity.</p><p>LP3 IT Support Team in conjunction with the approval of the IT Authority and Configuration Control Board (CCB):</p><p>• Coordinates the security audit function with the Security Officer (SO) requiring audit-related information to enhance mutual support and to help guide the selection of auditable events.</p><p>• Provides a rationale for why the auditable events are deemed to be adequate to support after-the-fact investigations of security incidents.</p><p>• Determines what events are to be audited, and with what frequency, within the information system.</p><p>The LP3 information system captures sufficient information in audit records to establish what events occurred, the sources of the events and the outcomes of the events. The LP3 IT Manager (ITM) maintains information system practice documents detailing the utilities/tools that:</p><p>• Provide audit record generation capability for the auditable events defined by the IT Support Team and approved by the CCB.</p><p>• Allow LP3 defined personnel to select which auditable events are to be audited by specific components of the information system.</p><p>• Generate audit records for the events and content defined by the ITA and approved by the CCB.</p><p>Supplemental Information Procedures:</p><p>For most audit records, the following information will be transcribed:</p><p>• Date and time of the event</p><p>• Component (e.g., hardware, software) of the information system where the event occurred</p><p>• Type of event</p><p>• Subject identity</p><p>• Outcome (success or failure) of the event</p><p>LP3 ITM shall maintain &lt;a practice document&gt; detailing how systems are configured to allocate sufficient audit record storage capacity and configures auditing to prevent such capacity being exceeded. The ITM shall also maintain &lt;a practice document&gt; detailing measures to ensure that long-term audit records generated by the information system can be retrieved. The period that these records will be maintained will be decided by the ITA.</p><p>Any changes to the retention or configuration must be approved by the CCB.</p><p>New section title</p><p>LP3:</p><p>• Determines that the information system is capable of auditing the following events:</p><p>• When someone has changed an Active Directory user account name,</p><p>• Enabled or disabled a user account,</p><p>• Created or deleted a user account</p><p>• Changed a user account password</p><p>• Changed a user group</p><p>• Changed an Active Directory computer object name</p><p>• Enabled or disabled a computer object</p><p>• Created or deleted a computer object</p><p>• Instances of a user logging on or logging off</p><p>• Failed logons, or failed accesses related to information systems (file access auditing)</p><p>• Administrative privilege usage, PIV credential usage, and third-party credential usage</p><p>• When computer or devices are added to the network</p><p>• Software installed on servers and computers.</p><p>• Coordinates the security audit function with other organizational entities requiring audit-related information to enhance mutual support and to help guide the selection of auditable events.</p><p>• Provides a rationale for why the auditable events are deemed to be adequate to support after-the-fact investigations of security incidents; and</p><p>• Determines that the following events are to be audited within the information system:</p><p>Real-Time Audit Procedures:</p><p>The following events will be audited near real-time:</p><p>• When someone has changed an Active Directory user account name</p><p>• Enabled or disabled a user account</p><p>• Created or deleted a user account</p><p>• Changed a user account password</p><p>• Changed a user group</p><p>• Changed an Active Directory computer object name</p><p>• Enabled or disabled a computer object</p><p>• Created or deleted a computer object</p><p>• Instances of a user logging on or logging off</p><p>• Failed logons, or failed accesses related to information systems (file access auditing)</p><p>• Administrative privilege usage, PIV credential usage, and third-party credential usage</p><p>• Network and VMware server environment events.</p><p>Daily Audit Procedures:</p><p>The following events will be audited each day, when computer or devices are added to the network, and when new software is installed on servers and computers, using Vendor’s Systems to collect and monitor events:</p><p>• (Third-party firewall software/hardware) manages our edge firewalls and will use the firewall IPS/IDS features to collect and monitor logs. &lt;External Vendor&gt;’s Security Operations Center will alert us and take steps to stop intrusions or any other type of unwanted activity.</p><p>• Microsoft System Center Configuration Manager (SCCM), or other applicable software, will be used to collect and report on events such as virus detection, software installs, and updates/patches for our information systems.</p><p>• (Third-party software) will be used to collect and report on events such as Anti-malware and Anti-exploit detections for our information systems.</p><p>• (Third-party software) will be used to collect and report on events such hardware/software installs, and new computer/devices added to the network.</p><p>• Microsoft Windows &lt;logging and alerting software TBD&gt; will be used to collect and flag alerts from systems such as Windows Server and Active Directory.</p><p>• (Third-party software) manages our network switch and (third-party software) server environments and will collect, alert on, and take steps to remediate events.</p><p>AU.L2-3.3.3: Review and update logged events</p><p>Reviews and update Procedures:</p><p>LP3 reviews and updates the audited events as determined by the risk/impact of the audited process.</p><p>The information system Administrator(s) will review and update the list of logged events, as necessary. Events are to be added as deemed necessary by risk assessment, incident response/recovery, information from outside source concerning a threat, etc.</p><p>All additional event logging must comply with all applicable laws and regulations.</p><p>AU.L2-3.3.4: Alert in the event of an audit logging process failure</p><p>LP3's &lt;The information system&gt;:</p><p>• Alerts IT Helpdesk Specialist and Information System Security Manager (ISSM) in the event of an audit processing failure; and</p><p>Takes additional actions to overwrite oldest audit records. &lt;In line with client’s AC policies&gt;</p><p>AU.L2-3.3.5: Correlate audit record review, analysis, and reporting processes for investigation and response to indications of unlawful, unauthorized, suspicious, or unusual activity</p><p>LP3:</p><p>• Reviews and analyzes information system audit records Monthly for indications of inappropriate or unusual activity dealing with non-alerted and alerted events to detect trends and</p><p>• Reports findings to IT Helpdesk Specialist and ISSM.</p><p>AU.L2-3.3.6: Provide audit record reduction and report generation to support on-demand analysis and reporting</p><p>The information system provides an audit reduction and report generation capability that:</p><p>• Supports on-demand audit review, analysis, and reporting requirements and after-the-fact investigations of security incidents; and</p><p>• Does not alter the original content or time ordering of audit records.</p><p>AU.L2-3.3.7: Provide a system capability that compares and synchronizes internal system clocks with an authoritative source to generate time stamps for audit records.</p><p>LP3's information system:</p><p>• Uses internal system clocks to generate time stamps for audit records; and</p><p>• Records time stamps for audit records that can be mapped to Eastern Standard Time Zone and meets the maximum of a (###) Minute time delta.</p><p>• Synchronization with authoritative time source</p><p>• Compares the internal information system clocks using the poll rate of 1024 Secs with [Internal time source] which uses the authoritative time source us.pool.ntp.org (NTP Pool Project) and</p><p>• Synchronizes the internal system clocks to the authoritative time source when the time difference is greater than 300 seconds.</p><p>AU.L2-3.3.8: Protect audit information and audit logging tools from unauthorized access, modification, and deletion</p><p>LP3's information system protects audit information and audit tools from unauthorized access, modification, and deletion with tiered access controls.</p><p>New section title</p><p>LP3 authorizes access to management of audit functionality to only Domain Administrators. Each Domain Administrator has a separate account (other than their normal user account) that is used for domain administrative access.</p><p>Appendix A - Acronyms</p><p>Acronym</p><p>Definition</p><h4>APT</h4><p>Advanced Persistent Threat</p><h4>CCB</h4><p>Configuration Control Board</p><h4>CEO</h4><p>Chief Executive Officer</p><h4>CISO</h4><p>Chief Information Security Officer</p><h4>CMMC</h4><p>Cybersecurity Maturity Model Certification</p><h4>COO</h4><p>Chief Operating Officer</p><h4>CFR</h4><p>Code of Federal Regulations</p><h4>CUI</h4><p>Controlled Unclassified Information</p><h4>CVE</h4><p>Common Vulnerabilities and Exposures</p><h4>CVSS</h4><p>Common Vulnerability Scoring System</p><h4>CWE</h4><p>Common Weakness Enumeration</p><p>DM</p><p>Department Manager</p><h4>DMZ</h4><p>Demilitarized Zone</p><h4>GPO</h4><p>Group Policy Object</p><p>HR</p><p>Human Resources</p><h4>IDS</h4><p>Intrusion Detection System</p><h4>IPS</h4><p>Intrusion Prevention System</p><h4>IRP</h4><p>Incident Response Plan</p><h4>IRT</h4><p>Incident Response Team</p><h4>ISSM</h4><p>Information System Security Manager</p><h4>ISSO</h4><p>Information System Security Officer</p><p>IT</p><p>Information Technology</p><h4>ITM</h4><p>IT Manager</p><h4>NARA</h4><p>National Archives and Records Administration</p><h4>NVD</h4><p>National Vulnerability Database</p><h4>OVAL</h4><p>Open Vulnerability Assessment Language</p><h4>POA&amp;M</h4><p>Plan of Action and Milestones</p><h4>PSP</h4><p>Policies, Standards, and Procedures</p><h4>SAP</h4><p>Security Assessment Policy</p><p>SO</p><p>Security Officer</p><h4>SSP</h4><p>System Security Plan</p><h4>VPN</h4><p>Virtual Private Network</p>","CMMC_CONFIGURATION_MANAGEMENT_POLICY.docx":"<p>420370276225290090900</p><h4>CMMC CONFIGURATION MANAGEMENT POLICY</h4><p>V1.0   July 2026</p><p>Approved for dissemination to all LP3 personnel and contractors</p><p>_______________________\t\t______________</p><p>Scott Lawler, CEO\t\t\t\tDate</p><p>Update History</p><p>Version</p><p>Changes</p><p>Updated by</p><p>Date</p><p>Initial Draft</p><p>David Wyatt</p><p>7/02/24</p><p>0.2</p><p>Minor Updates</p><p>Jim Magee</p><p>7/30/24</p><p>V1.0</p><p>Approved</p><p>Scott Lawler</p><p>Purpose</p><p>This policy establishes the Enterprise Configuration Management Policy, for managing risks from system changes impacting baseline configuration settings, system configuration and security. The configuration Management program helps LP3 document, authorize, manage, and control system changes impacting Information Systems. The LP3 Information Security policy serves to be consistent with best practices associated with organizational Information Security management. It is the intention of this policy to establish a configuration Management capability throughout LP3 and its business units for documenting, authorizing, managing, and controlling configuration changes which may occur across the enterprise environment.</p><p>Scope</p><p>The scope of this policy is applicable to all IT resources owned or operated by LP3. Any information not specifically identified as the property of other parties, that is transmitted or stored on LP3 IT resources (including e-mail, messages, and files) is the property of LP3. All users LP3 employees, contractors, vendors, or others) of IT resources are responsible for adhering to this policy.</p><p>Roles and Responsibilities</p><p>The LP3 Chief Information Security Officer (CISO) - Oversees the development and execution of the cybersecurity awareness training program. Serves as a liaison to the users, IT department, law enforcement, and other stakeholders.</p><p>The LP3 IT Manager (ITM) - Ensures the safeguarding of information and ensuring a resilient cybersecurity posture within LP3. Some key responsibilities include:</p><p>• Risk Management</p><p>• Security Policies and Procedures</p><p>• Security Architecture</p><p>• Vulnerability Management</p><p>• Incident Response</p><p>• Access Control</p><p>• Collaboration with IT Teams</p><p>• Security Awareness Training</p><p>• Security Monitoring</p><p>• Security Audits and Compliance</p><p>• Policy and Regulation Awareness</p><p>• Security Incident Reporting</p><p>Contents</p><p>TOC \\o \"1-3\" \\h \\z \\u Update History\t PAGEREF _Toc236737362 \\h 2</p><p>Purpose\t PAGEREF _Toc236737363 \\h 2</p><p>Scope\t PAGEREF _Toc236737364 \\h 2</p><p>Roles and Responsibilities\t PAGEREF _Toc236737365 \\h 2</p><p>CM.L2-3.4.1: Establish and maintain baseline configurations and inventories of organizational systems (including hardware, software, firmware, and documentation) throughout the respective system development life cycles\t PAGEREF _Toc236737366 \\h 4</p><p>Baseline Configuration\t PAGEREF _Toc236737367 \\h 4</p><p>CM.L2-3.4.2: Establish and enforce security configuration settings for information technology products employed in organizational systems\t PAGEREF _Toc236737368 \\h 5</p><p>CM.L2-3.4.3: Track, review, approve, or disapprove, and log changes to organizational systems\t PAGEREF _Toc236737369 \\h 6</p><p>CM.L2-3.4.4: Analyze the security impact of changes prior to implementation\t PAGEREF _Toc236737370 \\h 7</p><p>Security Impact Analysis\t PAGEREF _Toc236737371 \\h 7</p><p>CM.L2-3.4.5: Define, document, approve, and enforce physical and logical access restrictions associated with changes to organizational systems\t PAGEREF _Toc236737372 \\h 7</p><p>LP3:\t PAGEREF _Toc236737373 \\h 7</p><p>CM.L2-3.4.6: Employ the principle of least functionality by configuring organizational systems to provide only essential capabilities\t PAGEREF _Toc236737374 \\h 8</p><p>LP3:\t PAGEREF _Toc236737375 \\h 8</p><p>Periodic Review\t PAGEREF _Toc236737376 \\h 9</p><p>Prevent Program Execution\t PAGEREF _Toc236737377 \\h 9</p><p>Registration Compliance\t PAGEREF _Toc236737378 \\h 9</p><p>Unauthorized Software/Blacklisting\t PAGEREF _Toc236737379 \\h 9</p><p>CM.L2-3.4.7: Restrict, disable, or prevent the use of nonessential programs, functions, ports, protocols, and services\t PAGEREF _Toc236737380 \\h 10</p><p>LP3:\t PAGEREF _Toc236737381 \\h 10</p><p>CM.L2-3.4.8: Apply deny-by-exception (blacklisting) policy to prevent the use of unauthorized software or deny-all, permit-by-exception (whitelisting) policy to allow the execution of authorized software\t PAGEREF _Toc236737382 \\h 11</p><p>CM.L2-3.4.9: Control and monitor user-installed software\t PAGEREF _Toc236737383 \\h 11</p><p>LP3:\t PAGEREF _Toc236737384 \\h 11</p><p>CM.L2-3.4.1: Establish and maintain baseline configurations and inventories of organizational systems (including hardware, software, firmware, and documentation) throughout the respective system development life cycles</p><p>Baseline Configuration</p><p>LP3 develops, documents, and maintains under configuration control, a current baseline configuration of the information system.</p><p>This control establishes baseline configurations for information systems and system components including communications and connectivity-related aspects of systems. Baseline configurations are documented, formally reviewed and agreed-upon sets of specifications for information systems or configuration items within those systems. Baseline configurations serve as a basis for future builds, releases, and/or changes to information systems.</p><p>Baseline configurations include information about information system components (e.g., standard software packages installed on workstations, notebook computers, servers, or mobile devices; current version numbers and patch information on operating systems and applications; and configuration settings/parameters), network topology, and the logical placement of those components within the system architecture.</p><p>Maintaining baseline configurations requires creating new baselines as organizational information systems change over time. Baseline configurations of information systems reflect the current enterprise architecture.</p><p>Changes that must be documented include, but are not limited to:</p><p>• Firewall Access Control List (ACL) changes</p><p>• Routing/switching/and network addressing changes</p><p>• Software installation/removal</p><p>• Hardware modifications</p><p>• Voice systems programming and changes</p><p>• Physical moves of infrastructure</p><p>• System deployment/decommission</p><p>LP3 IT Manager (ITM) is responsible for:</p><p>• Maintaining practice documents detailing the baseline configurations for information system development and test environments that is managed separately from the operational baseline configuration.</p><p>• Ensuring all baselines masters will be vaulted to ensure integrity; with updates approved by the IT Authority or Configuration Control Board (CCB).</p><p>• Overseeing when and how the department may employ multiple automated tools/utilities or mechanisms to maintain an up-to-date, complete, accurate, and readily available baseline configuration of the information system.</p><p>• Ensuring all automated tools/utilities or mechanisms utilized are approved by the IT Authority or CCB.</p><p>• Ensuring IT staff only utilize automated tools/utilities or mechanisms to centrally manage, apply, and verify approved configuration settings for all LP3 information system components are approved by the ITM, IT Authority, or CCB; and</p><p>• Ensuring information systems prevent program execution in accordance with defined policies regarding software program usage and restrictions; rules authorizing the terms and conditions of software program usage.</p><p>CM.L2-3.4.2: Establish and enforce security configuration settings for information technology products employed in organizational systems</p><p>LP3 IT is responsible to ensure ITMs enforce the maintenance of current practice documentation by IT staff that:</p><p>1. Establishes and documents configuration settings for information technology products employed within the information system using defined security configuration checklists that reflect the most restrictive mode consistent with operational requirements.</p><h4>2. Implements the configuration settings.</h4><p>3. Identifies, documents, and approves any deviations from established configuration settings for defined information system components based on operational requirements.</p><p>4. Monitors and controls only approved changes made to the configuration settings in accordance with LP3 policies and procedures.</p><p>5. Defines and approves a practice standard defining security safeguards to respond to unauthorized changes to configuration settings.</p><p>6. Ensures compliance with periodic reviews of LP3 registration requirements for functions, ports, protocols, and services. Practice documents will be maintained to manage new, updates or modifications to registration of functions, port, protocols, and services; and</p><p>7. Reviews and approves all configuration deployments for least privilege enforcement as appropriate to ensure the IT Staff.</p><p>a. Configures the information system to provide only essential capabilities; and</p><p>b. Prohibits or restricts the use of defined prohibited or restricted functions, ports, protocols, and/or services.</p><p>CM.L2-3.4.3: Track, review, approve, or disapprove, and log changes to organizational systems</p><p>LP3:</p><p>• Determines the types of changes to the information system that are configuration controlled.</p><p>• Reviews proposed configuration-controlled changes to the information system and approves or disapproves such changes with explicit consideration for security impact analyses.</p><p>• Documents configuration change decisions associated with the information system and allowed only IT Help Desk to make physical or logical changes to individual computers, software, and portable media and devices.</p><p>• Implements approved configuration-controlled changes to the information system.</p><p>• Retains records of configuration-controlled changes to the information system for One Year.</p><p>• Audits and reviews activities associated with configuration-controlled changes to the information system; and</p><p>• Coordinates and provides oversight for configuration change control activities through IT Change Control Board that convenes as needed.</p><p>Configuration change controls for organizational information systems involve the systematic proposal, justification, implementation, testing, review, and disposition of changes to the systems, including system upgrades and modifications.</p><p>Configuration change control includes changes to baseline configurations for components and configuration items of information systems, changes to configuration settings for information technology products (e.g., operating systems, applications, firewalls, routers, and mobile devices), unscheduled/unauthorized changes, and changes to remediate vulnerabilities.</p><p>Typical processes for managing configuration changes to information systems include, for example, Configuration Control Boards that approve proposed changes to systems. For new development information systems or systems undergoing major upgrades, organizations consider including representatives from development organizations on the Configuration Control Boards. Auditing of changes includes activities before and after changes are made to organizational information systems and the auditing activities required to implement such changes.</p><p>CM.L2-3.4.4: Analyze the security impact of changes prior to implementation</p><p>Security Impact Analysis</p><p>Organizational personnel with information security responsibilities such as Information System Security Manager will conduct security impact analyses. Individuals conducting security impact analyses possess the necessary skills/technical expertise to analyze the changes to information systems and the associated security ramifications. Security impact analysis may include, for example, reviewing security plans to understand security control requirements and reviewing system design documentation to understand control implementation and how specific changes might affect the controls.</p><p>Security impact analyses may also include assessments of risk to better understand the impact of the changes and to determine if additional security controls are required. Security impact analyses are scaled in accordance with the security categories of the information systems.</p><p>CM.L2-3.4.5: Define, document, approve, and enforce physical and logical access restrictions associated with changes to organizational systems</p><p>LP3:</p><p>• Determines the types of changes to the information system that are configuration controlled.</p><p>• Reviews proposed configuration-controlled changes to the information system and approves or disapproves such changes with explicit consideration for security impact analyses.</p><p>• Documents configuration change decisions associated with the information system and allowed only IT Help Desk to make physical or logical changes to individual computers, software, and portable media and devices.</p><p>• Implements approved configuration-controlled changes to the information system.</p><p>• Retains records of configuration-controlled changes to the information system for One Year.</p><p>• Audits and reviews activities associated with configuration-controlled changes to the information system; and</p><p>• Coordinates and provides oversight for configuration change control activities through IT Change Control Board that convenes monthly.</p><p>Configuration change controls for organizational information systems involve the systematic proposal, justification, implementation, testing, review, and disposition of changes to the systems, including system upgrades and modifications.</p><p>Configuration change control includes changes to baseline configurations for components and configuration items of information systems, changes to configuration settings for information technology products (e.g., operating systems, applications, firewalls, routers, and mobile devices), unscheduled/unauthorized changes, and changes to remediate vulnerabilit
